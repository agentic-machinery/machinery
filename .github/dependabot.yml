# Dependabot — automated dependency updates
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
# No auto-merge anywhere: every Dependabot PR must pass CI Gate and review as usual.
version: 2
updates:
  # uv (Python: pyproject.toml and uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait 7 days after a release before opening a version-update PR (matches
    # [tool.uv].exclude-newer = "7 days" in pyproject.toml and satisfies
    # zizmor's dependabot-cooldown >= 7 rule).
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    # One grouped PR per ecosystem.
    groups:
      uv:
        patterns:
          - "*"
    ignore:
      # Tools pinned in .github/workflows/pins.txt that must move together with
      # pins.txt, ci-gate.yml, tests.yml, prepublication-gate.sh, and/or
      # lu_machinery/lint/mypy_baseline.json.
      - dependency-name: "mypy"
      - dependency-name: "pip-audit"
      - dependency-name: "ruff"
      - dependency-name: "semgrep"
      - dependency-name: "zizmor"

  # npm (machinery-owned package.json and package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    # One grouped PR per ecosystem.
    groups:
      npm:
        patterns:
          - "*"

  # GitHub Actions (.github/workflows/ and .github/actions/)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    # One grouped PR per ecosystem.
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # Actions whose commit SHAs are pinned in .github/workflows/pins.txt
      # (and packaging/machinery-security/pins.txt) and must move together
      # with those records.
      - dependency-name: "actions/cache"
      - dependency-name: "actions/cache/*"
      - dependency-name: "actions/checkout"
      - dependency-name: "actions/upload-artifact"
      - dependency-name: "astral-sh/setup-uv"
      - dependency-name: "github/codeql-action"
      - dependency-name: "github/codeql-action/*"
