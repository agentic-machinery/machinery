# DRAFT for the public learn-ukrainian/machinery repository (machinery move
# plan v1, section 4 steps 4 and 7). Install it there as
# .github/workflows/ci-gate.yml before final history clearance. It is not a
# check in this source repository.
#
# Bootstrap CI for the first push. Branch protection requires one check named
# "CI Gate", and the merge queue ruleset waits for that check on merge groups.
# Main pushes reuse a successful merge-group result for the same Git tree and
# seed shared, verified tool archives without repeating context-free checks. Pins and their
# upstream evidence are recorded in pins.txt beside this file; bump them
# together there.
#
# - Jobs: Ruff over lu_machinery/ with the lint settings in pyproject.toml,
#   plus unbounded JSON reader lint and CHANGELOG.md empty-Unreleased check; compileall
#   of lu_machinery on the pinned Python and the supported floor; the mypy ratchet (lu_machinery.lint.mypy_ratchet:
#   new errors fail, the baseline only shrinks); the test-wait lint L4
#   (lu_machinery.lint.lint_test_waits: a new sleep, timer poll, flaky or rerun
#   mark, rerun option, or non-strict xfail fails, and the baseline only shrinks);
#   fleet-security (calls reusable fleet-security.yml for actionlint, ShellCheck
#   over .github/ at style plus tracked shell trees at error, zizmor offline and
#   Trivy dependency/licence scanning over package-lock.json and uv.lock);
#   secret-scan (calls reusable fleet-security.yml for the TruffleHog history
#   scan, running on every event including reuse pushes) and the Semgrep SAST
#   scan; dependency-audit (pip-audit of the uv.lock runtime closure, npm audit
#   of package-lock.json with pinned Node/npm). The secret-scan and sast jobs
#   below are the only definition of each scan for the machinery repository;
#   CodeQL code scanning is codeql.yml beside this file, outside the gate.
#   installed-wheel builds the release wheel from the tracked tree, installs it
#   offline with the uv.lock runtime export (pip --require-hashes) into clean
#   core and per-extra venvs and imports every lu_machinery module on the pinned
#   Python. On PRs and merge groups it checks the wheel against the product
#   commit in product-consumer.pin. It runs release_cut consumer-collection and
#   the pin's key consumer tests.
#   pytest calls tests.yml for the full six-shard suite on
#   merge_group, unmatched push and workflow_dispatch. pull_request calls that workflow
#   as pr-affected and does not run the full suite.
# - The mypy job imports lu_machinery from the checkout: it runs the ratchet
#   module. The test-wait job does the same for lu_machinery.lint.lint_test_waits.
#   installed-wheel imports only the installed wheel.
# - Every job counts its targets first and fails on zero, because the tools
#   exit 0 on an empty or missing target. Each job prints what it inspected.
# - CI Gate needs every other job, runs even when one of them fails, and passes
#   only when each job reports the result its event requires. On pull_request,
#   pr-affected must succeed and pytest must be skipped. On merge_group, unmatched push
#   and workflow_dispatch, pytest (the full suite) must succeed and pr-affected
#   must be skipped. A matched main push instead requires main-proof and skips
#   context-free checks, while push history scans and trailers still run.
#   A failed, cancelled, skipped or missing required job fails
#   the gate, because GitHub counts a skipped required check as passing. Each check name is the job
#   name. The called tests.yml reports its shards as "pytest / pytest (N)"
#   and their always() aggregate as "pytest / pytest shards"; `pytest` here
#   succeeds only if all of them do. On pull_request that job is skipped and
#   `pr-affected` is required instead. A failed, cancelled, skipped or missing
#   required job fails the gate on every event. A new job must be added to both
#   `needs` and the gate's expected list; nothing else catches a job left out of both.
# - Hosted runners only (ubuntu-24.04). Every tool is downloaded at a pinned
#   version and checked against a pinned SHA-256 before it runs: release
#   tarballs for actionlint, ShellCheck, zizmor, TruffleHog, Trivy and uv;
#   uv-managed CPython (uv checks each download against the hash it ships);
#   `uv sync --locked` from uv.lock, which checks the SHA-256 of every wheel,
#   for Ruff, mypy, pip-audit and Semgrep. The build tools use hash-pinned PyPI
#   wheels (pip --require-hashes --only-binary=:all:). npm audit uses the pinned
#   Node/npm release via actions/setup-node. Every venv lives in the job temp
#   directory. Installers that run Python use isolated interpreters (python -I),
#   so no Python module in the checkout is imported while installing.
# - Read-only contents permission, no kept checkout token,
#   no secrets. Scanners and zizmor run under `env -i`, so no runner credential
#   reaches them. zizmor runs offline: its online audits (impostor commits,
#   known-vulnerable actions) need a token, and the action pins in pins.txt are
#   checked against their upstream tags instead.
# - Suppressions (.trufflehogignore, trufflehog:ignore, nosemgrep, noqa, Ruff
#   and zizmor configuration) are repository content and are reviewed in the
#   diff, like this workflow.
name: CI Gate

on:
  # Reuse verified merge-group trees; keep main-scope tool archives for future refs.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    branches: [main]
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

# Python: machinery jobs default to the uv-managed CPython in .python-version.
# .github/actions/uv-python installs it with the uv release pinned below.
# Python dependencies come from uv.lock (`uv sync --locked`,
# which checks every SHA-256 in the lock). The build tools that release_cut
# reads from this file use hash-pinned heredocs.
# Cache only verified release archives, never venvs or repository build outputs.
# Fork PRs restore only. No prefix restore keys.
env:
  UV_VERSION: "0.13.9"
  UV_LINUX_X86_64_SHA256: a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5
  # uv-managed CPython only, the build the host runs; never the runner's own.
  UV_PYTHON_PREFERENCE: only-managed
  BUBBLEWRAP_DEB: bubblewrap_0.11.1-1ubuntu0.3_amd64.deb
  BUBBLEWRAP_DEB_SHA256: d3a6c1b6b0e0474eaed6dbd055c0d601fd875af153976a0dc4aae75f4ea10868
  NODE_VERSION: "22.23.4"
  NPM_VERSION: "10.9.9"
  RUFF_VERSION: "0.15.21"
  MYPY_VERSION: "2.4.0"
  ZIZMOR_VERSION: "1.31.1"
  ZIZMOR_RELEASE_ASSET_ID: "645467284"
  ZIZMOR_LINUX_X86_64_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
  PIP_AUDIT_VERSION: "2.10.1"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_RELEASE_ASSET_ID: "384924896"
  ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_RELEASE_ASSET_ID: "336391469"
  SHELLCHECK_LINUX_X86_64_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
  TRUFFLEHOG_VERSION: "3.99.0"
  TRUFFLEHOG_RELEASE_ASSET_ID: "616256576"
  TRUFFLEHOG_LINUX_AMD64_SHA256: e35ae3fd1e4b7a0c1699d0fda1814282bf906d03379bd4337b092b3a84c6740b
  SEMGREP_VERSION: "1.183.0"
  SEMGREP_RULES_COMMIT: 16b9e6d45f10649f6a531ec4838ed9924372c3bc

jobs:
  main-proof:
    name: Reuse verified merge-group tree
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    # An unavailable reuse optimization falls back to the full required checks.
    # History checks independently refuse a missing history-base output.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.proof.outputs.reuse }}
      source: ${{ steps.proof.outputs.source }}
      history-base: ${{ steps.history.outputs.base }}
    steps:
      - name: Find the last successful main history checks
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # event.before can belong to a cancelled run. A successful earlier
          # main run is a conservative checkpoint: both history jobs finished.
          # No checkpoint or API error fails closed, never back to event.before.
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-gate.yml/runs?event=push&branch=main&status=success&per_page=100")"
          source="$(jq -ec --arg repo "$GITHUB_REPOSITORY" --argjson number "$GITHUB_RUN_NUMBER" '
            [.workflow_runs[]
             | select(.event == "push" and .head_branch == "main")
             | select(.status == "completed" and .conclusion == "success")
             | select(.repository.full_name == $repo and .head_repository.full_name == $repo)
             | select(.path == ".github/workflows/ci-gate.yml")
             | select((.run_number | type) == "number" and .run_number < $number)
             | select((.id | type) == "number" and .id > 0)
             | select((.run_attempt | type) == "number" and .run_attempt > 0)
             | select(.head_sha | test("^[0-9a-f]{40}$"))]
            | sort_by(.run_number) | last
            | select(. != null)
            | {run_id: .id, run_attempt: .run_attempt, commit: .head_sha}' <<< "$runs")"
          run_id="$(jq -r .run_id <<< "$source")"
          attempt="$(jq -r .run_attempt <<< "$source")"
          scanned="$(jq -r .commit <<< "$source")"
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100")"
          jq -e --arg sha "$scanned" '
            . as $jobs
            | ($jobs.jobs | any(.[];
                .name == "Verified trailer" and .head_sha == $sha
                and .status == "completed" and .conclusion == "success"))
            and (
              ($jobs.jobs | any(.[];
                .name == "Secret scan (TruffleHog)" and .head_sha == $sha
                and .status == "completed" and .conclusion == "success"))
              or (
                ($jobs.jobs | any(.[];
                  .name == "Secret scan / Secret scan (TruffleHog)" and .head_sha == $sha
                  and .status == "completed" and .conclusion == "success"))
                and ($jobs.jobs | any(.[];
                  .name == "Secret scan / Fleet security gate" and .head_sha == $sha
                  and .status == "completed" and .conclusion == "success"))
              )
            )
            ' <<< "$jobs" > /dev/null
          # Merge-base also covers every commit reachable only from this head
          # after a divergent push. Only immutable SHAs go to the compare API.
          base="$(gh api "repos/$GITHUB_REPOSITORY/compare/$scanned...$GITHUB_SHA" --jq '.merge_base_commit.sha')"
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          [[ "$base" != "$GITHUB_SHA" ]]
          jq -nc --arg base "$base" --arg head "$GITHUB_SHA" --argjson source "$source" \
            '{history_base: $base, head: $head, source: $source}' >> "$GITHUB_STEP_SUMMARY"
          printf 'base=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Find successful CI Gate for this tree
        id: match
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Bind both commit and tree: equal trees alone can hide intermediate
          # direct-push commits from the range-based secret scan. Never read refs.
          # Any unavailable or malformed proof leaves reuse unset: run all checks.
          lookup() {
            local tree runs source run_id attempt jobs
            tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq '.tree.sha')" || return 1
            [[ "$tree" =~ ^[0-9a-f]{40}$ ]] || return 1
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-gate.yml/runs?event=merge_group&head_sha=$GITHUB_SHA&status=success&per_page=100")" || return 1
            source="$(jq -ec --arg tree "$tree" --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" '
              first(.workflow_runs[]
              | select(.event == "merge_group" and .status == "completed" and .conclusion == "success")
              | select(.repository.full_name == $repo and .head_repository.full_name == $repo)
              | select(.head_branch | startswith("gh-readonly-queue/main/"))
              | select(.path == ".github/workflows/ci-gate.yml")
              | select(.head_sha == $sha and .head_commit.tree_id == $tree)
              | select((.id | type) == "number" and .id > 0)
              | select((.run_attempt | type) == "number" and .run_attempt > 0)
              | {run_id: .id, run_attempt: .run_attempt, commit: .head_sha, tree: .head_commit.tree_id})
              ' <<< "$runs")" || return 1
            run_id="$(jq -r .run_id <<< "$source")" || return 1
            attempt="$(jq -r .run_attempt <<< "$source")" || return 1
            jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100")" || return 1
            jq -e 'any(.jobs[]; .name == "CI Gate" and .status == "completed" and .conclusion == "success")' \
              <<< "$jobs" > /dev/null || return 1
            printf 'run_id=%s\ntree=%s\nsource=%s\n' "$run_id" "$tree" "$source" >> "$GITHUB_OUTPUT"
          }
          if ! lookup; then
            echo 'No matching successful merge-group CI Gate proof; running all checks.' >> "$GITHUB_STEP_SUMMARY"
          fi

      # These are the only main-scope outputs of the full check jobs. Queue-ref
      # caches cannot seed main, so retain just their existing verified saves.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.match.outputs.run_id != ''
        with:
          persist-credentials: false

      - name: Restore verified actionlint
        if: steps.match.outputs.run_id != ''
        uses: ./.github/actions/cached-release-tool # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        with:
          tool: actionlint
          version: ${{ env.ACTIONLINT_VERSION }}
          sha256: ${{ env.ACTIONLINT_LINUX_AMD64_SHA256 }}
          repository: rhysd/actionlint
          asset-id: ${{ env.ACTIONLINT_RELEASE_ASSET_ID }}
          token: ${{ github.token }}
          member: actionlint

      - name: Restore verified ShellCheck
        if: steps.match.outputs.run_id != ''
        uses: ./.github/actions/cached-release-tool # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        with:
          tool: shellcheck
          version: ${{ env.SHELLCHECK_VERSION }}
          sha256: ${{ env.SHELLCHECK_LINUX_X86_64_SHA256 }}
          repository: koalaman/shellcheck
          asset-id: ${{ env.SHELLCHECK_RELEASE_ASSET_ID }}
          token: ${{ github.token }}
          member: shellcheck-v${{ env.SHELLCHECK_VERSION }}/shellcheck
          strip-components: '1'

      - name: Restore verified TruffleHog
        if: steps.match.outputs.run_id != ''
        uses: ./.github/actions/cached-release-tool # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        with:
          tool: trufflehog
          version: ${{ env.TRUFFLEHOG_VERSION }}
          sha256: ${{ env.TRUFFLEHOG_LINUX_AMD64_SHA256 }}
          repository: trufflesecurity/trufflehog
          asset-id: ${{ env.TRUFFLEHOG_RELEASE_ASSET_ID }}
          token: ${{ github.token }}
          member: trufflehog

      - name: Restore verified zizmor
        if: steps.match.outputs.run_id != ''
        uses: ./.github/actions/cached-release-tool # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        with:
          tool: zizmor
          version: ${{ env.ZIZMOR_VERSION }}
          sha256: ${{ env.ZIZMOR_LINUX_X86_64_SHA256 }}
          repository: zizmorcore/zizmor
          asset-id: ${{ env.ZIZMOR_RELEASE_ASSET_ID }}
          token: ${{ github.token }}
          member: zizmor

      - name: Restore cached bubblewrap package
        id: cache-bubblewrap
        if: steps.match.outputs.run_id != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-cache/bubblewrap/${{ env.BUBBLEWRAP_DEB }}
          key: ci-tools-v1-${{ runner.os }}-${{ runner.arch }}-bubblewrap-${{ env.BUBBLEWRAP_DEB_SHA256 }}

      - name: Fetch and verify bubblewrap package on cache miss
        if: steps.match.outputs.run_id != '' && steps.cache-bubblewrap.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          snapshot="$(awk -F= '$1 == "CI_UBUNTU_SNAPSHOT" { count++; value = substr($0, index($0, "=") + 1) } END { if (count != 1) exit 1; print value }' .github/workflows/pins.txt)"
          if ! [[ "$snapshot" =~ ^[0-9]{8}T[0-9]{6}Z$ ]]; then
            echo "::error::Expected one CI_UBUNTU_SNAPSHOT in UTC (YYYYMMDDTHHMMSSZ) in .github/workflows/pins.txt" >&2
            exit 1
          fi
          dest="$RUNNER_TEMP/release-cache/bubblewrap/$BUBBLEWRAP_DEB"
          mkdir -p "$(dirname "$dest")"
          url="https://snapshot.ubuntu.com/ubuntu/${snapshot}/pool/main/b/bubblewrap/${BUBBLEWRAP_DEB}"
          if ! curl -q -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 30 \
            --connect-timeout 4 --max-time 15 \
            -o "$dest" "$url"; then
            rm -f -- "$dest"
            echo "::error::Could not fetch ${BUBBLEWRAP_DEB} from Ubuntu snapshot ${snapshot}" >&2
            exit 1
          fi
          if ! printf '%s  %s\n' "$BUBBLEWRAP_DEB_SHA256" "$dest" | sha256sum --check --strict -; then
            rm -f -- "$dest"
            exit 1
          fi

      - name: Save verified bubblewrap package
        if: steps.match.outputs.run_id != '' && steps.cache-bubblewrap.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-cache/bubblewrap/${{ env.BUBBLEWRAP_DEB }}
          key: ${{ steps.cache-bubblewrap.outputs.cache-primary-key }}

      - name: Record reused CI Gate proof
        id: proof
        if: steps.match.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.match.outputs.run_id }}
          TREE: ${{ steps.match.outputs.tree }}
          SOURCE: ${{ steps.match.outputs.source }}
        run: |
          set -euo pipefail
          printf 'Reused merge-group CI Gate run [%s](https://github.com/%s/actions/runs/%s), tree %s. Main-scope tool archives preserved; push history scans and trailers still required.\n' \
            "$RUN_ID" "$GITHUB_REPOSITORY" "$RUN_ID" "$TREE" >> "$GITHUB_STEP_SUMMARY"
          printf 'source=%s\nreuse=true\n' "$SOURCE" >> "$GITHUB_OUTPUT"

  ruff:
    needs: [main-proof]
    if: always() && !cancelled() && needs.main-proof.outputs.reuse != 'true'
    name: Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/uv-python # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        id: python
        with:
          uv-version: ${{ env.UV_VERSION }}
          uv-sha256: ${{ env.UV_LINUX_X86_64_SHA256 }}

      - name: Install Ruff (uv.lock lint group)
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/ruff-venv"
          rm -rf "$venv"
          UV_PROJECT_ENVIRONMENT="$venv" uv sync --locked --no-build --only-group lint
          reported="$("$venv/bin/ruff" --version)"
          if [ "$reported" != "ruff ${RUFF_VERSION}" ]; then
            echo "::error::Expected ruff ${RUFF_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: Ruff check lu_machinery/
        run: |
          set -euo pipefail
          ruff="$RUNNER_TEMP/ruff-venv/bin/ruff"
          if [ ! -d lu_machinery ]; then
            echo "::error::lu_machinery/ is missing; nothing would be checked"
            exit 1
          fi
          python_files="$(find lu_machinery -type f -name '*.py' | wc -l)"
          # The files Ruff itself selects, after the configured exclusions.
          inspected="$("$ruff" check --no-cache --config pyproject.toml --show-files lu_machinery | grep -c . || true)"
          echo "Ruff inspects ${inspected} file(s); lu_machinery/ holds ${python_files} Python file(s)."
          if [ "$python_files" -eq 0 ] || [ "$inspected" -eq 0 ]; then
            echo "::error::Ruff would inspect no Python files in lu_machinery/"
            exit 1
          fi
          "$ruff" check --no-cache --config pyproject.toml --output-format=github lu_machinery

      - name: Refuse unbounded JSON readers
        run: python -m lu_machinery.lint.json_readers

      - name: Refuse non-empty CHANGELOG.md Unreleased section
        run: python -m lu_machinery.release_cut check-changelog

  compileall:
    needs: [main-proof]
    if: always() && !cancelled() && needs.main-proof.outputs.reuse != 'true'
    name: Compile (${{ matrix.python }} Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: [pinned, floor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/uv-python # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        id: python
        with:
          python: ${{ matrix.python }}
          uv-version: ${{ env.UV_VERSION }}
          uv-sha256: ${{ env.UV_LINUX_X86_64_SHA256 }}

      - name: Compile lu_machinery
        env:
          # uv-python checked this against the pin or the floor.
          EXPECTED: ${{ steps.python.outputs.version }}
        run: |
          set -euo pipefail
          reported="$(python -I -c 'import platform; print(platform.python_version())')"
          if [ -z "$EXPECTED" ] || [ "$reported" != "$EXPECTED" ]; then
            echo "::error::Expected Python ${EXPECTED}, got: ${reported}"
            exit 1
          fi
          if [ ! -d lu_machinery ]; then
            echo "::error::lu_machinery/ is missing; nothing would be compiled"
            exit 1
          fi
          # compileall -q exits 0 on a missing or empty directory, so count first.
          python_files="$(find lu_machinery -type f -name '*.py' | wc -l)"
          if [ "$python_files" -eq 0 ]; then
            echo "::error::lu_machinery/ holds no Python files; nothing would be compiled"
            exit 1
          fi
          # Bytecode goes to the job temp directory, not the checkout, and its
          # count proves compileall reached every file. The prefix mirrors each
          # source's absolute directory and also receives the interpreter's own
          # stdlib bytecode, so only the mirror of lu_machinery/ is counted.
          prefix="$RUNNER_TEMP/pycache"
          rm -rf "$prefix"
          python -I -X pycache_prefix="$prefix" -m compileall -q lu_machinery
          mirror="${prefix}${PWD}/lu_machinery"
          if [ ! -d "$mirror" ]; then
            echo "::error::compileall wrote no bytecode for lu_machinery/"
            exit 1
          fi
          compiled="$(find "$mirror" -type f -name '*.pyc' | wc -l)"
          echo "Compiled ${compiled} of ${python_files} Python file(s) with Python ${reported}."
          if [ "$compiled" -ne "$python_files" ]; then
            echo "::error::compileall produced ${compiled} bytecode file(s) for ${python_files} source file(s)"
            exit 1
          fi

      - name: Remove bytecode
        if: always()
        run: rm -rf "$RUNNER_TEMP/pycache"

  mypy:
    needs: [main-proof]
    if: always() && !cancelled() && needs.main-proof.outputs.reuse != 'true'
    name: mypy ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The ratchet's shrink check reads the baseline at HEAD^ as well as
          # HEAD and origin/main, and silently skips a ref it cannot read.
          fetch-depth: 2

      - uses: ./.github/actions/uv-python # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        id: python
        with:
          uv-version: ${{ env.UV_VERSION }}
          uv-sha256: ${{ env.UV_LINUX_X86_64_SHA256 }}

      - name: Fetch origin/main for the shrink check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN is empty; refusing unauthenticated fetch"
            exit 1
          fi
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          if [ -z "$basic" ]; then
            echo "::error::Failed to encode GH_TOKEN for git fetch"
            exit 1
          fi
          # No --depth: on a push to main the checkout is the main tip, and a
          # depth-1 fetch of it would move the shallow boundary to HEAD and
          # drop HEAD^. Without it, Git fetches only commits it does not have.
          # Scope the token to this one fetch via GIT_CONFIG_* (never persisted
          # to disk or passed in argv).
          echo "Fetching origin/main authenticated via host-scoped http.extraheader."
          GIT_TERMINAL_PROMPT=0 \
          GIT_CONFIG_COUNT=2 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0='' \
          GIT_CONFIG_KEY_1=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_1="AUTHORIZATION: basic ${basic}" \
            git fetch --no-tags --no-recurse-submodules origin \
              +refs/heads/main:refs/remotes/origin/main
          unset basic GH_TOKEN
          # A ref the ratchet cannot read is skipped, not failed, so require all three.
          for ref in HEAD HEAD^ origin/main; do
            if ! git rev-parse --verify --quiet "${ref}^{commit}" > /dev/null; then
              echo "::error::${ref} is not available; the baseline shrink check would be skipped"
              exit 1
            fi
          done
          if ! git cat-file -e origin/main:lu_machinery/lint/mypy_baseline.json; then
            echo "::error::origin/main has no lu_machinery/lint/mypy_baseline.json; the shrink check would be skipped"
            exit 1
          fi

      - name: Install mypy and the lu_machinery import closure (uv.lock)
        env:
          EXPECTED: ${{ steps.python.outputs.version }}
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mypy-venv"
          rm -rf "$venv"
          # Preserve the runtime types used by the ratchet, which imports the checkout.
          UV_PROJECT_ENVIRONMENT="$venv" uv sync --locked --no-build --no-install-project \
            --all-extras --no-extra test --group typecheck
          reported="$("$venv/bin/python" -I -m mypy --version)"
          case "$reported" in
            "mypy ${MYPY_VERSION} "*) ;;
            *)
              echo "::error::Expected mypy ${MYPY_VERSION}, got: ${reported}"
              exit 1
              ;;
          esac
          version="$("$venv/bin/python" -I -c 'import platform; print(platform.python_version())')"
          if [ -z "$EXPECTED" ] || [ "$version" != "$EXPECTED" ]; then
            echo "::error::Expected Python ${EXPECTED}, got: ${version}"
            exit 1
          fi

      - name: Run the mypy ratchet over lu_machinery/
        env:
          LU_PRODUCT_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mypy-venv"
          if [ ! -f lu_machinery/lint/mypy_baseline.json ]; then
            echo "::error::lu_machinery/lint/mypy_baseline.json is missing; nothing would be compared"
            exit 1
          fi
          python_files="$(find lu_machinery -type f -name '*.py' | wc -l)"
          echo "The ratchet checks lu_machinery/, which holds ${python_files} Python file(s)."
          if [ "$python_files" -eq 0 ]; then
            echo "::error::lu_machinery/ holds no Python files; mypy would check nothing"
            exit 1
          fi
          # The same command the source repository's CI and pre-push hook run,
          # with this repository's package name. It imports the ratchet from
          # the checkout, so it does not run isolated (-I).
          LEARN_UKRAINIAN_PYTHON="$venv/bin/python" \
            env -u PYTHONPATH -u MYPYPATH "$venv/bin/python" -m lu_machinery.lint.mypy_ratchet

  test-waits:
    needs: [main-proof]
    if: always() && !cancelled() && needs.main-proof.outputs.reuse != 'true'
    name: Test wait lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The shrink check reads the baseline at HEAD^ as well as HEAD and
          # origin/main, and skips a ref it cannot read.
          fetch-depth: 2

      - uses: ./.github/actions/uv-python # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        with:
          uv-version: ${{ env.UV_VERSION }}
          uv-sha256: ${{ env.UV_LINUX_X86_64_SHA256 }}

      - name: Fetch origin/main for the shrink check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN is empty; refusing unauthenticated fetch"
            exit 1
          fi
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          if [ -z "$basic" ]; then
            echo "::error::Failed to encode GH_TOKEN for git fetch"
            exit 1
          fi
          # No --depth: on a push to main the checkout is the main tip, and a
          # depth-1 fetch of it would move the shallow boundary to HEAD and
          # drop HEAD^. The introducing PR has no baseline on origin/main yet;
          # the lint skips the shrink check until that blob exists.
          # Scope the token to this one fetch via GIT_CONFIG_* (never persisted
          # to disk or passed in argv).
          echo "Fetching origin/main authenticated via host-scoped http.extraheader."
          GIT_TERMINAL_PROMPT=0 \
          GIT_CONFIG_COUNT=2 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0='' \
          GIT_CONFIG_KEY_1=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_1="AUTHORIZATION: basic ${basic}" \
            git fetch --no-tags --no-recurse-submodules origin \
              +refs/heads/main:refs/remotes/origin/main
          unset basic GH_TOKEN
          for ref in HEAD HEAD^ origin/main; do
            if ! git rev-parse --verify --quiet "${ref}^{commit}" > /dev/null; then
              echo "::error::${ref} is not available; the baseline shrink check would be skipped"
              exit 1
            fi
          done
          if git cat-file -e "origin/main:lu_machinery/lint/test_waits_baseline.json"; then
            echo "origin/main has the test-wait baseline; growth against it fails."
          else
            echo "origin/main has no test-wait baseline yet; this landing freezes the census."
          fi

      - name: Run test-wait lint L4
        run: |
          set -euo pipefail
          if [ ! -f lu_machinery/lint/lint_test_waits.py ]; then
            echo "::error::lu_machinery/lint/lint_test_waits.py is missing; the lint would not run"
            exit 1
          fi
          if [ ! -f lu_machinery/lint/test_waits_baseline.json ]; then
            echo "::error::lu_machinery/lint/test_waits_baseline.json is missing; nothing would be compared"
            exit 1
          fi
          python_files="$(find tests -type f -name '*.py' | wc -l)"
          echo "The lint checks tests/, which holds ${python_files} Python file(s)."
          if [ "$python_files" -eq 0 ]; then
            echo "::error::tests/ holds no Python files; the lint would check nothing"
            exit 1
          fi
          python -m lu_machinery.lint.lint_test_waits

  fleet-security:
    name: Fleet security
    needs: [main-proof]
    if: always() && !cancelled() && needs.main-proof.outputs.reuse != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/fleet-security.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
    with:
      run-actionlint: true
      run-shellcheck: true
      shellcheck-paths: |
        .github
        .githooks|error
        lu_machinery|error
        packaging|error
        agents_extensions|error
      shellcheck-severity: style
      run-zizmor: true
      zizmor-paths: |
        .github/workflows
        .github/actions
      run-trivy-fs: true
      trivy-fs-targets: |
        package-lock.json
        uv.lock
      trivy-scanners: vuln,license
      trivy-severity: HIGH,CRITICAL
      trivy-include-dev-deps: true

  # Blocking secret scan with the pinned TruffleHog CLI via fleet-security.yml.
  # Runs on every event including matched main reuse pushes so commit history
  # scans are never skipped.
  secret-scan:
    name: Secret scan
    needs: [main-proof]
    if: always() && !cancelled()
    permissions:
      contents: read
    uses: ./.github/workflows/fleet-security.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
    with:
      run-secret-scan: true
      secret-scan-base: ${{ needs.main-proof.outputs.history-base }}
      secret-scan-require-base: ${{ github.event_name == 'push' }}
      require-trufflehog-ignore: true
      secret-scan-required-extensions: .py

  # Blocking SAST with the pinned Semgrep CE and the semgrep/semgrep-rules
  # checkout at the pinned commit (pins.txt).
  # - Rules come only from local directories of that checkout. No registry name
  #   (p/..., r/..., auto) is used, so nothing is fetched from semgrep.dev and
  #   metrics stay off. A missing checkout, a commit mismatch or a missing or
  #   empty rule directory fails the job.
  # - Diff-aware against .github/workflows/semgrep-baseline.json, the reviewed
  #   baseline of the first push (semgrep_baseline.py beside it): a finding not
  #   in the baseline fails the job, and so does a scan error without a path.
  #   A scan error in a file the change touches passes only when each of its
  #   spans lies on lines the PR diff leaves unchanged and the baseline records
  #   the same error (path, error type, span text hash), at most as many times
  #   as recorded; a timeout, an error without spans and any span on an added
  #   or modified line fail. A missing or mismatched baseline or rules
  #   checkout, unparsable output, any exit other than 0 or 1, and a scan that
  #   covered no Python file fail closed. Scan errors in untouched files are
  #   warnings. --timeout 30 and --jobs 2 are explicit; --strict is not used
  #   because the checker judges every error.
  # - Exclusions: Semgrep's built-in ignore list applies while the repository
  #   has no .semgrepignore (it skips test/, tests/, vendor/, build/, dist/ and
  #   similar), and files over 1 MB are skipped (Semgrep's default
  #   --max-target-bytes). prepublication-gate.sh allows exactly these two skip
  #   reasons and refuses a .semgrepignore anywhere in the history.
  # - The scanner runs with PYTHONSAFEPATH=1, so no Python module in the
  #   checkout is imported. Suppressions (.semgrepignore, nosemgrep comments)
  #   are repository content and are reviewed in the diff, like this workflow.
  sast:
    needs: [main-proof]
    if: always() && !cancelled() && needs.main-proof.outputs.reuse != 'true'
    name: SAST (Semgrep CE)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/uv-python # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        id: python
        with:
          uv-version: ${{ env.UV_VERSION }}
          uv-sha256: ${{ env.UV_LINUX_X86_64_SHA256 }}

      - name: Install Semgrep (uv.lock semgrep group)
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/semgrep-venv"
          rm -rf "$venv"
          UV_PROJECT_ENVIRONMENT="$venv" uv sync --locked --no-build --only-group semgrep
          mkdir -p "$venv/home"
          reported="$(env -i PATH="$venv/bin:/usr/bin:/bin" HOME="$venv/home" PYTHONSAFEPATH=1 \
            "$venv/bin/semgrep" --version)"
          if [ "$reported" != "$SEMGREP_VERSION" ]; then
            echo "::error::Expected semgrep ${SEMGREP_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: Fetch semgrep-rules at the pinned commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_TOKEN is empty; refusing unauthenticated fetch"
            exit 1
          fi
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          if [ -z "$basic" ]; then
            echo "::error::Failed to encode GH_TOKEN for git fetch"
            exit 1
          fi
          rules="$RUNNER_TEMP/semgrep-rules"
          rm -rf "$rules"
          git init --quiet "$rules"
          echo "Fetching semgrep-rules@${SEMGREP_RULES_COMMIT} authenticated via host-scoped http.extraheader."
          GIT_TERMINAL_PROMPT=0 \
          GIT_CONFIG_COUNT=2 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0='' \
          GIT_CONFIG_KEY_1=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_1="AUTHORIZATION: basic ${basic}" \
            git -C "$rules" fetch --quiet --depth 1 --no-tags \
              https://github.com/semgrep/semgrep-rules.git "$SEMGREP_RULES_COMMIT"
          unset basic GH_TOKEN
          git -C "$rules" -c advice.detachedHead=false checkout --quiet FETCH_HEAD
          checked_out="$(git -C "$rules" rev-parse HEAD)"
          if [ "$checked_out" != "$SEMGREP_RULES_COMMIT" ]; then
            echo "::error::semgrep-rules is at ${checked_out}, expected ${SEMGREP_RULES_COMMIT}"
            exit 1
          fi

      - name: Scan with Semgrep
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          rules="$RUNNER_TEMP/semgrep-rules"
          venv="$RUNNER_TEMP/semgrep-venv"
          configs=(
            python/lang
            python/correctness
            python/jinja2
            python/jwt
            python/requests
            python/sh
            generic/secrets
            bash/lang
            yaml/github-actions
            yaml/kubernetes
          )
          args=()
          for config in "${configs[@]}"; do
            dir="$rules/$config"
            if [ ! -d "$dir" ] || [ -z "$(find "$dir" -name '*.yaml' -print -quit)" ]; then
              echo "::error::Rule config ${config} is missing from the semgrep-rules checkout"
              exit 1
            fi
            args+=(--config "$dir")
          done

          work="$RUNNER_TEMP/sast"
          rm -rf "$work"
          mkdir -p "$work/home" "$work/tmp"
          results="$work/results.json"
          diagnostics="$work/stderr.log"
          # Scanner stderr can quote repository content, so it goes to a file
          # that is never printed; only its line count reaches the log.
          set +e
          env -i PATH="$venv/bin:/usr/bin:/bin" HOME="$work/home" TMPDIR="$work/tmp" \
            PYTHONSAFEPATH=1 SEMGREP_SEND_METRICS=off SEMGREP_ENABLE_VERSION_CHECK=0 \
            "$venv/bin/semgrep" scan "${args[@]}" \
            --metrics=off --disable-version-check --error --timeout 30 --jobs 2 \
            --json --output "$results" --quiet . 2> "$diagnostics"
          rc=$?
          set -e
          echo "Semgrep exited ${rc}; $(wc -l < "$diagnostics") stderr line(s) withheld from this log."

          # Exactly one JSON object with results and errors arrays and a list of
          # scanned paths; anything else (missing file, other JSON, several
          # values) fails. jq's own error text can quote the input, so it is
          # discarded.
          if ! jq -s -e 'length == 1 and (.[0] | type == "object"
                and (.results | type) == "array" and (.errors | type) == "array"
                and (.paths.scanned | type) == "array")' \
                "$results" > /dev/null 2>&1; then
            echo "::error::Semgrep output is missing or malformed (exit ${rc}); failing closed"
            exit 1
          fi
          scanned="$(jq '.paths.scanned | length' "$results")"
          scanned_python="$(jq '[.paths.scanned[] | select(type == "string" and endswith(".py"))] | length' "$results")"
          echo "Semgrep scanned ${scanned} file(s), ${scanned_python} of them Python."
          if [ "$scanned" -eq 0 ] || [ "$scanned_python" -eq 0 ]; then
            echo "::error::Semgrep scanned no Python files; failing closed"
            exit 1
          fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::Semgrep exited ${rc} (scan error); failing closed"
            exit 1
          fi
          baseline=.github/workflows/semgrep-baseline.json
          checker=.github/workflows/semgrep_baseline.py
          if [ ! -f "$baseline" ] || [ ! -f "$checker" ]; then
            echo "::error::The Semgrep baseline or its checker is missing; failing closed"
            exit 1
          fi
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$MQ_BASE" ;;
            push) base="$PUSH_BASE" ;;
            workflow_dispatch) base="" ;;
            *) echo "::error::Unsupported event ${EVENT_NAME}"; exit 1 ;;
          esac
          : > "$work/changed"
          if [ -n "$base" ]; then
            if ! git cat-file -e "${base}^{commit}"; then
              echo "::error::Base commit ${base} is not in the checkout; failing closed"
              exit 1
            fi
            git diff -z --no-renames --name-only "$base" HEAD > "$work/changed"
          fi
          python -I -B "$checker" check --results "$results" --root . --rules-dir "$rules" \
            --baseline "$baseline" --changed "$work/changed" --base "$base" \
            --semgrep-version "$SEMGREP_VERSION" --rules-commit "$SEMGREP_RULES_COMMIT" \
            --configs "${configs[*]}"

      - name: Remove scan results
        if: always()
        run: >-
          rm -rf "$RUNNER_TEMP/sast" "$RUNNER_TEMP/semgrep-rules"
          "$RUNNER_TEMP/semgrep-venv"

  # Blocking vulnerability audit of the release inputs, as the source
  # repository's dependency-audit job does it (pip-audit, then npm audit at
  # high and above), on every event.
  # - Python: pip-audit reads the runtime closure of uv.lock (`uv export
  #   --locked`, the input of the release wheelhouse) with its markers removed
  #   (--disable-pip --require-hashes: no resolver, no install) and fails on any
  #   known vulnerability; --strict also fails a pin it cannot look up. pip-audit
  #   silently drops a requirement whose environment marker is false on this
  #   runner, so markers are removed and its report must list exactly as many
  #   audited packages as the requirements parser it uses
  #   (pip-requirements-parser) finds in the export; an invalid line, an option
  #   line (-r, -c, an index) or a requirement that is not one hashed == pin
  #   fails the job.
  # - Node: npm audit reads package-lock.json only (--package-lock-only), every
  #   locked package with no --omit (a lock's dev flag cannot hide one), and
  #   fails on a high or critical advisory, or on any audit error.
  # - pip-audit and its dependency closure come from uv.lock (audit group);
  #   npm comes from the pinned Node release installed via actions/setup-node
  #   and version-checked before auditing. Both run under `env -i`.
  # - A suppression is an `--ignore-vuln ID` argument below with its reason,
  #   reviewed in the diff like every other suppression.
  dependency-audit:
    needs: [main-proof]
    if: always() && !cancelled() && needs.main-proof.outputs.reuse != 'true'
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/uv-python # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        id: python
        with:
          uv-version: ${{ env.UV_VERSION }}
          uv-sha256: ${{ env.UV_LINUX_X86_64_SHA256 }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          package-manager-cache: false

      - name: Install pip-audit (uv.lock audit group)
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/pip-audit-venv"
          rm -rf "$venv"
          UV_PROJECT_ENVIRONMENT="$venv" uv sync --locked --no-build --only-group audit
          reported="$("$venv/bin/pip-audit" --version)"
          if [ "$reported" != "pip-audit ${PIP_AUDIT_VERSION}" ]; then
            echo "::error::Expected pip-audit ${PIP_AUDIT_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: Audit the runtime closure of uv.lock (pip-audit)
        run: |
          set -euo pipefail
          if [ ! -f uv.lock ]; then
            echo "::error::uv.lock is missing; nothing would be audited"
            exit 1
          fi
          work="$RUNNER_TEMP/pip-audit"
          rm -rf "$work"
          mkdir -p "$work/home"
          # Audit core and every runtime extra with the same hash-locked
          # export that release_cut uses. Exclude test tooling.
          uv export --locked --quiet --format requirements.txt --no-emit-project --no-default-groups \
            --all-extras --no-extra test > "$work/runtime.txt"
          lock="$work/audit.txt"
          # The export keeps environment markers, and pip-audit drops a marker
          # that is false on this runner (the Windows-only packages, for
          # example). Every exported pin is audited instead: the audit input is
          # the export without markers, one hashed == pin per line, written by
          # pip-audit's own requirements parser, and the denominator is its count.
          pins="$(env -i PATH=/usr/bin:/bin "$RUNNER_TEMP/pip-audit-venv/bin/python" -I - "$work/runtime.txt" "$lock" <<'PY'
          import sys

          from pip_requirements_parser import RequirementsFile

          source, target = sys.argv[1:]
          parsed = RequirementsFile.from_file(source)
          problems = [f"invalid line {line.line_number}: {line.error_message}" for line in parsed.invalid_lines]
          problems += [f"option line {option.line_number} is not allowed: {option.dumps()}" for option in parsed.options]
          lines = []
          for req in parsed.requirements:
              specs = list(req.specifier) if req.specifier else []
              if req.link or len(specs) != 1 or specs[0].operator != "==" or not req.hash_options:
                  problems.append(f"line {req.line_number}: {req.dumps()!r} is not one hashed == pin")
                  continue
              hashes = " ".join(f"--hash={value}" for value in req.hash_options)
              lines.append(f"{req.name}=={specs[0].version} {hashes}\n")
          for problem in problems:
              print(f"::error::uv export {problem}", file=sys.stderr)
          if problems:
              sys.exit(1)
          with open(target, "w", encoding="utf-8") as handle:
              handle.writelines(lines)
          print(len(lines))
          PY
          )"
          echo "pip-audit checks ${pins} pinned package(s) of the uv.lock runtime closure."
          if [ "$pins" -eq 0 ]; then
            echo "::error::the uv.lock runtime export pins no package"
            exit 1
          fi
          report="$work/report.json"
          # Any known vulnerability, unknown package or tool error fails the job.
          status=0
          env -i PATH=/usr/bin:/bin HOME="$work/home" \
            "$RUNNER_TEMP/pip-audit-venv/bin/pip-audit" --strict --disable-pip --require-hashes \
            --progress-spinner=off --format json --output "$report" --requirement "$lock" || status=$?
          if [ ! -s "$report" ]; then
            echo "::error::pip-audit exited ${status} without a report"
            exit 1
          fi
          jq -r '.dependencies[] | .name as $name | .version as $version | (.vulns // [])[]
            | "::error::\($name) \($version): \(.id) (fixed in: \(.fix_versions | join(", ")))"' "$report"
          audited="$(jq '[.dependencies[] | select(has("skip_reason") | not)] | length' "$report")"
          vulns="$(jq '[.dependencies[] | (.vulns // [])[]] | length' "$report")"
          echo "pip-audit audited ${audited} of ${pins} pinned package(s); ${vulns} known vulnerabilities."
          if [ "$audited" -ne "$pins" ]; then
            echo "::error::pip-audit audited ${audited} package(s) but the lock pins ${pins}; a skipped or marker-excluded pin is not audited"
            exit 1
          fi
          if [ "$status" -ne 0 ] || [ "$vulns" -ne 0 ]; then
            echo "::error::pip-audit failed (exit ${status}, ${vulns} known vulnerabilities)"
            exit 1
          fi

      - name: Audit package-lock.json (npm audit)
        run: |
          set -euo pipefail
          for file in package.json package-lock.json; do
            if [ ! -f "$file" ]; then
              echo "::error::${file} is missing; nothing would be audited"
              exit 1
            fi
          done
          packages="$(jq '[.packages // {} | to_entries[] | select(.key != "")] | length' package-lock.json)"
          echo "npm audit checks ${packages} locked package(s) in package-lock.json."
          if [ "$packages" -eq 0 ]; then
            echo "::error::package-lock.json locks no package"
            exit 1
          fi
          npm_bin="$(command -v npm)"
          node_dir="$(dirname "$(command -v node)")"
          reported_node="$(node --version)"
          reported_npm="$("$npm_bin" --version)"
          echo "${reported_npm} (npm), ${reported_node} (node)"
          if [ "$reported_node" != "v${NODE_VERSION}" ]; then
            echo "::error::Expected node v${NODE_VERSION}, got: ${reported_node}"
            exit 1
          fi
          if [ "$reported_npm" != "${NPM_VERSION}" ]; then
            echo "::error::Expected npm ${NPM_VERSION}, got: ${reported_npm}"
            exit 1
          fi
          work="$RUNNER_TEMP/npm-audit"
          rm -rf "$work"
          mkdir -p "$work/home"
          # A high or critical advisory, or any audit error, fails the job.
          env -i PATH="$node_dir:/usr/bin:/bin" HOME="$work/home" \
            "$npm_bin" audit --package-lock-only --audit-level=high

      - name: Remove tools
        if: always()
        run: >-
          rm -rf "$RUNNER_TEMP/pip-audit" "$RUNNER_TEMP/npm-audit"
          "$RUNNER_TEMP/pip-audit-venv"

  # The release path of docs/release.md on a hosted runner: build sdist and
  # wheel from the tracked tree with pinned tools, fill a temporary wheelhouse
  # with the wheel and the runtime closure exported from uv.lock, install
  # offline with hashes required, then import every module from the installed
  # wheel only. The product consumer check uses the pinned product revision's
  # interpreter and lock alongside those machinery checks.
  installed-wheel:
    needs: [main-proof]
    if: always() && !cancelled() && needs.main-proof.outputs.reuse != 'true'
    name: Installed wheel (pinned Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/uv-python # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        with:
          uv-version: ${{ env.UV_VERSION }}
          uv-sha256: ${{ env.UV_LINUX_X86_64_SHA256 }}

      - name: Build sdist and wheel with pinned tools
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/installed-wheel"
          rm -rf "$work"
          mkdir -p "$work/src" "$work/dist"
          # Only tracked files, as in a release build.
          git archive --format=tar HEAD | tar -x -C "$work/src"
          cd "$work"
          python -I -m venv build-venv
          cat > build-requirements.txt <<'REQUIREMENTS'
          build==1.6.1 \
              --hash=sha256:ecd351a4be9d35a9eaaba244a7687143c9c7d4aea6ac964e7e7ddab20cbcf4e7
          packaging==26.3 \
              --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          pyproject-hooks==1.2.0 \
              --hash=sha256:9e5c6bfa8dcc30091c74b0cf803c81fdd29d94f01992a7707bc97babb1141913
          setuptools==84.1.0 \
              --hash=sha256:5231689c6ac8156cd155cfb98c3fd6fb252c3e7e9bd3d78b64d3c55f132624c9
          REQUIREMENTS
          build-venv/bin/python -I -m pip install --no-cache-dir --disable-pip-version-check \
            --no-input --require-hashes --only-binary=:all: --requirement build-requirements.txt
          build-venv/bin/python -I -m build --sdist --wheel --no-isolation --outdir dist src
          ls -l dist
          wheels="$(find dist -maxdepth 1 -name 'lu_machinery-*-py3-none-any.whl' | wc -l)"
          sdists="$(find dist -maxdepth 1 -name 'lu_machinery-*.tar.gz' | wc -l)"
          if [ "$wheels" -ne 1 ] || [ "$sdists" -ne 1 ]; then
            echo "::error::Expected one wheel and one sdist, got ${wheels} and ${sdists}"
            exit 1
          fi

      - name: Install offline from a hash-locked wheelhouse
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/installed-wheel"
          project="$work/src/pyproject.toml"
          python -I - "$project" > "$work/project.txt" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["project"]
          print(project["version"], *sorted(project["optional-dependencies"]), sep="\n")
          PY
          mapfile -t project_data < "$work/project.txt"
          version="${project_data[0]}"
          extras=("${project_data[@]:1}")
          export_args=(--locked --quiet --format requirements.txt --no-emit-project --no-default-groups)
          uv export "${export_args[@]}" --all-extras > "$work/wheelhouse.txt"
          # Export each selection separately so unrelated wheels never enter its venv.
          uv export "${export_args[@]}" > "$work/core.lock"
          uv export "${export_args[@]}" --all-extras --no-extra test > "$work/consumer.lock"
          for extra in "${extras[@]}"; do
            uv export "${export_args[@]}" --extra "$extra" > "$work/$extra.lock"
          done
          cd "$work"
          wheel="$(find dist -maxdepth 1 -name 'lu_machinery-*-py3-none-any.whl')"
          mkdir wheelhouse
          # The build venv has pip. The activated uv venv has no pip.
          build-venv/bin/python -I -m pip download --no-cache-dir --disable-pip-version-check --no-input \
            --require-hashes --only-binary=:all: --no-deps --dest wheelhouse --requirement wheelhouse.txt
          cp "$wheel" wheelhouse/
          digest="$(sha256sum "$wheel" | cut -d' ' -f1)"
          echo "lu-machinery ${version} sha256:${digest}; wheelhouse holds $(find wheelhouse -name '*.whl' | wc -l) wheel(s)"
          for profile in core "${extras[@]}" consumer; do
            selection="lu-machinery[$profile]"
            if [[ "$profile" == core || "$profile" == consumer ]]; then
              selection=lu-machinery
            fi
            printf '%s==%s --hash=sha256:%s\n' "$selection" "$version" "$digest" >> "$profile.lock"
            python -I -m venv "$profile"
            "$profile/bin/python" -I -m pip install --no-cache-dir --disable-pip-version-check --no-input \
              --no-index --find-links wheelhouse --require-hashes --requirement "$profile.lock"
            "$profile/bin/python" -I -m pip check --disable-pip-version-check
          done

      - name: Import every module from the installed wheel
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/installed-wheel"
          mkdir -p "$work/scratch/home"
          cat > "$work/import_all.py" <<'PY'
          import importlib
          import importlib.metadata
          import sys
          from pathlib import Path

          import lu_machinery

          # Prefixes of modules that belong to a feature. Probe lazy external
          # imports in the same venv. Postgres adapters also import in core
          # because the SQLite path can use them without a Postgres driver.
          extra_modules = {
              "api": ("lu_machinery.api",),
              "postgres": (),
              "pytest": (
                  "lu_machinery.ci.coverage_diff",
                  "lu_machinery.ci.coverage_ref",
                  "lu_machinery.ci.coverage_ref_environment",
                  "lu_machinery.ci.data_tier",
                  "lu_machinery.ci.pytest_dispatch_cap",
                  "lu_machinery.ci.pytest_shards",
                  "lu_machinery.common.pytest_scratch",
              ),
              "test": (),
          }
          extra_probes = {
              "api": ("uvicorn",),
              "postgres": (
                  "psycopg.pq",
                  "lu_machinery.control_plane.storage",
                  "lu_machinery.fleet_comms.artifacts",
                  "lu_machinery.fleet_comms.efficiency_metrics",
                  "lu_machinery.fleet_comms.message_plane",
              ),
              "pytest": ("coverage", "xdist"),
              "test": ("hypothesis",),
          }

          site = Path(sys.argv[1]).resolve()
          profile = sys.argv[2] if len(sys.argv) > 2 else "consumer"
          distribution = importlib.metadata.distribution("lu-machinery")
          provided = set(distribution.metadata.get_all("Provides-Extra", ()))
          if provided != extra_modules.keys() or provided != extra_probes.keys():
              sys.exit(f"::error::Wheel extras {sorted(provided)} differ from the import check")
          origin = Path(lu_machinery.__file__).resolve()
          print(f"lu-machinery {distribution.version} from {origin}")
          if site not in origin.parents:
              sys.exit(f"::error::lu_machinery was imported from {origin}, not the consumer venv")
          # The distribution's file manifest (RECORD) lists every shipped
          # module, including namespace subtrees that pkgutil discovery skips.
          names = set()
          for file in distribution.files or []:
              parts = file.parts
              if parts[0] != "lu_machinery" or file.suffix != ".py":
                  continue
              parts = parts[:-1] if parts[-1] == "__init__.py" else (*parts[:-1], file.stem)
              if not all(part.isidentifier() for part in parts):
                  sys.exit(f"::error::{file} is shipped but cannot be imported by name")
              names.add(".".join(parts))
          if not names:
              sys.exit("::error::Wheel RECORD lists no lu_machinery modules")
          by_extra = {}
          for extra, prefixes in extra_modules.items():
              for prefix in prefixes:
                  if prefix not in names:
                      sys.exit(f"::error::{extra} names a module absent from the wheel: {prefix}")
              by_extra[extra] = {
                  name for name in names
                  if any(name == prefix or name.startswith(f"{prefix}.") for prefix in prefixes)
              }
          if profile == "core":
              imports = names.difference(*by_extra.values())
          elif profile == "consumer":
              imports = names
          else:
              imports = by_extra[profile].union(extra_probes[profile])
          if not imports:
              sys.exit(f"::error::{profile} selected no imports")

          failed = {}
          for name in sorted(imports):
              try:
                  module = importlib.import_module(name)
              except BaseException as exc:  # a module that exits on import fails too
                  failed[name] = f"{type(exc).__name__}: {exc}"
                  continue
              if name == "psycopg.pq" and module.__impl__ != "binary":
                  failed[name] = f"expected binary libpq, got {module.__impl__}"
              # Namespace packages have no __file__, only __path__ entries.
              origins = [module.__file__] if module.__file__ else list(module.__path__)
              stray = [path for path in origins if site not in Path(path).resolve().parents]
              if not origins or stray:
                  failed[name] = f"imported from {origins}"
          for name, reason in sorted(failed.items()):
              print(f"::error::{name}: {reason}")
          print(f"{profile}: imported {len(imports) - len(failed)} of {len(imports)} targets ({len(names)} shipped modules).")
          if failed:
              sys.exit(1)

          if profile == "core":
              import sqlite3
              from contextlib import closing
              from importlib.util import find_spec
              from unittest.mock import patch

              from lu_machinery.agent_runtime.attempt_boundary import DEFAULT_CLAUDE_ACCOUNT
              from lu_machinery.ci.data_tier import prune_stale_worktrees
              from lu_machinery.control_plane.storage import Authority
              from lu_machinery.fleet.claude_account_lane import ClaudeAccount, lane_view
              from lu_machinery.fleet.usage import read_budget
              from lu_machinery.hygiene.pytest_retention import sweep_pytest_runs
              from lu_machinery.ops.verify_run import joined_contracts
              from lu_machinery.orchestration.curriculum_coordinator import default_health_probe
              from lu_machinery.work.sources_public import fetch_fleet_reviews, public_repository_id

              # Use a fixed budget and no provider refresh in an isolated wheel install.
              budget = {"agents": {"codex": {"status": "cool"}}, "api_accounts": {}}
              with (
                  patch("lu_machinery.api.state_router.compute_routing_budget", return_value=budget) as compute,
                  patch("lu_machinery.api.subscription_usage.refresh_provider_usage_data"),
                  patch("lu_machinery.api.subscription_usage.refresh_api_account_data"),
              ):
                  assert read_budget(fresh=True) == {**budget, "source": "in-process-fresh"}
                  compute.assert_called_once_with(transport="dispatch")

              row = {"status": "ok", "session5h": {"left_pct": 80}, "weekly": {"left_pct": 95}}
              lane, reason = lane_view(row, {})
              assert reason is None and lane["status"] == "cool" and lane["remaining_pct"] == 95

              _, routes, _ = joined_contracts()
              assert any(route.matches("/api/state/routing-budget", "http") for route in routes)

              account = ClaudeAccount(DEFAULT_CLAUDE_ACCOUNT, "builtin")
              with (
                  patch("lu_machinery.api.state_router.compute_routing_budget", return_value=budget) as compute,
                  patch("lu_machinery.fleet.claude_account_lane.resolve_route_account", return_value=account),
              ):
                  assert default_health_probe()["agents"]["codex"]["status"] == "cool"
                  compute.assert_called_once_with(fresh_codexbar=True)
              print("core: exercised 4 of 4 runtime entry points")

              assert find_spec("pytest") is None and find_spec("psycopg") is None
              assert callable(sweep_pytest_runs)
              prune_stale_worktrees(Path.cwd())  # The isolated workspace has no nightly worktrees.

              database = Path.cwd() / "core-fleet.sqlite3"
              repository = public_repository_id()
              with closing(sqlite3.connect(database)) as connection, connection:
                  connection.execute(
                      "CREATE TABLE formal_review_jobs (review_id TEXT, repository TEXT, pr_number INTEGER, "
                      "head_sha TEXT, gate_kind TEXT, state TEXT, sealed_verdict_artifact_id TEXT, created_at TEXT)"
                  )
                  connection.execute(
                      "INSERT INTO formal_review_jobs VALUES (?, ?, ?, ?, ?, ?, ?, ?)",
                      ("core-review", repository, 1, "0" * 40, "code", "completed", None, "2026-01-01T00:00:00Z"),
                  )
              with (
                  patch("lu_machinery.api.fleet_router.resolve_context", return_value=object()),
                  patch("lu_machinery.api.fleet_router._plane_db_path", return_value=database),
                  patch("lu_machinery.api.fleet_router.storage.resolve_authority", return_value=Authority.SQLITE),
              ):
                  section = fetch_fleet_reviews(repository_id=repository)
              assert section.status == "ok" and section.count == 1
              assert section.payload["reviews"][0]["review_id"] == "core-review"
              print("core: loaded both cleanup paths and read one public fleet review from SQLite")
          PY
          mapfile -t project_data < "$work/project.txt"
          cd "$work/scratch"
          for profile in core "${project_data[@]:1}" consumer; do
            candidate="$work/$profile/bin/python"
            # Isolate imports from the checkout, PYTHONPATH and runner variables.
            env -i PATH=/usr/bin:/bin HOME="$work/scratch/home" TMPDIR="$work/scratch" \
              LEARN_UKRAINIAN_PYTHON="$candidate" \
              "$candidate" -I -B "$work/import_all.py" "$work/$profile" "$profile" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # Product consumer check: the release cut's consumer test collection, then
      # the pinned key tests, at the product commit in product-consumer.pin,
      # with this wheel first. Build both environments with the product pin's
      # exact Python so the overlay matches the release cut's ABI and runtime.
      - name: Read the product consumer pin
        id: pin
        run: |
          set -euo pipefail
          pin=.github/workflows/product-consumer.pin
          commits="$(grep -c '^commit ' "$pin" || true)"
          commit="$(sed -nE 's/^commit ([0-9a-f]{40})$/\1/p' "$pin")"
          if [ "$commits" -ne 1 ] || [ -z "$commit" ]; then
            echo "::error::${pin} must hold exactly one 'commit <full SHA>' line"
            exit 1
          fi
          tests=()
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              '' | '#'* | 'commit '*) ;;
              'test '*)
                path="${line#test }"
                if ! [[ "$path" =~ ^tests/[A-Za-z0-9_/-]+\.py$ ]]; then
                  echo "::error::${pin}: not a product test file path: ${path}"
                  exit 1
                fi
                tests+=("$path")
                ;;
              *)
                echo "::error::${pin}: unknown line: ${line}"
                exit 1
                ;;
            esac
          done < "$pin"
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::${pin} names no key test"
            exit 1
          fi
          printf '%s\n' "${tests[@]}" > "$RUNNER_TEMP/installed-wheel/key-tests.txt"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "Product pin learn-ukrainian/learn-ukrainian.github.io@${commit}; ${#tests[@]} key test file(s)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: learn-ukrainian/learn-ukrainian.github.io
          ref: ${{ steps.pin.outputs.commit }}
          path: product
          persist-credentials: false

      - name: Build the product environment at the pin
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/installed-wheel/product-venv
        working-directory: product
        run: |
          set -euo pipefail
          product_python="$(cat .python-version)"
          if ! [[ "$product_python" =~ ^3\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The product pin needs an exact CPython patch version"
            exit 1
          fi
          uv python install --no-bin "$product_python"
          # Keep the pinned product's dependency selection and install its locked
          # setuptools and wheel before building the two source packages.
          echo "uv sync --locked from product@$(git rev-parse HEAD)"
          sync=(uv sync --locked --no-python-downloads --python "$product_python"
            --no-install-package torch --no-install-package torchvision
            --no-install-package open-clip-torch --no-install-package stanza
            --no-install-package lu-machinery)
          "${sync[@]}" --no-build \
            --no-install-package ipa-uk --no-install-package learn-ukrainian-v4-runtime
          "${sync[@]}" --no-build-isolation
          reported="$("$UV_PROJECT_ENVIRONMENT/bin/python" -I -c 'import platform; print(platform.python_version())')"
          if [ "$reported" != "$product_python" ]; then
            echo "::error::The product pin requires Python ${product_python}; environment uses ${reported}"
            exit 1
          fi
          echo "$(uv --version); Python ${reported} (product pin)"
          "$UV_PROJECT_ENVIRONMENT/bin/python" packages/v4-runtime/build_assets.py

      - name: Install the candidate wheel on the product's Python
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/installed-wheel"
          product-venv/bin/python -I -m venv product-consumer
          product-consumer/bin/python -I -m pip install --disable-pip-version-check --no-input \
            --no-index --find-links wheelhouse --require-hashes --requirement consumer.lock
          product-consumer/bin/python -I -m pip check --disable-pip-version-check

      - name: Collect the product's tests with the candidate first
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/installed-wheel"
          product="$GITHUB_WORKSPACE/product"
          candidate="$work/product-consumer/bin/python"
          wheel="$(find "$work/dist" -maxdepth 1 -name 'lu_machinery-*-py3-none-any.whl')"
          version="$(python -I -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "$work/src/pyproject.toml")"
          commit="$(git -C "$product" rev-parse HEAD)"
          echo "Testing lu-machinery ${version} sha256:$(sha256sum "$wheel" | cut -d' ' -f1) against learn-ukrainian/learn-ukrainian.github.io@${commit}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Product modules resolve the project interpreter at import; the
          # 0.1.23 cut failed its collection with this unset.
          export LEARN_UKRAINIAN_PYTHON="$candidate"
          # The cut's own step, from the installed candidate (release_cut consumer-collection).
          if ! "$candidate" -I -m lu_machinery.release_cut consumer-collection --python "$candidate" \
              --product "$product" --product-python "$work/product-venv/bin/python" --version "$version" \
              --work "$work/collection" | tee -a "$GITHUB_STEP_SUMMARY"; then
            sed -n '/= ERRORS =/,$p' "$work/collection/cut.log" | tail -n 200
            exit 1
          fi

      - name: Run the key consumer tests with the candidate first
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/installed-wheel"
          product="$GITHUB_WORKSPACE/product"
          candidate="$work/product-consumer/bin/python"
          mapfile -t tests < "$work/key-tests.txt"
          cd "$product"
          # The collection environment: the candidate's venv now ends with the
          # product environment's site-packages.
          env -u PYTHONPATH LEARN_UKRAINIAN_PYTHON="$candidate" LU_PRODUCT_ROOT="$product" \
            LEARN_UKRAINIAN_PRIMARY_REPO_ROOT="$product" "$candidate" -m pytest "${tests[@]}"
          echo "Key consumer tests passed: ${tests[*]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove build files
        if: always()
        run: rm -rf "$RUNNER_TEMP/installed-wheel"

  # X-Verified in observe mode. The CI Gate job has no checkout, so this check
  # is its own required job. Observe logs a missing line and does not fail.
  verified-trailer:
    needs: [main-proof]
    if: always() && !cancelled()
    name: Verified trailer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/uv-python # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        with:
          uv-version: ${{ env.UV_VERSION }}
          uv-sha256: ${{ env.UV_LINUX_X86_64_SHA256 }}

      - name: Install the declaration parser (uv.lock)
        run: |
          set -euo pipefail
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/python" uv sync --locked --no-build --only-group attribution

      - name: Check the verification line
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && needs.main-proof.outputs.history-base || '' }}
          HEAD_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ZERO_SHA: "0000000000000000000000000000000000000000"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/python/bin/python"
          "$py" -c 'import lu_machinery.ci.check_agent_attribution as checker; raise SystemExit(0 if checker.DEFAULT_VERIFIED_MODE == "observe" else 1)'
          case "$EVENT_NAME" in
            pull_request)
              mode=(--pr)
              ;;
            merge_group)
              mode=(--merge-group)
              ;;
            push)
              [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [ "$BASE_SHA" != "$ZERO_SHA" ] || {
                echo '::error::Missing successful main history checkpoint'; exit 1;
              }
              mode=(--pr)
              ;;
            workflow_dispatch)
              "$py" -m lu_machinery.ci.check_agent_attribution --verified-mode observe --verified-report HEAD~20..HEAD
              exit 0
              ;;
            *)
              echo "::error::Unsupported event ${EVENT_NAME}"
              exit 1
              ;;
          esac
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "::error::Missing base or head SHA for the verification line in ${EVENT_NAME}"
            exit 1
          fi
          "$py" -m lu_machinery.ci.check_agent_attribution --verified-mode observe "${mode[@]}" "$BASE_SHA" "$HEAD_SHA"

  # Full six-shard suite. Skipped on pull_request; CI Gate then requires that
  # skip, and requires pr-affected instead. A skip on merge_group fails the gate.
  pytest:
    name: pytest
    needs: [main-proof]
    if: always() && !cancelled() && github.event_name != 'pull_request' && needs.main-proof.outputs.reuse != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.

  # Changed tests, importers, text readers, guards and repo_wide invariants.
  # The workflow run shows this job's time. merge_group does not run it.
  pr-affected:
    name: PR changed tests and guards
    needs: [main-proof]
    if: always() && !cancelled() && github.event_name == 'pull_request' && needs.main-proof.outputs.reuse != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.

  ci-gate:
    name: CI Gate
    # always(): a job skipped because a dependency failed would otherwise count
    # as a passing required check.
    if: always()
    needs: [main-proof, ruff, compileall, mypy, test-waits, fleet-security, secret-scan, sast, dependency-audit, installed-wheel, verified-trailer, pytest, pr-affected]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Publish the original candidate before a failed dependency fails the gate.
      - name: Record original queue candidate
        if: github.event_name == 'merge_group'
        run: |
          set -euo pipefail
          jq -ces --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
            --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" '
            select(length == 1) | .[0]
            | select(.action == "checks_requested") | .merge_group
            | select(.base_ref == "refs/heads/main" and .head_ref == $ref and .head_sha == $sha)
            | select(.head_ref | test("\\Arefs/heads/gh-readonly-queue/main/pr-[1-9][0-9]*-[0-9a-f]{40}\\z"))
            | select(.base_sha != .head_sha and
                ([.base_sha, .head_sha] | all(type == "string" and test("\\A[0-9a-f]{40}\\z"))))
            | select([$run_id, $run_attempt] | all(type == "number" and . > 0 and . == floor))
            | {base_sha, head_sha, head_ref, run_id: $run_id, run_attempt: $run_attempt}
            ' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/queue-candidate.json"

      - name: Preserve original queue candidate for recovery
        if: github.event_name == 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-queue-candidate
          path: ${{ runner.temp }}/queue-candidate.json
          if-no-files-found: error
          retention-days: 14
          # A manual rerun shares the run ID. Keep one record for the current attempt.
          overwrite: true

      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REUSE: ${{ needs.main-proof.outputs.reuse }}
        run: |
          set -euo pipefail
          # Keep the two lists together equal to `needs` above. On merge_group,
          # unmatched push and workflow_dispatch, pytest is tests.yml's full six-shard
          # suite and must succeed; pr-affected must be skipped. On pull_request
          # the reverse holds. Failed, cancelled, skipped and missing required
          # results all fail this gate. A matched push requires only main-proof,
          # secret-scan and verified-trailer; main-proof has already checked the
          # run/tree and preserved main-scope archives.
          optional=()
          common=(compileall dependency-audit fleet-security installed-wheel mypy ruff sast secret-scan test-waits verified-trailer)
          case "$EVENT_NAME" in
            pull_request)
              must_succeed=(pr-affected "${common[@]}")
              must_skip=(pytest main-proof)
              ;;
            push)
              if [ "$REUSE" = true ]; then
                must_succeed=(main-proof secret-scan verified-trailer)
                must_skip=(pytest pr-affected compileall dependency-audit fleet-security installed-wheel mypy ruff sast test-waits)
              else
                must_succeed=(pytest "${common[@]}")
                must_skip=(pr-affected)
                optional=(main-proof)
              fi
              ;;
            merge_group|workflow_dispatch)
              must_succeed=(pytest "${common[@]}")
              must_skip=(pr-affected main-proof)
              ;;
            *)
              echo "::error::Unsupported event ${EVENT_NAME}"
              exit 1
              ;;
          esac
          if ! actual="$(jq -r 'if type == "object" then keys[] else error("not an object") end' \
                <<< "$NEEDS_JSON" 2> /dev/null)"; then
            echo "::error::Job results are not a JSON object; failing closed"
            exit 1
          fi
          failed=0
          for job in "${must_succeed[@]}"; do
            result="$(jq -r --arg job "$job" \
              '.[$job].result // "missing" | if type == "string" then . else "invalid" end' \
              <<< "$NEEDS_JSON")"
            echo "${job}: ${result} (required success)"
            if [ "$result" != "success" ]; then
              echo "::error::Required job ${job} finished with result ${result}"
              failed=1
            fi
          done
          for job in "${must_skip[@]}"; do
            result="$(jq -r --arg job "$job" \
              '.[$job].result // "missing" | if type == "string" then . else "invalid" end' \
              <<< "$NEEDS_JSON")"
            echo "${job}: ${result} (required skipped)"
            if [ "$result" != "skipped" ]; then
              echo "::error::Job ${job} finished with result ${result}; this event must not run it"
              failed=1
            fi
          done
          expected=("${must_succeed[@]}" "${must_skip[@]}" "${optional[@]}")
          while IFS= read -r job; do
            [ -n "$job" ] || continue
            if ! printf '%s\n' "${expected[@]}" | grep -qxF -- "$job"; then
              echo "::error::Unexpected job ${job} in the gate's dependencies"
              failed=1
            fi
          done <<< "$actual"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "CI Gate green: ${#must_succeed[@]} required job(s) succeeded on ${EVENT_NAME}."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          persist-credentials: false

      - name: Bind main CI evidence to this run and tree
        if: github.event_name == 'push'
        env:
          REUSE: ${{ needs.main-proof.outputs.reuse }}
          SOURCE: ${{ needs.main-proof.outputs.source }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          mode=full
          if [ "$REUSE" = true ]; then mode=reuse; fi
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg mode "$mode" \
            --arg sha "$GITHUB_SHA" --arg tree "$tree" \
            --argjson run "$GITHUB_RUN_ID" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson source "${SOURCE:-null}" \
            '{schema: "ci-gate-evidence.v1", repository: $repo,
              workflow: ".github/workflows/ci-gate.yml", mode: $mode,
              target: {run_id: $run, run_attempt: $attempt, commit: $sha, tree: $tree},
              source: $source}' > "$RUNNER_TEMP/ci-gate-evidence.json"
          cat "$RUNNER_TEMP/ci-gate-evidence.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve main CI evidence for release preflight
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-gate-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-gate-evidence.json
          if-no-files-found: error
          compression-level: 0
