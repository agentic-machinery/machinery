# DRAFT for the public learn-ukrainian/machinery repository (machinery move
# plan v1, section 4 steps 4 and 7). Install it there as
# .github/workflows/ci-gate.yml before final history clearance. It is not a
# check in this source repository.
#
# Bootstrap CI for the first push. Branch protection requires one check named
# "CI Gate", and the merge queue ruleset waits for that check on merge groups.
# Main pushes also run it to seed shared, verified tool archives. Pins and their
# upstream evidence are recorded in pins.txt beside this file; bump them
# together there.
#
# - Jobs: Ruff over lu_machinery/ with the source repository's Ruff version and
#   lint settings (the extracted tree has no Ruff configuration yet); compileall
#   of lu_machinery on the pinned Python (.python-version); the mypy ratchet (lu_machinery.lint.mypy_ratchet:
#   new errors fail, the baseline only shrinks); actionlint (with a pinned ShellCheck) and zizmor (offline) over
#   .github/workflows/; the TruffleHog secret scan and the Semgrep SAST scan;
#   dependency-audit (pip-audit of the uv.lock runtime closure, npm audit of
#   package-lock.json). The secret-scan and sast jobs below are the only
#   definition of each scan for the machinery repository; CodeQL code scanning
#   is codeql.yml beside this file, outside the gate. installed-wheel builds the release wheel
#   from the tracked tree, installs it offline with the uv.lock runtime export
#   (pip --require-hashes) into a clean venv and imports every lu_machinery
#   module from it, on the pinned Python and on the requires-python floor. It then checks that wheel against the product commit
#   pinned in product-consumer.pin beside this file: the release cut's
#   consumer test collection (release_cut consumer-collection) and the pin's
#   key consumer tests, on PRs and merge groups alike. pytest calls tests.yml for the full six-shard suite on
#   merge_group, push and workflow_dispatch. pull_request calls that workflow
#   as pr-affected and does not run the full suite.
# - The mypy job imports lu_machinery from the checkout: it runs the ratchet
#   module. installed-wheel imports only the installed wheel.
# - Every job counts its targets first and fails on zero, because the tools
#   exit 0 on an empty or missing target. Each job prints what it inspected.
# - CI Gate needs every other job, runs even when one of them fails, and passes
#   only when each job reports the result its event requires. On pull_request,
#   pr-affected must succeed and pytest must be skipped. On merge_group, push
#   and workflow_dispatch, pytest (the full suite) must succeed and pr-affected
#   must be skipped. A failed, cancelled, skipped or missing required job fails
#   the gate, because GitHub counts a skipped required check as passing. Each check name is the job
#   name. The called tests.yml reports its shards as "pytest / pytest (N)"
#   and their always() aggregate as "pytest / pytest shards"; `pytest` here
#   succeeds only if all of them do. On pull_request that job is skipped and
#   `pr-affected` is required instead. A failed, cancelled, skipped or missing
#   required job fails the gate on every event. A new job must be added to both
#   `needs` and the gate's expected list; nothing else catches a job left out of both.
# - Hosted runners only (ubuntu-24.04). Every tool is downloaded at a pinned
#   version and checked against a pinned SHA-256 before it runs: release
#   tarballs for actionlint, ShellCheck and uv; uv-managed CPython (uv checks
#   each download against the hash it ships); `uv sync --locked` from uv.lock,
#   which checks the SHA-256 of every wheel, for Ruff, mypy, zizmor and
#   pip-audit; hash-pinned PyPI wheels (pip --require-hashes
#   --only-binary=:all:) for Semgrep and the build tools; npm audit uses the
#   hosted runner's npm. Every venv lives in the job temp directory. Installers
#   that run Python use isolated interpreters (python -I), so no Python module
#   in the checkout is imported while installing.
# - Read-only contents permission (none for CI Gate), no kept checkout token,
#   no secrets. Scanners and zizmor run under `env -i`, so no runner credential
#   reaches them. zizmor runs offline: its online audits (impostor commits,
#   known-vulnerable actions) need a token, and the action pins in pins.txt are
#   checked against their upstream tags instead.
# - Suppressions (.trufflehogignore, trufflehog:ignore, nosemgrep, noqa, Ruff
#   and zizmor configuration) are repository content and are reviewed in the
#   diff, like this workflow.
name: CI Gate

on:
  # Main-scope archives are visible to future PR and merge-queue refs.
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    branches: [main]
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Python: every job runs the uv-managed CPython named in .python-version (the
# host's build), installed by .github/actions/uv-python with the uv release
# pinned below. Python dependencies come from uv.lock (`uv sync --locked`,
# which checks every SHA-256 in the lock). Named exceptions, hash-pinned
# heredocs: Semgrep (its closure pins mcp==1.29.0, which the project's mcp
# range excludes; it stays on CPython ${SEMGREP_PYTHON}), the build tools that
# release_cut reads from this file, and the product's uv for the consumer check.
# installed-wheel also runs on the requires-python floor, so the floor stays
# proven while the pin is newer.
# Cache only verified release archives, never venvs or repository build outputs.
# Fork PRs restore only. No prefix restore keys.
env:
  UV_VERSION: "0.13.1"
  UV_LINUX_X86_64_SHA256: eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220
  # uv-managed CPython only, the build the host runs; never the runner's own.
  UV_PYTHON_PREFERENCE: only-managed
  SEMGREP_PYTHON: "3.12"
  RUFF_VERSION: "0.15.21"
  MYPY_VERSION: "2.1.0"
  ZIZMOR_VERSION: "1.31.1"
  PIP_AUDIT_VERSION: "2.10.1"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_RELEASE_ASSET_ID: "384924896"
  ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_RELEASE_ASSET_ID: "336391469"
  SHELLCHECK_LINUX_X86_64_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
  TRUFFLEHOG_VERSION: "3.99.0"
  TRUFFLEHOG_RELEASE_ASSET_ID: "616256576"
  TRUFFLEHOG_LINUX_AMD64_SHA256: e35ae3fd1e4b7a0c1699d0fda1814282bf906d03379bd4337b092b3a84c6740b
  SEMGREP_VERSION: "1.183.0"
  SEMGREP_RULES_COMMIT: 16b9e6d45f10649f6a531ec4838ed9924372c3bc

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/uv-python # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        id: python
        with:
          uv-version: ${{ env.UV_VERSION }}
          uv-sha256: ${{ env.UV_LINUX_X86_64_SHA256 }}

      - name: Install Ruff (uv.lock lint group)
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/ruff-venv"
          rm -rf "$venv"
          UV_PROJECT_ENVIRONMENT="$venv" uv sync --locked --only-group lint
          reported="$("$venv/bin/ruff" --version)"
          if [ "$reported" != "ruff ${RUFF_VERSION}" ]; then
            echo "::error::Expected ruff ${RUFF_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: Ruff check lu_machinery/
        run: |
          set -euo pipefail
          ruff="$RUNNER_TEMP/ruff-venv/bin/ruff"
          if [ ! -d lu_machinery ]; then
            echo "::error::lu_machinery/ is missing; nothing would be checked"
            exit 1
          fi
          # Bootstrap lint settings: the source repository's pyproject.toml
          # [tool.ruff] table with scripts/ renamed to lu_machinery/. A config
          # file passed with --config applies to every file, its relative paths
          # resolve from the working directory, and any repository config is
          # ignored. Step 8 moves these settings into the machinery
          # pyproject.toml and drops this file and the --config flag.
          config="$RUNNER_TEMP/ruff-bootstrap.toml"
          cat > "$config" <<'TOML'
          line-length = 120
          target-version = "py312"
          src = [".", "lu_machinery"]
          exclude = [".venv/", "node_modules/", "starlight/", "lu_machinery/oneoff/"]

          [lint]
          select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF", "PLC0415"]
          ignore = ["RUF001", "RUF002", "RUF003", "E402", "E501", "E741"]

          [lint.per-file-ignores]
          "!lu_machinery/{api,project_api}/**.py" = ["PLC0415"]
          "lu_machinery/api/*.py" = ["B008"]
          "lu_machinery/project_api/*.py" = ["B008"]
          TOML
          python_files="$(find lu_machinery -type f -name '*.py' | wc -l)"
          # The files Ruff itself selects, after the configured exclusions.
          inspected="$("$ruff" check --no-cache --config "$config" --show-files lu_machinery | grep -c . || true)"
          echo "Ruff inspects ${inspected} file(s); lu_machinery/ holds ${python_files} Python file(s)."
          if [ "$python_files" -eq 0 ] || [ "$inspected" -eq 0 ]; then
            echo "::error::Ruff would inspect no Python files in lu_machinery/"
            exit 1
          fi
          "$ruff" check --no-cache --config "$config" --output-format=github lu_machinery

  compileall:
    name: Compile (pinned Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/uv-python # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        id: python
        with:
          uv-version: ${{ env.UV_VERSION }}
          uv-sha256: ${{ env.UV_LINUX_X86_64_SHA256 }}

      - name: Compile lu_machinery
        env:
          # uv-python checked this against .python-version.
          EXPECTED: ${{ steps.python.outputs.version }}
        run: |
          set -euo pipefail
          reported="$(python -I -c 'import platform; print(platform.python_version())')"
          if [ -z "$EXPECTED" ] || [ "$reported" != "$EXPECTED" ]; then
            echo "::error::Expected Python ${EXPECTED}, got: ${reported}"
            exit 1
          fi
          if [ ! -d lu_machinery ]; then
            echo "::error::lu_machinery/ is missing; nothing would be compiled"
            exit 1
          fi
          # compileall -q exits 0 on a missing or empty directory, so count first.
          python_files="$(find lu_machinery -type f -name '*.py' | wc -l)"
          if [ "$python_files" -eq 0 ]; then
            echo "::error::lu_machinery/ holds no Python files; nothing would be compiled"
            exit 1
          fi
          # Bytecode goes to the job temp directory, not the checkout, and its
          # count proves compileall reached every file. The prefix mirrors each
          # source's absolute directory and also receives the interpreter's own
          # stdlib bytecode, so only the mirror of lu_machinery/ is counted.
          prefix="$RUNNER_TEMP/pycache"
          rm -rf "$prefix"
          python -I -X pycache_prefix="$prefix" -m compileall -q lu_machinery
          mirror="${prefix}${PWD}/lu_machinery"
          if [ ! -d "$mirror" ]; then
            echo "::error::compileall wrote no bytecode for lu_machinery/"
            exit 1
          fi
          compiled="$(find "$mirror" -type f -name '*.pyc' | wc -l)"
          echo "Compiled ${compiled} of ${python_files} Python file(s) with Python ${reported}."
          if [ "$compiled" -ne "$python_files" ]; then
            echo "::error::compileall produced ${compiled} bytecode file(s) for ${python_files} source file(s)"
            exit 1
          fi

      - name: Remove bytecode
        if: always()
        run: rm -rf "$RUNNER_TEMP/pycache"

  mypy:
    name: mypy ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The ratchet's shrink check reads the baseline at HEAD^ as well as
          # HEAD and origin/main, and silently skips a ref it cannot read.
          fetch-depth: 2

      - uses: ./.github/actions/uv-python # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        id: python
        with:
          uv-version: ${{ env.UV_VERSION }}
          uv-sha256: ${{ env.UV_LINUX_X86_64_SHA256 }}

      - name: Fetch origin/main for the shrink check
        run: |
          set -euo pipefail
          # No --depth: on a push to main the checkout is the main tip, and a
          # depth-1 fetch of it would move the shallow boundary to HEAD and
          # drop HEAD^. Without it, Git fetches only commits it does not have.
          git fetch --no-tags --no-recurse-submodules origin \
            +refs/heads/main:refs/remotes/origin/main
          # A ref the ratchet cannot read is skipped, not failed, so require all three.
          for ref in HEAD HEAD^ origin/main; do
            if ! git rev-parse --verify --quiet "${ref}^{commit}" > /dev/null; then
              echo "::error::${ref} is not available; the baseline shrink check would be skipped"
              exit 1
            fi
          done
          if ! git cat-file -e origin/main:lu_machinery/lint/mypy_baseline.json; then
            echo "::error::origin/main has no lu_machinery/lint/mypy_baseline.json; the shrink check would be skipped"
            exit 1
          fi

      - name: Install mypy and the lu_machinery import closure (uv.lock)
        env:
          EXPECTED: ${{ steps.python.outputs.version }}
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mypy-venv"
          rm -rf "$venv"
          # mypy and the whole [project] dependency closure, without the project
          # itself (the ratchet imports the checkout). Typed packages change the
          # error census, so mypy alone does not reproduce the baseline. See pins.txt.
          UV_PROJECT_ENVIRONMENT="$venv" uv sync --locked --no-install-project --group typecheck
          reported="$("$venv/bin/python" -I -m mypy --version)"
          case "$reported" in
            "mypy ${MYPY_VERSION} "*) ;;
            *)
              echo "::error::Expected mypy ${MYPY_VERSION}, got: ${reported}"
              exit 1
              ;;
          esac
          version="$("$venv/bin/python" -I -c 'import platform; print(platform.python_version())')"
          if [ -z "$EXPECTED" ] || [ "$version" != "$EXPECTED" ]; then
            echo "::error::Expected Python ${EXPECTED}, got: ${version}"
            exit 1
          fi

      - name: Run the mypy ratchet over lu_machinery/
        env:
          LU_PRODUCT_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/mypy-venv"
          if [ ! -f lu_machinery/lint/mypy_baseline.json ]; then
            echo "::error::lu_machinery/lint/mypy_baseline.json is missing; nothing would be compared"
            exit 1
          fi
          python_files="$(find lu_machinery -type f -name '*.py' | wc -l)"
          echo "The ratchet checks lu_machinery/, which holds ${python_files} Python file(s)."
          if [ "$python_files" -eq 0 ]; then
            echo "::error::lu_machinery/ holds no Python files; mypy would check nothing"
            exit 1
          fi
          # The same command the source repository's CI and pre-push hook run,
          # with this repository's package name. It imports the ratchet from
          # the checkout, so it does not run isolated (-I).
          LEARN_UKRAINIAN_PYTHON="$venv/bin/python" \
            env -u PYTHONPATH -u MYPYPATH "$venv/bin/python" -m lu_machinery.lint.mypy_ratchet

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore verified actionlint
        uses: ./.github/actions/cached-release-tool # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        with:
          tool: actionlint
          version: ${{ env.ACTIONLINT_VERSION }}
          sha256: ${{ env.ACTIONLINT_LINUX_AMD64_SHA256 }}
          repository: rhysd/actionlint
          asset-id: ${{ env.ACTIONLINT_RELEASE_ASSET_ID }}
          token: ${{ github.token }}
          member: actionlint

      - name: Restore verified ShellCheck
        uses: ./.github/actions/cached-release-tool # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        with:
          tool: shellcheck
          version: ${{ env.SHELLCHECK_VERSION }}
          sha256: ${{ env.SHELLCHECK_LINUX_X86_64_SHA256 }}
          repository: koalaman/shellcheck
          asset-id: ${{ env.SHELLCHECK_RELEASE_ASSET_ID }}
          token: ${{ github.token }}
          member: shellcheck-v${{ env.SHELLCHECK_VERSION }}/shellcheck
          strip-components: '1'

      - name: Verify actionlint and ShellCheck versions
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/actionlint"
          reported="$("$tool/actionlint" -version | head -n 1)"
          if [ "$reported" != "$ACTIONLINT_VERSION" ]; then
            echo "::error::Expected actionlint ${ACTIONLINT_VERSION}, got: ${reported}"
            exit 1
          fi
          reported="$("$RUNNER_TEMP/shellcheck/shellcheck" --version | sed -n 's/^version: //p')"
          if [ "$reported" != "$SHELLCHECK_VERSION" ]; then
            echo "::error::Expected shellcheck ${SHELLCHECK_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: actionlint .github/workflows/
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/actionlint"
          if [ ! -d .github/workflows ]; then
            echo "::error::.github/workflows/ is missing; nothing would be linted"
            exit 1
          fi
          mapfile -t files < <(find .github/workflows -maxdepth 1 -type f \
            \( -name '*.yml' -o -name '*.yaml' \) | LC_ALL=C sort)
          echo "actionlint inspects ${#files[@]} workflow file(s)."
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::.github/workflows/ holds no workflow files"
            exit 1
          fi
          printf '  %s\n' "${files[@]}"
          # The pinned ShellCheck lints every run: script; pyflakes is disabled
          # so the result never depends on what the runner image ships.
          "$tool/actionlint" -shellcheck="$RUNNER_TEMP/shellcheck/shellcheck" -pyflakes= "${files[@]}"

      - name: ShellCheck .github/ shell scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find .github -type f -name '*.sh' | LC_ALL=C sort)
          echo "ShellCheck inspects ${#scripts[@]} shell script(s)."
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::.github/ holds no shell scripts; nothing would be checked"
            exit 1
          fi
          printf '  %s\n' "${scripts[@]}"
          "$RUNNER_TEMP/shellcheck/shellcheck" "${scripts[@]}"

      - name: Remove tools
        if: always()
        run: rm -rf "$RUNNER_TEMP/actionlint" "$RUNNER_TEMP/shellcheck"

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/uv-python # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        id: python
        with:
          uv-version: ${{ env.UV_VERSION }}
          uv-sha256: ${{ env.UV_LINUX_X86_64_SHA256 }}

      - name: Install zizmor (uv.lock lint group)
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/zizmor-venv"
          rm -rf "$venv"
          UV_PROJECT_ENVIRONMENT="$venv" uv sync --locked --only-group lint
          reported="$("$venv/bin/zizmor" --version)"
          if [ "$reported" != "zizmor ${ZIZMOR_VERSION}" ]; then
            echo "::error::Expected zizmor ${ZIZMOR_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: zizmor workflows and local actions
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/zizmor-venv"
          if [ ! -d .github/workflows ]; then
            echo "::error::.github/workflows/ is missing; nothing would be audited"
            exit 1
          fi
          mapfile -t files < <(find .github/workflows .github/actions -type f \
            \( -name '*.yml' -o -name '*.yaml' \) | LC_ALL=C sort)
          echo "zizmor audits ${#files[@]} workflow/action file(s) offline."
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::.github/workflows/ holds no workflow/action files"
            exit 1
          fi
          printf '  %s\n' "${files[@]}"
          work="$RUNNER_TEMP/zizmor"
          rm -rf "$work"
          mkdir -p "$work/home"
          # Any finding (exit 10 and above) or tool error fails the job.
          env -i PATH=/usr/bin:/bin HOME="$work/home" \
            "$venv/bin/zizmor" --offline --no-progress --format=github "${files[@]}"

      - name: Remove tools
        if: always()
        run: rm -rf "$RUNNER_TEMP/zizmor" "$RUNNER_TEMP/zizmor-venv"

  # Blocking secret scan with the pinned TruffleHog CLI (pins.txt).
  # - pull_request, merge_group and main pushes scan the commits between base and head;
  #   workflow_dispatch scans the full history of the dispatched ref.
  # - Verified, unknown and unverified results are reported (pins.txt records
  #   why). Findings fail the job (exit 183), and so do scanner errors
  #   (--fail-on-scan-errors), any other non-zero exit, unparsable output and
  #   results arriving with a zero exit.
  # - The CLI is the checksum-verified release binary, not a container, run
  #   with the command line of the pinned upstream action script (pins.txt).
  # - The job also fails when the range holds no commit, or when the root
  #   .trufflehogignore is missing or leaves no Python or workflow file in scope.
  secret-scan:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 120 || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # For the exclusion coverage check only; the scanner is a Go binary.
      - uses: ./.github/actions/uv-python # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        id: python
        with:
          uv-version: ${{ env.UV_VERSION }}
          uv-sha256: ${{ env.UV_LINUX_X86_64_SHA256 }}

      - name: Restore verified TruffleHog
        uses: ./.github/actions/cached-release-tool # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        with:
          tool: trufflehog
          version: ${{ env.TRUFFLEHOG_VERSION }}
          sha256: ${{ env.TRUFFLEHOG_LINUX_AMD64_SHA256 }}
          repository: trufflesecurity/trufflehog
          asset-id: ${{ env.TRUFFLEHOG_RELEASE_ASSET_ID }}
          token: ${{ github.token }}
          member: trufflehog

      - name: Verify TruffleHog version
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/trufflehog"
          reported="$("$tool/trufflehog" --version 2>&1)"
          if [ "$reported" != "trufflehog ${TRUFFLEHOG_VERSION}" ]; then
            echo "::error::Expected trufflehog ${TRUFFLEHOG_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: Scan for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.event.after }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            merge_group) base="$MQ_BASE"; head="$MQ_HEAD" ;;
            push) base="$PUSH_BASE"; head="$PUSH_HEAD" ;;
            workflow_dispatch) base=""; head="$(git rev-parse HEAD)" ;;
            *) echo "::error::Unsupported event ${EVENT_NAME}"; exit 1 ;;
          esac
          for rev in $base $head; do
            if ! git cat-file -e "${rev}^{commit}"; then
              echo "::error::Commit ${rev} is not in the checkout; nothing was scanned"
              exit 1
            fi
          done
          if [ -n "$base" ] && [ "$base" = "$head" ]; then
            echo "::error::Base and head are the same commit; nothing would be scanned"
            exit 1
          fi
          if [ -n "$base" ]; then
            commits="$(git rev-list --count "${base}..${head}")"
          else
            commits="$(git rev-list --count "$head")"
          fi
          echo "Scanning ${commits} commit(s) up to ${head}."
          if [ "$commits" -eq 0 ]; then
            echo "::error::No commits between base and head; nothing would be scanned"
            exit 1
          fi

          work="$RUNNER_TEMP/secret-scan"
          rm -rf "$work"
          mkdir -p "$work/home" "$work/tmp"
          findings="$work/findings.jsonl"

          # Exclusion coverage. TruffleHog reports no per-file coverage, so the
          # exclusions are applied here to the head tree the way TruffleHog
          # 3.99.0 applies them (pkg/common/filter.go and pkg/sources/git/git.go:
          # comment and blank lines are skipped, every other line is a regular
          # expression searched in the repository-relative path, and a match
          # skips the file). The job fails unless Python and workflow files
          # remain in scope. Patterns are limited to a syntax subset that
          # Python's re (ASCII mode) and Go's regexp read the same way; any
          # other pattern fails the job. Only counts and line numbers are
          # printed. Files changed in the scanned range are counted for the
          # log only: a pull request that changes only documentation, or only
          # deletes files, is still scanned and can pass.
          ignore="${GITHUB_WORKSPACE}/.trufflehogignore"
          if [ ! -f "$ignore" ]; then
            echo "::error::.trufflehogignore is missing at the repository root; the scan cannot run"
            exit 1
          fi
          git ls-tree -r -z --name-only "$head" > "$work/head-paths"
          if [ -n "$base" ]; then
            git diff -z --name-only --no-renames --diff-filter=d "$base" "$head" > "$work/range-paths"
          else
            : > "$work/range-paths"
          fi
          python -I - "$ignore" "$work/head-paths" "$work/range-paths" "${base:+range}" <<'PY'
          import re
          import sys

          # Escapes both engines read alike; groups with flags, POSIX classes,
          # {,n} (a quantifier in Python, a literal in Go), \s and \S (Python's
          # ASCII \s also matches \v, Go's does not) and non-ASCII text are
          # refused.
          ESCAPES = set(".^$*+?()[]{}|\\/-dDwW")
          # Go's \s is [\t\n\f\r ]; Go's line scanner drops one trailing \r.
          SKIP = re.compile(r"[\t\n\f\r ]*(#|$)")

          def supported(line):
              if any(not " " <= c <= "~" for c in line) or "(?" in line or "[:" in line or "{," in line:
                  return False
              i = 0
              while i < len(line):
                  if line[i] == "\\":
                      if i + 1 == len(line) or line[i + 1] not in ESCAPES:
                          return False
                      i += 2
                  else:
                      i += 1
              return True

          rules = []
          with open(sys.argv[1], encoding="utf-8") as stream:
              lines = stream.read().split("\n")
          for number, line in enumerate(lines, 1):
              line = line.removesuffix("\r")
              if SKIP.match(line):
                  continue
              rule = None
              if supported(line):
                  try:
                      rule = re.compile(line, re.ASCII)
                  except re.error:
                      rule = None
              if rule is None:
                  print(f"::error::.trufflehogignore line {number} uses regular expression syntax this check does not support")
                  sys.exit(1)
              rules.append(rule)

          def paths(name):
              with open(name, "rb") as stream:
                  return [p.decode("utf-8", "surrogateescape") for p in stream.read().split(b"\0") if p]

          def kept(items):
              return [p for p in items if not any(rule.search(p) for rule in rules)]

          tree = paths(sys.argv[2])
          python = [p for p in tree if p.endswith(".py")]
          workflows = [p for p in tree if re.fullmatch(r"\.github/workflows/[^/]+\.ya?ml", p)]
          kept_python, kept_workflows = kept(python), kept(workflows)
          print(f"Exclusions: {len(rules)} pattern(s). In scope at head: {len(kept_python)} of"
                f" {len(python)} Python file(s), {len(kept_workflows)} of {len(workflows)} workflow file(s).")
          if sys.argv[4]:
              changed = paths(sys.argv[3])
              print(f"Files added or modified in the range: {len(kept(changed))} of {len(changed)} in scope.")
          if not kept_python or not kept_workflows:
              print("::error::The exclusions leave no Python or no workflow files in scope; failing closed")
              sys.exit(1)
          PY
          args=(
            git "file://${GITHUB_WORKSPACE}"
            --branch "$head"
            --fail --no-update --json
            "--results=verified,unknown,unverified"
            --exclude-detectors=Lob
            --fail-on-scan-errors
            --exclude-paths="${GITHUB_WORKSPACE}/.trufflehogignore"
          )
          if [ -n "$base" ]; then
            args+=(--since-commit "$base")
          fi

          diagnostics="$work/stderr.log"
          # Scanner stderr can quote repository content (an ignore-file entry,
          # for example), so it goes to a file that is never printed. Only its
          # line count and the numeric fields of the final summary reach the log.
          set +e
          env -i PATH=/usr/bin:/bin HOME="$work/home" TMPDIR="$work/tmp" \
            "$RUNNER_TEMP/trufflehog/trufflehog" "${args[@]}" > "$findings" 2> "$diagnostics"
          rc=$?
          set -e
          echo "TruffleHog exited ${rc}; $(wc -l < "$diagnostics") stderr line(s) withheld from this log."
          jq -R -r 'fromjson? | select(type == "object" and .msg == "finished scanning")
            | [("chunks", "bytes", "verified_secrets", "unverified_secrets") as $k
               | "\($k)=\(.[$k] | if type == "number" then tostring else "?" end)"]
            | "Scan summary: " + join(" ")' "$diagnostics" 2> /dev/null || true

          # jq's own error text can quote the input, so it is discarded.
          if ! count="$(jq -s 'length' "$findings" 2> /dev/null)"; then
            echo "::error::TruffleHog output is not valid JSON (exit ${rc}); failing closed"
            exit 1
          fi
          if [ "$count" -gt 0 ]; then
            echo "::error::TruffleHog reported ${count} finding(s). Secret values are redacted from this log."
            # Location fields only, each a string, number or boolean; Raw, RawV2,
            # Redacted and ExtraData never reach the log.
            jq -r 'def s: if type == "string" or type == "number" or type == "boolean" then tostring else "?" end;
              .SourceMetadata.Data.Git as $git
              | "::error::TruffleHog \(.DetectorName | s) verified=\(.Verified | s)"
              + " \($git.file | s):\($git.line | s) commit=\($git.commit | s)"' \
              "$findings" 2> /dev/null || echo "::error::Finding locations could not be summarized"
          fi
          case "$rc" in
            0)
              if [ "$count" -ne 0 ]; then
                echo "::error::Findings were reported with exit 0; failing closed"
                exit 1
              fi
              echo "No secrets found."
              ;;
            183)
              exit 1
              ;;
            *)
              echo "::error::TruffleHog exited ${rc} (scan error); failing closed"
              exit 1
              ;;
          esac

      - name: Remove scan results
        if: always()
        run: rm -rf "$RUNNER_TEMP/secret-scan" "$RUNNER_TEMP/trufflehog"

  # Blocking SAST with the pinned Semgrep CE and the semgrep/semgrep-rules
  # checkout at the pinned commit (pins.txt).
  # - Rules come only from local directories of that checkout. No registry name
  #   (p/..., r/..., auto) is used, so nothing is fetched from semgrep.dev and
  #   metrics stay off. A missing checkout, a commit mismatch or a missing or
  #   empty rule directory fails the job.
  # - Diff-aware against .github/workflows/semgrep-baseline.json, the reviewed
  #   baseline of the first push (semgrep_baseline.py beside it): a finding not
  #   in the baseline fails the job, and so does a scan error without a path.
  #   A scan error in a file the change touches passes only when each of its
  #   spans lies on lines the PR diff leaves unchanged and the baseline records
  #   the same error (path, error type, span text hash), at most as many times
  #   as recorded; a timeout, an error without spans and any span on an added
  #   or modified line fail. A missing or mismatched baseline or rules
  #   checkout, unparsable output, any exit other than 0 or 1, and a scan that
  #   covered no Python file fail closed. Scan errors in untouched files are
  #   warnings. --timeout 30 and --jobs 2 are explicit; --strict is not used
  #   because the checker judges every error.
  # - Exclusions: Semgrep's built-in ignore list applies while the repository
  #   has no .semgrepignore (it skips test/, tests/, vendor/, build/, dist/ and
  #   similar), and files over 1 MB are skipped (Semgrep's default
  #   --max-target-bytes). prepublication-gate.sh allows exactly these two skip
  #   reasons and refuses a .semgrepignore anywhere in the history.
  # - The scanner runs with PYTHONSAFEPATH=1, so no Python module in the
  #   checkout is imported. Suppressions (.semgrepignore, nosemgrep comments)
  #   are repository content and are reviewed in the diff, like this workflow.
  sast:
    name: SAST (Semgrep CE)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/uv-python # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        id: python
        with:
          python: ${{ env.SEMGREP_PYTHON }}
          uv-version: ${{ env.UV_VERSION }}
          uv-sha256: ${{ env.UV_LINUX_X86_64_SHA256 }}

