          REQUIREMENTS
          "$venv/bin/python" -I -m pip install --no-cache-dir --disable-pip-version-check \
            --no-input --require-hashes --only-binary=:all: --requirement "$requirements"
          mkdir -p "$venv/home"
          reported="$(env -i PATH="$venv/bin:/usr/bin:/bin" HOME="$venv/home" PYTHONSAFEPATH=1 \
            "$venv/bin/semgrep" --version)"
          if [ "$reported" != "$SEMGREP_VERSION" ]; then
            echo "::error::Expected semgrep ${SEMGREP_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: Fetch semgrep-rules at the pinned commit
        run: |
          set -euo pipefail
          rules="$RUNNER_TEMP/semgrep-rules"
          rm -rf "$rules"
          git init --quiet "$rules"
          git -C "$rules" fetch --quiet --depth 1 --no-tags \
            https://github.com/semgrep/semgrep-rules.git "$SEMGREP_RULES_COMMIT"
          git -C "$rules" -c advice.detachedHead=false checkout --quiet FETCH_HEAD
          checked_out="$(git -C "$rules" rev-parse HEAD)"
          if [ "$checked_out" != "$SEMGREP_RULES_COMMIT" ]; then
            echo "::error::semgrep-rules is at ${checked_out}, expected ${SEMGREP_RULES_COMMIT}"
            exit 1
          fi

      - name: Scan with Semgrep
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          rules="$RUNNER_TEMP/semgrep-rules"
          venv="$RUNNER_TEMP/semgrep-venv"
          configs=(
            python/lang
            python/correctness
            python/jinja2
            python/jwt
            python/requests
            python/sh
            generic/secrets
            bash/lang
            yaml/github-actions
            yaml/kubernetes
          )
          args=()
          for config in "${configs[@]}"; do
            dir="$rules/$config"
            if [ ! -d "$dir" ] || [ -z "$(find "$dir" -name '*.yaml' -print -quit)" ]; then
              echo "::error::Rule config ${config} is missing from the semgrep-rules checkout"
              exit 1
            fi
            args+=(--config "$dir")
          done

          work="$RUNNER_TEMP/sast"
          rm -rf "$work"
          mkdir -p "$work/home" "$work/tmp"
          results="$work/results.json"
          diagnostics="$work/stderr.log"
          # Scanner stderr can quote repository content, so it goes to a file
          # that is never printed; only its line count reaches the log.
          set +e
          env -i PATH="$venv/bin:/usr/bin:/bin" HOME="$work/home" TMPDIR="$work/tmp" \
            PYTHONSAFEPATH=1 SEMGREP_SEND_METRICS=off SEMGREP_ENABLE_VERSION_CHECK=0 \
            "$venv/bin/semgrep" scan "${args[@]}" \
            --metrics=off --disable-version-check --error --timeout 30 --jobs 2 \
            --json --output "$results" --quiet . 2> "$diagnostics"
          rc=$?
          set -e
          echo "Semgrep exited ${rc}; $(wc -l < "$diagnostics") stderr line(s) withheld from this log."

          # Exactly one JSON object with results and errors arrays and a list of
          # scanned paths; anything else (missing file, other JSON, several
          # values) fails. jq's own error text can quote the input, so it is
          # discarded.
          if ! jq -s -e 'length == 1 and (.[0] | type == "object"
                and (.results | type) == "array" and (.errors | type) == "array"
                and (.paths.scanned | type) == "array")' \
                "$results" > /dev/null 2>&1; then
            echo "::error::Semgrep output is missing or malformed (exit ${rc}); failing closed"
            exit 1
          fi
          scanned="$(jq '.paths.scanned | length' "$results")"
          scanned_python="$(jq '[.paths.scanned[] | select(type == "string" and endswith(".py"))] | length' "$results")"
          echo "Semgrep scanned ${scanned} file(s), ${scanned_python} of them Python."
          if [ "$scanned" -eq 0 ] || [ "$scanned_python" -eq 0 ]; then
            echo "::error::Semgrep scanned no Python files; failing closed"
            exit 1
          fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::Semgrep exited ${rc} (scan error); failing closed"
            exit 1
          fi
          baseline=.github/workflows/semgrep-baseline.json
          checker=.github/workflows/semgrep_baseline.py
          if [ ! -f "$baseline" ] || [ ! -f "$checker" ]; then
            echo "::error::The Semgrep baseline or its checker is missing; failing closed"
            exit 1
          fi
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$MQ_BASE" ;;
            push) base="$PUSH_BASE" ;;
            workflow_dispatch) base="" ;;
            *) echo "::error::Unsupported event ${EVENT_NAME}"; exit 1 ;;
          esac
          : > "$work/changed"
          if [ -n "$base" ]; then
            if ! git cat-file -e "${base}^{commit}"; then
              echo "::error::Base commit ${base} is not in the checkout; failing closed"
              exit 1
            fi
            git diff -z --no-renames --name-only "$base" HEAD > "$work/changed"
          fi
          python -I -B "$checker" check --results "$results" --root . --rules-dir "$rules" \
            --baseline "$baseline" --changed "$work/changed" --base "$base" \
            --semgrep-version "$SEMGREP_VERSION" --rules-commit "$SEMGREP_RULES_COMMIT" \
            --configs "${configs[*]}"

      - name: Remove scan results
        if: always()
        run: >-
          rm -rf "$RUNNER_TEMP/sast" "$RUNNER_TEMP/semgrep-rules"
          "$RUNNER_TEMP/semgrep-venv" "$RUNNER_TEMP/semgrep-requirements.txt"

  # Blocking vulnerability audit of the release inputs, as the source
  # repository's dependency-audit job does it (pip-audit, then npm audit at
  # high and above), on every event.
  # - Python: pip-audit reads the runtime closure of uv.lock (`uv export
  #   --locked`, the input of the release wheelhouse) with its markers removed
  #   (--disable-pip --require-hashes: no resolver, no install) and fails on any
  #   known vulnerability; --strict also fails a pin it cannot look up. pip-audit
  #   silently drops a requirement whose environment marker is false on this
  #   runner, so markers are removed and its report must list exactly as many
  #   audited packages as the requirements parser it uses
  #   (pip-requirements-parser) finds in the export; an invalid line, an option
  #   line (-r, -c, an index) or a requirement that is not one hashed == pin
  #   fails the job.
  # - Node: npm audit reads package-lock.json only (--package-lock-only), every
  #   locked package with no --omit (a lock's dev flag cannot hide one), and
  #   fails on a high or critical advisory, or on any audit error.
  # - pip-audit and its dependency closure come from uv.lock (audit group);
  #   npm is the hosted runner's. Both run under `env -i`.
  # - A suppression is an `--ignore-vuln ID` argument below with its reason,
  #   reviewed in the diff like every other suppression.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/uv-python # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        id: python
        with:
          uv-version: ${{ env.UV_VERSION }}
          uv-sha256: ${{ env.UV_LINUX_X86_64_SHA256 }}

      - name: Install pip-audit (uv.lock audit group)
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/pip-audit-venv"
          rm -rf "$venv"
          UV_PROJECT_ENVIRONMENT="$venv" uv sync --locked --only-group audit
          reported="$("$venv/bin/pip-audit" --version)"
          if [ "$reported" != "pip-audit ${PIP_AUDIT_VERSION}" ]; then
            echo "::error::Expected pip-audit ${PIP_AUDIT_VERSION}, got: ${reported}"
            exit 1
          fi

      - name: Audit the runtime closure of uv.lock (pip-audit)
        run: |
          set -euo pipefail
          if [ ! -f uv.lock ]; then
            echo "::error::uv.lock is missing; nothing would be audited"
            exit 1
          fi
          work="$RUNNER_TEMP/pip-audit"
          rm -rf "$work"
          mkdir -p "$work/home"
          # The release's runtime closure: uv.lock less the project and every
          # dependency group, with hashes. release_cut builds the release
          # wheelhouse from the same export.
          uv export --locked --quiet --format requirements.txt --no-emit-project --no-default-groups \
            > "$work/runtime.txt"
          lock="$work/audit.txt"
          # The export keeps environment markers, and pip-audit drops a marker
          # that is false on this runner (the Windows-only packages, for
          # example). Every exported pin is audited instead: the audit input is
          # the export without markers, one hashed == pin per line, written by
          # pip-audit's own requirements parser, and the denominator is its count.
          pins="$(env -i PATH=/usr/bin:/bin "$RUNNER_TEMP/pip-audit-venv/bin/python" -I - "$work/runtime.txt" "$lock" <<'PY'
          import sys

          from pip_requirements_parser import RequirementsFile

          source, target = sys.argv[1:]
          parsed = RequirementsFile.from_file(source)
          problems = [f"invalid line {line.line_number}: {line.error_message}" for line in parsed.invalid_lines]
          problems += [f"option line {option.line_number} is not allowed: {option.dumps()}" for option in parsed.options]
          lines = []
          for req in parsed.requirements:
              specs = list(req.specifier) if req.specifier else []
              if req.link or len(specs) != 1 or specs[0].operator != "==" or not req.hash_options:
                  problems.append(f"line {req.line_number}: {req.dumps()!r} is not one hashed == pin")
                  continue
              hashes = " ".join(f"--hash={value}" for value in req.hash_options)
              lines.append(f"{req.name}=={specs[0].version} {hashes}\n")
          for problem in problems:
              print(f"::error::uv export {problem}", file=sys.stderr)
          if problems:
              sys.exit(1)
          with open(target, "w", encoding="utf-8") as handle:
              handle.writelines(lines)
          print(len(lines))
          PY
          )"
          echo "pip-audit checks ${pins} pinned package(s) of the uv.lock runtime closure."
          if [ "$pins" -eq 0 ]; then
            echo "::error::the uv.lock runtime export pins no package"
            exit 1
          fi
          report="$work/report.json"
          # Any known vulnerability, unknown package or tool error fails the job.
          status=0
          env -i PATH=/usr/bin:/bin HOME="$work/home" \
            "$RUNNER_TEMP/pip-audit-venv/bin/pip-audit" --strict --disable-pip --require-hashes \
            --progress-spinner=off --format json --output "$report" --requirement "$lock" || status=$?
          if [ ! -s "$report" ]; then
            echo "::error::pip-audit exited ${status} without a report"
            exit 1
          fi
          jq -r '.dependencies[] | .name as $name | .version as $version | (.vulns // [])[]
            | "::error::\($name) \($version): \(.id) (fixed in: \(.fix_versions | join(", ")))"' "$report"
          audited="$(jq '[.dependencies[] | select(has("skip_reason") | not)] | length' "$report")"
          vulns="$(jq '[.dependencies[] | (.vulns // [])[]] | length' "$report")"
          echo "pip-audit audited ${audited} of ${pins} pinned package(s); ${vulns} known vulnerabilities."
          if [ "$audited" -ne "$pins" ]; then
            echo "::error::pip-audit audited ${audited} package(s) but the lock pins ${pins}; a skipped or marker-excluded pin is not audited"
            exit 1
          fi
          if [ "$status" -ne 0 ] || [ "$vulns" -ne 0 ]; then
            echo "::error::pip-audit failed (exit ${status}, ${vulns} known vulnerabilities)"
            exit 1
          fi

      - name: Audit package-lock.json (npm audit)
        run: |
          set -euo pipefail
          for file in package.json package-lock.json; do
            if [ ! -f "$file" ]; then
              echo "::error::${file} is missing; nothing would be audited"
              exit 1
            fi
          done
          packages="$(jq '[.packages // {} | to_entries[] | select(.key != "")] | length' package-lock.json)"
          echo "npm audit checks ${packages} locked package(s) in package-lock.json."
          if [ "$packages" -eq 0 ]; then
            echo "::error::package-lock.json locks no package"
            exit 1
          fi
          npm_bin="$(command -v npm)"
          node_dir="$(dirname "$(command -v node)")"
          echo "$("$npm_bin" --version) (npm), $(node --version) (node)"
          work="$RUNNER_TEMP/npm-audit"
          rm -rf "$work"
          mkdir -p "$work/home"
          # A high or critical advisory, or any audit error, fails the job.
          env -i PATH="$node_dir:/usr/bin:/bin" HOME="$work/home" \
            "$npm_bin" audit --package-lock-only --audit-level=high

      - name: Remove tools
        if: always()
        run: >-
          rm -rf "$RUNNER_TEMP/pip-audit" "$RUNNER_TEMP/npm-audit"
          "$RUNNER_TEMP/pip-audit-venv"

  # The release path of docs/release.md on a hosted runner: build sdist and
  # wheel from the tracked tree with pinned tools, fill a temporary wheelhouse
  # with the wheel and the runtime closure exported from uv.lock, install
  # offline with hashes required, then import every module from the installed
  # wheel only. It runs twice: on the pinned Python (.python-version) and on
  # the requires-python floor, so the floor stays proven while CI and the host
  # run a newer pin. The product consumer check runs in the entry whose minor
  # version is the product pin's .python-version, and an entry fails when
  # neither entry matches it.
  installed-wheel:
    name: Installed wheel (${{ matrix.python }} Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: [pinned, floor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/uv-python # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.
        id: python
        with:
          python: ${{ matrix.python }}
          uv-version: ${{ env.UV_VERSION }}
          uv-sha256: ${{ env.UV_LINUX_X86_64_SHA256 }}

      - name: Build sdist and wheel with pinned tools
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/installed-wheel"
          rm -rf "$work"
          mkdir -p "$work/src" "$work/dist"
          # Only tracked files, as in a release build.
          git archive --format=tar HEAD | tar -x -C "$work/src"
          cd "$work"
          python -I -m venv build-venv
          cat > build-requirements.txt <<'REQUIREMENTS'
          build==1.6.1 \
              --hash=sha256:ecd351a4be9d35a9eaaba244a7687143c9c7d4aea6ac964e7e7ddab20cbcf4e7
          packaging==26.3 \
              --hash=sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c
          pyproject-hooks==1.2.0 \
              --hash=sha256:9e5c6bfa8dcc30091c74b0cf803c81fdd29d94f01992a7707bc97babb1141913
          setuptools==84.1.0 \
              --hash=sha256:5231689c6ac8156cd155cfb98c3fd6fb252c3e7e9bd3d78b64d3c55f132624c9
          REQUIREMENTS
          build-venv/bin/python -I -m pip install --no-cache-dir --disable-pip-version-check \
            --no-input --require-hashes --only-binary=:all: --requirement build-requirements.txt
          build-venv/bin/python -I -m build --sdist --wheel --no-isolation --outdir dist src
          ls -l dist
          wheels="$(find dist -maxdepth 1 -name 'lu_machinery-*-py3-none-any.whl' | wc -l)"
          sdists="$(find dist -maxdepth 1 -name 'lu_machinery-*.tar.gz' | wc -l)"
          if [ "$wheels" -ne 1 ] || [ "$sdists" -ne 1 ]; then
            echo "::error::Expected one wheel and one sdist, got ${wheels} and ${sdists}"
            exit 1
          fi

      - name: Install offline from a hash-locked wheelhouse
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/installed-wheel"
          lock="$work/runtime.txt"
          # The runtime closure of uv.lock, as release_cut exports it.
          uv export --locked --quiet --format requirements.txt --no-emit-project --no-default-groups > "$lock"
          cd "$work"
          wheel="$(find dist -maxdepth 1 -name 'lu_machinery-*-py3-none-any.whl')"
          version="$(python -I -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' src/pyproject.toml)"
          mkdir wheelhouse
          # The build venv's pip (a stdlib venv of the same interpreter): the
          # activated uv venv has no pip.
          build-venv/bin/python -I -m pip download --no-cache-dir --disable-pip-version-check --no-input \
            --require-hashes --only-binary=:all: --no-deps --dest wheelhouse --requirement "$lock"
          cp "$wheel" wheelhouse/
          # The consumer lock: the release line, then the dependency lock.
          digest="$(sha256sum "$wheel" | cut -d' ' -f1)"
          { printf 'lu-machinery==%s \\\n    --hash=sha256:%s\n' "$version" "$digest"; cat "$lock"; } > consumer.lock
          echo "lu-machinery ${version} sha256:${digest}; wheelhouse holds $(find wheelhouse -name '*.whl' | wc -l) wheel(s)"
          python -I -m venv consumer
          consumer/bin/python -I -m pip install --no-cache-dir --disable-pip-version-check --no-input \
            --no-index --find-links wheelhouse --require-hashes --requirement consumer.lock
          consumer/bin/python -I -m pip check --disable-pip-version-check

      - name: Import every module from the installed wheel
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/installed-wheel"
          mkdir -p "$work/scratch/home"
          cat > "$work/import_all.py" <<'PY'
          import importlib
          import importlib.metadata
          import sys
          from pathlib import Path

          import lu_machinery

          # Modules that need an optional extra of pyproject.toml, which the
          # lock does not install: each may fail only with ModuleNotFoundError
          # for that extra's package. No shipped module needs one today.
          OPTIONAL: dict[str, str] = {}

          site = Path(sys.argv[1]).resolve()
          origin = Path(lu_machinery.__file__).resolve()
          print(f"lu-machinery {importlib.metadata.version('lu-machinery')} from {origin}")
          if site not in origin.parents:
              sys.exit(f"::error::lu_machinery was imported from {origin}, not the consumer venv")
          # The distribution's file manifest (RECORD) lists every shipped
          # module, including namespace subtrees that pkgutil discovery skips.
          names = set()
          for file in importlib.metadata.distribution("lu-machinery").files or []:
              parts = file.parts
              if parts[0] != "lu_machinery" or file.suffix != ".py":
                  continue
              parts = parts[:-1] if parts[-1] == "__init__.py" else (*parts[:-1], file.stem)
              if not all(part.isidentifier() for part in parts):
                  sys.exit(f"::error::{file} is shipped but cannot be imported by name")
              names.add(".".join(parts))
          failed = {}
          optional = 0
          for name in sorted(names):
              try:
                  module = importlib.import_module(name)
              except ModuleNotFoundError as exc:
                  if name in OPTIONAL and exc.name == OPTIONAL[name]:
                      print(f"{name}: skipped, needs the optional {exc.name}")
                      optional += 1
                  else:
                      failed[name] = f"ModuleNotFoundError: {exc}"
                  continue
              except BaseException as exc:  # a module that exits on import fails too
                  failed[name] = f"{type(exc).__name__}: {exc}"
                  continue
              # Namespace packages have no __file__, only __path__ entries.
              origins = [module.__file__] if module.__file__ else list(module.__path__)
              stray = [path for path in origins if site not in Path(path).resolve().parents]
              if not origins or stray:
                  failed[name] = f"imported from {origins}"
          for name, reason in sorted(failed.items()):
              print(f"::error::{name}: {reason}")
          print(f"Imported {len(names) - len(failed) - optional} of {len(names)} module(s); {optional} need an optional extra.")
          if not names or failed:
              sys.exit(1)
          PY
          cd "$work/scratch"
          # No checkout, PYTHONPATH or runner variable reaches the imports.
          env -i PATH=/usr/bin:/bin HOME="$work/scratch/home" TMPDIR="$work/scratch" \
            LEARN_UKRAINIAN_PYTHON="$work/consumer/bin/python" \
            "$work/consumer/bin/python" -I -B "$work/import_all.py" "$work/consumer"

      # Product consumer check: the release cut's consumer test collection, then
      # the pinned key tests, at the product commit in product-consumer.pin,
      # with this wheel first. It runs in the consumer venv after the import
      # check, the order the cut uses.
      - name: Read the product consumer pin
        id: pin
        run: |
          set -euo pipefail
          pin=.github/workflows/product-consumer.pin
          commits="$(grep -c '^commit ' "$pin" || true)"
          commit="$(sed -nE 's/^commit ([0-9a-f]{40})$/\1/p' "$pin")"
          if [ "$commits" -ne 1 ] || [ -z "$commit" ]; then
            echo "::error::${pin} must hold exactly one 'commit <full SHA>' line"
            exit 1
          fi
          tests=()
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              '' | '#'* | 'commit '*) ;;
              'test '*)
                path="${line#test }"
                if ! [[ "$path" =~ ^tests/[A-Za-z0-9_/-]+\.py$ ]]; then
                  echo "::error::${pin}: not a product test file path: ${path}"
                  exit 1
                fi
                tests+=("$path")
                ;;
              *)
                echo "::error::${pin}: unknown line: ${line}"
                exit 1
                ;;
            esac
          done < "$pin"
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "::error::${pin} names no key test"
            exit 1
          fi
          printf '%s\n' "${tests[@]}" > "$RUNNER_TEMP/installed-wheel/key-tests.txt"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "Product pin learn-ukrainian/learn-ukrainian.github.io@${commit}; ${#tests[@]} key test file(s)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: learn-ukrainian/learn-ukrainian.github.io
          ref: ${{ steps.pin.outputs.commit }}
          path: product
          persist-credentials: false

      # The product environment needs the product's own Python minor version.
      - name: Match the product pin's Python
        id: consumer
        env:
          PYTHON: ${{ steps.python.outputs.version }}
          ENTRY: ${{ matrix.python }}
        run: |
          set -euo pipefail
          minor() { sed -nE 's/^(3\.[0-9]+)(\.[0-9]+)?$/\1/p'; }
          product="$(tr -d '[:space:]' < product/.python-version | minor)"
          pinned="$(tr -d '[:space:]' < .python-version | minor)"
          floor="$(sed -nE 's/^requires-python = ">=(3\.[0-9]+)"$/\1/p' pyproject.toml)"
          here="$(printf '%s\n' "$PYTHON" | minor)"
          echo "product pin Python ${product:-unreadable}; pinned ${pinned}; floor ${floor}; this entry (${ENTRY}) ${here}"
          if [ -z "$product" ] || { [ "$product" != "$pinned" ] && [ "$product" != "$floor" ]; }; then
            echo "::error::The product pin's Python ${product:-unreadable} is neither the pinned nor the floor minor; no entry would run the consumer check"
            exit 1
          fi
          if [ "$product" = "$here" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "The ${ENTRY} entry skips the product consumer check; the entry on Python ${product} runs it." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the product environment at the pin
        if: steps.consumer.outputs.run == 'true'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/installed-wheel"
          product="$GITHUB_WORKSPACE/product"
          cd "$work"
          python -I -m venv uv-venv
          cat > uv-requirements.txt <<'REQUIREMENTS'
          uv==0.12.9 \
              --hash=sha256:5badfd805fd88bf99b4b4f044f6e8f762f1892cab27477f4427bb473e93dd049
          REQUIREMENTS
          uv-venv/bin/python -I -m pip install --no-cache-dir --disable-pip-version-check \
            --no-input --require-hashes --only-binary=:all: --requirement uv-requirements.txt
          uv="$work/uv-venv/bin/uv"
          # The product's own CI install (.github/actions/python-ci-env at the
          # pin), less its lu-machinery release: the candidate replaces it.
          python -I -m venv --without-pip product-venv
          grep -viE -e '^(torch|torchvision|open_clip_torch|stanza)==' -e '^\./packages/v4-runtime$' \
            "$product/requirements-lock.txt" > product-requirements.txt
          "$uv" pip install --python product-venv/bin/python --no-deps -r product-requirements.txt
          cd "$product"
          "$uv" pip install --python "$work/product-venv/bin/python" --no-deps --no-build-isolation ./packages/v4-runtime
          "$work/product-venv/bin/python" packages/v4-runtime/build_assets.py

      - name: Collect the product's tests with the candidate first
        if: steps.consumer.outputs.run == 'true'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/installed-wheel"
          product="$GITHUB_WORKSPACE/product"
          candidate="$work/consumer/bin/python"
          wheel="$(find "$work/dist" -maxdepth 1 -name 'lu_machinery-*-py3-none-any.whl')"
          version="$(python -I -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])' "$work/src/pyproject.toml")"
          commit="$(git -C "$product" rev-parse HEAD)"
          echo "Testing lu-machinery ${version} sha256:$(sha256sum "$wheel" | cut -d' ' -f1) against learn-ukrainian/learn-ukrainian.github.io@${commit}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          # Product modules resolve the project interpreter at import; the
          # 0.1.23 cut failed its collection with this unset.
          export LEARN_UKRAINIAN_PYTHON="$candidate"
          # The cut's own step, from the installed candidate (release_cut consumer-collection).
          if ! "$candidate" -I -m lu_machinery.release_cut consumer-collection --python "$candidate" \
              --product "$product" --product-python "$work/product-venv/bin/python" --version "$version" \
              --work "$work/collection" | tee -a "$GITHUB_STEP_SUMMARY"; then
            sed -n '/= ERRORS =/,$p' "$work/collection/cut.log" | tail -n 200
            exit 1
          fi

      - name: Run the key consumer tests with the candidate first
        if: steps.consumer.outputs.run == 'true'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/installed-wheel"
          product="$GITHUB_WORKSPACE/product"
          candidate="$work/consumer/bin/python"
          mapfile -t tests < "$work/key-tests.txt"
          cd "$product"
          # The collection environment: the candidate's venv now ends with the
          # product environment's site-packages.
          env -u PYTHONPATH LEARN_UKRAINIAN_PYTHON="$candidate" LU_PRODUCT_ROOT="$product" \
            LEARN_UKRAINIAN_PRIMARY_REPO_ROOT="$product" "$candidate" -m pytest "${tests[@]}"
          echo "Key consumer tests passed: ${tests[*]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove build files
        if: always()
        run: rm -rf "$RUNNER_TEMP/installed-wheel"

  # Full six-shard suite. Skipped on pull_request; CI Gate then requires that
  # skip, and requires pr-affected instead. A skip on merge_group fails the gate.
  pytest:
    name: pytest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.

  # Changed tests, importers, text readers, guards and repo_wide invariants.
  # The workflow run shows this job's time. merge_group does not run it.
  pr-affected:
    name: PR changed tests and guards
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 does not support $/ syntax.

  ci-gate:
    name: CI Gate
    # always(): a job skipped because a dependency failed would otherwise count
    # as a passing required check.
    if: always()
    needs: [ruff, compileall, mypy, actionlint, zizmor, secret-scan, sast, dependency-audit, installed-wheel, pytest, pr-affected]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Keep the two lists together equal to `needs` above. On merge_group,
          # push and workflow_dispatch, pytest is tests.yml's full six-shard
          # suite and must succeed; pr-affected must be skipped. On pull_request
          # the reverse holds. Failed, cancelled, skipped and missing required
          # results all fail this gate.
          common=(actionlint compileall dependency-audit installed-wheel mypy ruff sast secret-scan zizmor)
          case "$EVENT_NAME" in
            pull_request)
              must_succeed=(pr-affected "${common[@]}")
              must_skip=(pytest)
              ;;
            merge_group|push|workflow_dispatch)
              must_succeed=(pytest "${common[@]}")
              must_skip=(pr-affected)
              ;;
            *)
              echo "::error::Unsupported event ${EVENT_NAME}"
              exit 1
              ;;
          esac
          if ! actual="$(jq -r 'if type == "object" then keys[] else error("not an object") end' \
                <<< "$NEEDS_JSON" 2> /dev/null)"; then
            echo "::error::Job results are not a JSON object; failing closed"
            exit 1
          fi
          failed=0
          for job in "${must_succeed[@]}"; do
            result="$(jq -r --arg job "$job" \
              '.[$job].result // "missing" | if type == "string" then . else "invalid" end' \
              <<< "$NEEDS_JSON")"
            echo "${job}: ${result} (required success)"
            if [ "$result" != "success" ]; then
              echo "::error::Required job ${job} finished with result ${result}"
              failed=1
            fi
          done
          for job in "${must_skip[@]}"; do
            result="$(jq -r --arg job "$job" \
              '.[$job].result // "missing" | if type == "string" then . else "invalid" end' \
              <<< "$NEEDS_JSON")"
            echo "${job}: ${result} (required skipped)"
            if [ "$result" != "skipped" ]; then
              echo "::error::Job ${job} finished with result ${result}; this event must not run it"
              failed=1
            fi
          done
          expected=("${must_succeed[@]}" "${must_skip[@]}")
          while IFS= read -r job; do
            [ -n "$job" ] || continue
            if ! printf '%s\n' "${expected[@]}" | grep -qxF -- "$job"; then
              echo "::error::Unexpected job ${job} in the gate's dependencies"
              failed=1
            fi
          done <<< "$actual"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "CI Gate green: ${#must_succeed[@]} required job(s) succeeded on ${EVENT_NAME}."
