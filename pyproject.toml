[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lu-machinery"
version = "0.1.28"
description = "Shared agent orchestration and development tooling"
requires-python = ">=3.12"
# Direct third-party imports under lu_machinery/, including the CI tools it runs.
# Product-only packages are not index dependencies; their split is separate work.
dependencies = [
    "coverage>=7.17.0",
    "fastapi>=0.139.0",
    "filelock>=3.32.2",
    "Flask>=3.1.3",
    "graphql-core==3.3.1",
    "ijson>=3.6.0",
    "Jinja2>=3.1",
    "jsonschema>=4.20",
    "markdown-it-py>=4.2.0",
    "mcp>=2.2,<3",
    "packaging>=26.3",
    "pre-commit==4.6.0",
    "prometheus-client>=0.26.0",
    "psutil>=7.2",
    "psycopg[binary]==3.3.6",
    "pydantic>=2.13.5",
    "PyJWT[crypto]>=2.15.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.6",
    "PyYAML>=6.0",
    "referencing>=0.37.0",
    "starlette>=1.3.1",
    "uvicorn>=0.48.0",
]

[project.optional-dependencies]
test = ["PyMuPDF==2.1"]

# Development tools, locked in uv.lock beside the runtime closure (PEP 735;
# never part of the wheel's metadata). CI selects them per job with
# `uv sync --locked`; see .github/workflows/ci-gate.yml.
[dependency-groups]
# pip: tests drive `python -m pip` in the test environment, and a uv
# environment has no pip of its own.
test = [
    "pip==26.3",
    "pymupdf4llm==2.1",
    "pytest-cov==7.1.0",
    "pytest-rerunfailures==16.7",
    "pytest-timeout==2.4.0",
]
typecheck = ["mypy==2.1.0"]
lint = ["ruff==0.15.21", "zizmor==1.31.1"]
audit = ["pip-audit==2.10.1"]

[tool.uv]
# One uv for the lock and every CI job (pins.txt UV_VERSION).
required-version = "==0.13.1"
# Semgrep stays a hash-pinned install in ci-gate.yml and tests.yml: semgrep
# 1.183.0 requires mcp==1.29.0, which this project's mcp>=2.2 excludes.

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# Shared hook modules use the installed namespace beside lu_machinery.
# Other resource readers use machinery_path.
include = ["lu_machinery*", "agents_extensions.shared"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "starlight/",
    "node_modules/",
]
# Gradual adoption: the shared runtime modules that carry a baseline.
files = [
    "lu_machinery/api/main.py",
    "lu_machinery/api/state_helpers.py",
    "lu_machinery/agent_runtime",
    # The Claude account route key (#10630): its owner and the decision consumers outside agent_runtime.
    "lu_machinery/fleet/claude_account_lane.py",
    "lu_machinery/review/closeout_cli.py",
    "lu_machinery/lib/claude_weekly_used.py",
]

[tool.setuptools.data-files]
"share/lu-machinery/node-contract" = ["package.json", "package-lock.json", ".nvmrc"]

[tool.pytest.ini_options]
markers = [
    "live_network: opt-out of socket-guard for integration tests requiring outbound network",
]
