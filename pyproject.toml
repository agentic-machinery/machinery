[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lu-machinery"
version = "0.1.69"
description = "Shared agent orchestration and development tooling"
requires-python = ">=3.12"
# Core commands also read routing and verification helpers from the API package.
dependencies = [
    "fastapi>=0.139.0",
    "filelock>=3.32.2",
    "graphql-core==3.3.1",
    "ijson>=3.6.0",
    "jsonschema>=4.20",
    "markdown-it-py>=4.2.0",
    "packaging>=26.3",
    "pre-commit>=4.6.0",
    "prometheus-client>=0.26.0",
    "psutil>=7.2",
    "pydantic>=2.13.5",
    "PyJWT[crypto]>=2.15.0",
    "PyYAML>=6.0",
    "referencing>=0.37.0",
    "starlette>=1.3.1",
]

[project.optional-dependencies]
api = [
    "psycopg[binary]==3.3.6",  # Postgres-backed API routes need the binary driver.
    "uvicorn>=0.48.0",
]
postgres = ["psycopg[binary]==3.3.6"]
pytest = ["coverage>=7.17.0", "pytest>=9.1.1", "pytest-xdist>=3.6"]
test = ["hypothesis==6.170.15"]

# Development tools, locked in uv.lock beside the runtime closure (PEP 735;
# never part of the wheel's metadata). CI selects them per job with
# `uv sync --locked`; see .github/workflows/ci-gate.yml.
[dependency-groups]
# Release and CI build tools (`python -I -m build --sdist --wheel --no-isolation`),
# exported with hashes from uv.lock and installed with `pip install --require-hashes`.
build = [
    "build==1.6.1",
    "packaging==26.3",
    "pyproject-hooks==1.2.0",
    "setuptools==84.1.0",
]
# pip: tests drive `python -m pip` in the test environment, and a uv
# environment has no pip of its own.
test = [
    "pip==26.3",
    "httpx2==2.16.0",  # ASGI transport used by the API and Work tests.
    "mcp>=1.30.0",  # FastMCP used by the opt-in permission test.
    "PyMuPDF==2.1",
    "pymupdf4llm==2.1",
    "pytest-cov==7.1.0",
    "pytest-rerunfailures==16.7",
    "pytest-timeout==2.4.0",
]
typecheck = ["mypy==2.4.0"]
lint = ["ruff==0.15.21", "zizmor==1.31.1"]
audit = ["pip-audit==2.10.1"]
attribution = ["markdown-it-py>=4.2.0"]
semgrep = ["semgrep==1.183.0"]

[tool.uv]
# One uv for the lock and every CI job (pins.txt UV_VERSION).
required-version = "==0.13.9"
exclude-newer = "7 days"
exclude-newer-package = { lu-machinery = false }
# Semgrep 1.183.0 pins vulnerable MCP and OpenTelemetry releases. Scope the
# patched versions to that wheel and keep the entire scanner hash-locked.
# The OpenTelemetry SDK, exporter and instrumentations share version pins.
# Its wcmatch~=8.3 is vulnerable to GHSA-53pm-wgxf-c6qf (ReDoS); 11.2 is the
# first patched release. Semgrep calls only glob.globmatch(GLOBSTAR | DOTGLOB).
override-dependencies = [
    { package = { name = "semgrep", version = "1.183.0" }, dependencies = [
        "mcp==1.30.0",
        "wcmatch>=11.2",
        "opentelemetry-api==1.45.2",
        "opentelemetry-sdk==1.45.2",
        "opentelemetry-exporter-otlp-proto-http==1.45.2",
        "opentelemetry-instrumentation-requests==0.66b2",
        "opentelemetry-instrumentation-threading==0.66b2",
    ] },
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# Shared hook modules use the installed namespace beside lu_machinery.
# Other resource readers use machinery_path.
include = ["lu_machinery*", "agents_extensions.shared"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = [".", "lu_machinery"]
exclude = [".venv/", "node_modules/", "starlight/", "lu_machinery/oneoff/"]

[tool.ruff.per-file-target-version]
# The fingerprint functions must retain the 3.12 ast.dump branch.
"lu_machinery/ci/subprocess_timeout_guard.py" = "py312"
"lu_machinery/hygiene/lint_source_db_writable_connects.py" = "py312"
"lu_machinery/lint/lint_test_waits.py" = "py312"
# Generator requires all three type arguments on the supported floor.
"lu_machinery/common/pytest_scratch.py" = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF", "PLC0415"]
ignore = ["RUF001", "RUF002", "RUF003", "E402", "E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"!lu_machinery/{api,project_api}/**.py" = ["PLC0415"]
"lu_machinery/api/*.py" = ["B008"]
"lu_machinery/project_api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "starlight/",
    "node_modules/",
]
# Gradual adoption: the shared runtime modules that carry a baseline.
files = [
    "lu_machinery/api/main.py",
    "lu_machinery/api/state_helpers.py",
    "lu_machinery/agent_runtime",
    # The Claude account route key (#10630): its owner and the decision consumers outside agent_runtime.
    "lu_machinery/fleet/claude_account_lane.py",
    "lu_machinery/review/closeout_cli.py",
    "lu_machinery/lib/claude_weekly_used.py",
]

[tool.setuptools.data-files]
"share/lu-machinery/node-contract" = ["package.json", "package-lock.json", ".nvmrc"]
"share/lu-machinery/ci" = [".github/workflows/pins.txt"]

[tool.pytest.ini_options]
# Retain only failures so passed tests' tmp dirs do not accumulate for the session.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
markers = [
    "live_network: opt-out of socket-guard for integration tests requiring outbound network",
]
