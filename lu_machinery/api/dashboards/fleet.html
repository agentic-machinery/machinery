<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet — Machinery</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/machinery.css">
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header>
  <div class="header-top">
    <div class="title">
      <h1>Fleet</h1>
      <p class="purpose">Which seats have queued mail, how long it has waited, and the live workers and Fleet Comms backlog.</p>
    </div>
    <div class="header-utils">
      <nav class="sites" id="machinery-sites" aria-label="Sites"></nav>
      <button type="button" class="theme-toggle" id="theme-toggle">Theme: Auto</button>
      <div class="refresh">
        <span class="muted" id="last-refresh">Loading…</span>
        <button type="button" class="retry" id="refresh-retry" hidden aria-label="Retry refresh">Retry</button>
      </div>
    </div>
  </div>
  <div class="header-nav">
    <nav class="pages" id="machinery-nav" aria-label="Machinery pages"></nav>
    <div class="chips" id="chips"></div>
  </div>
</header>
<main id="main" tabindex="-1">
  <section class="wide stacked" id="seats">
    <h2>Seats <span class="age" id="seats-age">Loading…</span></h2>
    <p id="seats-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
    <div id="seats-content">Loading…</div>
  </section>
  <section class="wide stacked" id="messages">
    <h2>Messages <span class="age" id="messages-age">Loading…</span></h2>
    <form id="message-filters" class="filters" method="get" action="/fleet">
      <label>Seat
        <select id="filter-seat" name="seat" autocomplete="off">
          <option value="">All seats</option>
        </select>
      </label>
      <label>State
        <select id="filter-state" name="state" autocomplete="off">
          <option value="">Any state</option>
          <option value="queued">queued</option>
          <option value="running">running</option>
          <option value="acknowledged">acknowledged</option>
          <option value="failed">failed</option>
          <option value="expired">expired</option>
          <option value="dead_lettered">dead_lettered</option>
        </select>
      </label>
      <label>Since
        <select id="filter-since" name="since" autocomplete="off">
          <option value="7d" selected>Last 7 d</option>
          <option value="24h">Last 24 h</option>
          <option value="all">All</option>
        </select>
      </label>
      <button type="button" class="retry" data-clear-filters>Clear filters</button>
    </form>
    <p id="messages-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
    <div id="messages-content">Loading…</div>
  </section>
  <section class="wide" id="fleet">
    <h2>Agent fleet <span class="age" id="workers-age">Loading…</span></h2>
    <p id="workers-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
    <div id="workers-content">Loading…</div>
    <h3>Recently finished <span class="age muted" id="recent-age">Loading…</span></h3>
    <p id="recent-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
    <div id="recent-content">Loading…</div>
  </section>
  <section class="wide" id="comms">
    <h2>Fleet Comms <span class="age" id="comms-age">Loading…</span></h2>
    <p id="comms-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
    <div id="comms-content">Loading…</div>
  </section>
</main>
<script src="/machinery.js"></script>
<script>
"use strict";
const {
  escapeHtml, fetchJson, span, relative, table, td, text, unknown, chip,
  ciLabel, prLink, prSnapshotFresh, createPanelRunner,
} = Machinery;

const ACTIVE = new Set(["spawning", "running", "settling", "needs_finalize"]);
const CLAUDE_ACCOUNTS = {a: "Claude a", b: "Claude b"};
const CODEX_ACCOUNTS = {sub: "Codex a", "b-sub": "Codex b", api: "Codex API", "b-api": "Codex b API"};

let latestPrsReading = null;

function currentPrs(now = Date.now()) {
  return latestPrsReading && prSnapshotFresh(latestPrsReading, now) ? latestPrsReading.data : null;
}

function account(task) {
  if (task.claude_account) return Object.hasOwn(CLAUDE_ACCOUNTS, task.claude_account) ? CLAUDE_ACCOUNTS[task.claude_account] : "Claude, other account";
  if (task.codex_account) return Object.hasOwn(CODEX_ACCOUNTS, task.codex_account) ? CODEX_ACCOUNTS[task.codex_account] : "Codex, other account";
  return task.agent === "agy" ? "AGY" : null;
}

function modelOf(task) {
  return task.observed_model || task.model || null;
}

function prIndex(prs) {
  const index = [];
  if (!prs || prs.status !== "ok") return index;
  for (const repo of Array.isArray(prs.repositories) ? prs.repositories : []) {
    if (repo.status !== "ok") continue;
    for (const pr of Array.isArray(repo.pull_requests) ? repo.pull_requests : []) {
      if (pr.task_reference) index.push({repo: repo.name, ...pr});
    }
  }
  return index;
}

function ownPr(task, index) {
  const id = String(task.task_id || "");
  return id ? index.find(pr => pr.task_reference === id) || null : null;
}

function taskPrCell(task, index) {
  let open = ownPr(task, index);
  // A recorded delivery PR is authoritative; a different open PR never replaces it.
  if (open && task.delivery_pr && task.delivery_pr !== `#${open.number}`) open = null;
  if (open) {
    const [label, cls] = ciLabel(open.ci);
    return td(`${prLink(open.repo, open)} <span class="${cls}">${escapeHtml(label)}</span>`
      + (open.queue ? ` <span class="ok">queued ${escapeHtml(open.queue.position ?? "")}</span>` : ""));
  }
  return text(task.delivery_pr || null, task.delivery_pr ? "" : "muted");
}

function doing(task) {
  const review = /-review-(\d+)-r(\d+)$/.exec(task.task_id || "");
  const role = review ? `reviewing PR ${review[1]}, round ${review[2]}` : task.research_role || task.status;
  const progress = typeof task.commits_ahead === "number" ? `${task.commits_ahead} commits ahead` : null;
  const touched = task.updated_at ? `record updated ${relative(task.updated_at)}` : null;
  return [role, progress, task.push_state && task.push_state !== "unknown" ? task.push_state : null, touched]
    .filter(Boolean).join(" · ");
}

function renderWorkers(active, prs = currentPrs()) {
  const tasks = Array.isArray(active.tasks) ? active.tasks : [];
  const index = prIndex(prs);
  return table(["Task", "Model", "Account", "Running", "Doing", "PR"], tasks.map(task => [
    text(task.task_id),
    text(modelOf(task) || task.agent),
    text(account(task)),
    text(span(task.age_s), task.age_s > 3 * 3600 ? "num bad" : task.age_s > 2 * 3600 ? "num warn" : "num"),
    text(doing(task)),
    taskPrCell(task, index),
  ]));
}

const OUTCOME_CLASS = {
  done: "ok", failed: "bad", crashed: "bad", timeout: "bad",
  no_deliverable: "warn", cancelled: "muted", rate_limited: "warn",
};

function renderRecent(list) {
  const tasks = (Array.isArray(list.tasks) ? list.tasks : []).filter(task => !ACTIVE.has(task.status));
  const attention = list.needs_attention || {};
  const pending = Array.isArray(attention.tasks) ? attention.tasks : [];
  const attentionHtml = attention.total ? `<details><summary class="warn">${escapeHtml(attention.total)} unfinished task records need a keep/close decision. Showing up to ${pending.length}.</summary>`
    + table(["Task", "Model", "State"], pending.map(task => [text(task.task_id),
      text(modelOf(task) || task.agent), text(task.status, "bad")])) + "</details>" : "";
  return table(["Task", "Model", "Outcome", "Finished", "Took", "PR"], tasks.map(task => [
    text(task.task_id),
    text(modelOf(task) || task.agent),
    text(task.status, OUTCOME_CLASS[task.status] || "bad"),
    text(task.finished_at ? relative(task.finished_at) : null, "num"),
    text(span(task.duration_s), "num"),
    text(task.delivery_pr || null, task.delivery_pr ? "" : "muted"),
  ])) + attentionHtml;
}

function renderComms(metrics) {
  if (metrics.db_error || metrics.db_missing) return unknown("Fleet Comms is unavailable");
  const deliveries = metrics.deliveries || {}, jobs = metrics.jobs || {};
  const reachable = metrics.store?.reachable;
  const windows = metrics.failure_windows || {}, lifetime = metrics.failure_lifetime || {};
  const rows = [
    [text("Store"), text(reachable ? `${metrics.source || "plane"} reachable` : "UNREACHABLE", reachable ? "ok" : "bad"), text(""), text(""), text("")],
    [text("Deliveries queued"), text(deliveries.queued, "num"), text(""), text(""), text("")],
    [text("Jobs queued"), text(jobs.queued, "num"), text(""), text(""), text("")],
  ];
  for (const [key, label] of [["dead_letters", "Dead letters"], ["failed_deliveries", "Deliveries failed"], ["failed_jobs", "Jobs failed"]]) {
    const day = windows["24h"]?.[key], week = windows["7d"]?.[key];
    rows.push([text(label), text(""), text(day?.total ?? "?", day?.total ? "num warn" : "num"), text(week?.total ?? "?", week?.total ? "num warn" : "num"), text(lifetime[key] ?? "?", "num")]);
    const recipients = new Set([...Object.keys(day?.by_recipient || {}), ...Object.keys(week?.by_recipient || {})]);
    for (const recipient of [...recipients].sort()) rows.push([text(`  ${recipient}`), text(""), text(day?.by_recipient?.[recipient] ?? 0, "num"), text(week?.by_recipient?.[recipient] ?? 0, "num"), text("")]);
  }
  return table(["Measure", "Current", "24 h", "7 d", "Lifetime"], rows);
}

// Filters and paging live in the page URL. Only these keys are sent to the deliveries route.
function pageQuery() {
  try {
    const search = typeof location === "object" && location && typeof location.search === "string" ? location.search : "";
    return new URLSearchParams(search);
  } catch {
    return new URLSearchParams();
  }
}

const SEATS_URL = "/api/fleet/seats";
const DELIVERIES_URL = "/api/fleet/deliveries";
const LOG_DOWN = new Set(["db_unavailable", "db_missing", "plane_root_unavailable", "authority_unsupported_component"]);

function deliveryQuery() {
  const query = new URLSearchParams();
  const page = pageQuery();
  for (const key of ["seat", "state", "since", "limit", "offset"]) {
    const value = page.get(key);
    if (value) query.set(key, value);
  }
  return query;
}

function deliveryUrl() {
  const text = deliveryQuery().toString();
  return text ? `${DELIVERIES_URL}?${text}` : DELIVERIES_URL;
}

function rosterReady(payload) {
  return Boolean(payload)
    && payload.driver_roster === "available"
    && payload.external_roster === "available"
    && Array.isArray(payload.seats);
}

function waitingSeats(payload) {
  if (!rosterReady(payload) || payload.availability !== "available") return null;
  let count = 0;
  for (const row of payload.seats) {
    if (!row || typeof row.queued !== "number" || !Number.isInteger(row.queued) || row.queued < 0) return null;
    if (row.queued > 0) count += 1;
  }
  return count;
}

const failedNotice = new Set();

function rememberStatus(panelId, sentence) {
  if (typeof queueMicrotask !== "function") return;
  queueMicrotask(() => {
    const region = typeof document === "object" && document && typeof document.getElementById === "function"
      ? document.getElementById(`${panelId}-status`) : null;
    if (region) region.textContent = sentence;
  });
}

function notice(sentence, panelId, label) {
  // The runner announces a successful response as loaded, and it will not say loaded again.
  failedNotice.add(panelId);
  rememberStatus(panelId, sentence);
  return `<p class="error">${escapeHtml(sentence)}</p>`
    + `<p><button type="button" class="retry" data-retry-panel="${escapeHtml(panelId)}" aria-label="Retry ${escapeHtml(label)}">Retry</button></p>`;
}

function recoverNotice(panelId, label) {
  if (!failedNotice.delete(panelId)) return;
  rememberStatus(panelId, `${label} loaded.`);
}

function selectable(id) {
  const select = typeof document === "object" && document && document.getElementById ? document.getElementById(id) : null;
  return select && typeof select.add === "function" ? select : null;
}

let applyingFilters = false;

function setChoice(id, value) {
  const select = selectable(id);
  if (!select) return;
  const next = typeof value === "string" ? value : "";
  if (next && ![...select.options].some(option => option.value === next)) {
    const option = document.createElement("option");
    option.value = next;
    option.textContent = next;
    select.append(option);
  }
  applyingFilters = true;
  try { select.value = next; }
  finally { applyingFilters = false; }
}

function fillSeatOptions() {
  const select = selectable("filter-seat");
  if (!select) return;
  const current = pageQuery().get("seat") || "";
  const ids = [];
  const payload = runner.latest.seats;
  if (rosterReady(payload)) {
    for (const row of payload.seats) {
      if (row && typeof row.seat === "string" && row.seat && !ids.includes(row.seat)) ids.push(row.seat);
    }
  }
  if (current && !ids.includes(current)) ids.push(current);
  select.replaceChildren();
  const all = document.createElement("option");
  all.value = "";
  all.textContent = "All seats";
  select.append(all);
  for (const id of ids) {
    const option = document.createElement("option");
    option.value = id;
    option.textContent = id;
    select.append(option);
  }
  applyingFilters = true;
  try { select.value = current; }
  finally { applyingFilters = false; }
}

function syncAppliedFilters(payload) {
  const filters = payload && payload.filters;
  if (!filters || typeof filters !== "object") return;
  setChoice("filter-state", typeof filters.state === "string" ? filters.state : "");
  setChoice("filter-since", typeof filters.since === "string" && filters.since ? filters.since : "7d");
  setChoice("filter-seat", typeof filters.seat === "string" ? filters.seat : "");
}

// Zero queued has no status tone. A missing count stays "?" and is never shown as 0.
function queuedCell(row) {
  const queued = row.queued;
  if (typeof queued !== "number" || !Number.isInteger(queued) || queued < 0) return text("?", "num warn");
  const href = `?seat=${encodeURIComponent(row.seat)}&state=queued#messages`;
  const tone = queued > 0 ? ' class="warn"' : "";
  return td(`<a${tone} href="${escapeHtml(href)}">${queued}</a>`, "num");
}

function tokenCell(value) {
  return typeof value === "string" && value ? text(value) : text("?", "warn");
}

function activityCell(row) {
  if (row.last_activity_at != null && typeof row.last_activity_at !== "string") return text("?", "warn");
  if (row.last_activity_source != null && typeof row.last_activity_source !== "string") return text("?", "warn");
  const when = typeof row.last_activity_at === "string" ? relative(row.last_activity_at) : "";
  const source = typeof row.last_activity_source === "string" ? row.last_activity_source : "";
  return text([when, source].filter(Boolean).join(" · ") || null);
}

function oldestCell(row) {
  if (row.oldest_queued_at != null && typeof row.oldest_queued_at !== "string") return text("?", "warn");
  const when = typeof row.oldest_queued_at === "string" ? relative(row.oldest_queued_at) : "";
  return text(when || null);
}

function stateCell(row) {
  if (typeof row.lease_state !== "string" || !row.lease_state) return text("?", "warn");
  if (row.lease_reason != null && typeof row.lease_reason !== "string") return text("?", "warn");
  const reason = typeof row.lease_reason === "string" && row.lease_reason ? row.lease_reason : "";
  const tone = row.lease_state === "live" ? "ok" : "";
  return text(reason ? `${row.lease_state} · ${reason}` : row.lease_state, tone);
}

const SEAT_HEADERS = ["Seat", "Kind", "State", "Queued", "Oldest queued", "Last activity"];

function renderSeats(payload) {
  if (!rosterReady(payload) || !payload.seats.every(row => row && typeof row.seat === "string" && row.seat)) {
    return notice("Seat list unavailable", "seats", "Seats");
  }
  recoverNotice("seats", "Seats");
  return table(SEAT_HEADERS, payload.seats.map(row => [
    text(row.seat),
    tokenCell(row.kind),
    stateCell(row),
    queuedCell(row),
    oldestCell(row),
    activityCell(row),
  ]), true);
}

function emptyDeliveries(since) {
  const sentence = since === "24h"
    ? "No deliveries for this filter in the last 24 h"
    : since === "all"
      ? "No deliveries for this filter in the available history"
      : "No deliveries for this filter in the last 7 d";
  return `<p>${escapeHtml(sentence)} <button type="button" class="retry" data-clear-filters>Clear filters</button></p>`;
}

function asText(value) {
  if (value === null || value === undefined) return null;
  return typeof value === "string" ? value : undefined;
}

function asNumber(value) {
  if (value === null || value === undefined) return null;
  return typeof value === "number" && Number.isFinite(value) ? value : undefined;
}

function pageHref(offset) {
  const params = deliveryQuery();
  if (offset) params.set("offset", String(offset));
  else params.delete("offset");
  const text = params.toString();
  return `${text ? `?${text}` : "?"}#messages`;
}

let revealPending = typeof location === "object" && location?.hash === "#messages" ? "load" : null;

function prepareMessagesAnchor() {
  const target = document.getElementById("messages");
  const header = document.querySelector("header");
  target.style.scrollMarginTop = `${header.getBoundingClientRect().height}px`;
  return target;
}

function revealMessages() {
  if (!revealPending) return;
  if (revealPending === "load" && document.querySelector("#seats-content p.error")) return;
  revealPending = null;
  if (location.hash !== "#messages") return;
  prepareMessagesAnchor().scrollIntoView();
}

function renderMessages(payload) {
  syncAppliedFilters(payload);
  if (!payload || typeof payload !== "object" || LOG_DOWN.has(payload.availability)) {
    return notice("Message log unavailable", "messages", "Messages");
  }
  if (payload.driver_roster !== "available" || payload.external_roster !== "available") {
    return notice("Seat list unavailable", "messages", "Messages");
  }
  if (payload.availability !== "available") return notice("Message log unavailable", "messages", "Messages");
  const rows = payload.deliveries;
  if (!Array.isArray(rows) || typeof payload.total !== "number" || !Number.isInteger(payload.total) || payload.total < 0) {
    return notice("Message log unavailable", "messages", "Messages");
  }
  if (payload.total === 0) {
    if (rows.length !== 0) return notice("Message log unavailable", "messages", "Messages");
    const since = payload.filters && typeof payload.filters.since === "string" ? payload.filters.since : "7d";
    recoverNotice("messages", "Messages");
    return emptyDeliveries(since);
  }
  const built = [];
  for (const row of rows) {
    if (!row || typeof row !== "object" || Array.isArray(row)) return notice("Message log unavailable", "messages", "Messages");
    const from = asText(row.sender);
    const to = asText(row.recipient);
    const kind = asText(row.kind);
    const state = asText(row.state);
    const attempts = asNumber(row.attempt_count);
    const waited = asNumber(row.waited_s);
    const created = asText(row.created_at);
    let messageId = null;
    if (row.message_id !== null && row.message_id !== undefined) {
      if (typeof row.message_id !== "string") return notice("Message log unavailable", "messages", "Messages");
      messageId = row.message_id;
    }
    if (typeof from !== "string" || typeof to !== "string" || typeof kind !== "string" || typeof state !== "string"
      || [attempts, waited, created].includes(undefined)) {
      return notice("Message log unavailable", "messages", "Messages");
    }
    const when = created ? relative(created) : "";
    built.push([
      text(when || null),
      text(from === null && to === null ? null : `${from ?? "—"} → ${to ?? "—"}`),
      text(kind),
      messageId === null ? text(null) : td(escapeHtml(messageId)),
      text(state),
      text(attempts === null ? null : String(attempts), attempts !== null && attempts < 0 ? "num warn" : "num"),
      waited === null ? text(null, "num") : waited < 0 ? text("?", "num warn") : text(span(waited), "num"),
    ]);
  }
  const offset = Number.isInteger(payload.offset) && payload.offset >= 0 ? payload.offset : 0;
  const end = offset + built.length;
  const prev = offset > 0 && Number.isInteger(payload.limit) && payload.limit > 0
    ? pageHref(Math.max(0, offset - payload.limit)) : "";
  const next = Number.isInteger(payload.next_offset) && payload.next_offset > offset ? pageHref(payload.next_offset) : "";
  const items = [
    built.length && end <= payload.total ? `<span>${offset + 1}–${end} of ${payload.total}</span>` : "",
    prev ? `<a href="${escapeHtml(prev)}">Previous</a>` : "",
    next ? `<a href="${escapeHtml(next)}">Next</a>` : "",
  ].filter(Boolean);
  const pager = items.length ? `<p class="pager">${items.join(" ")}</p>` : "";
  recoverNotice("messages", "Messages");
  if (!built.length) return `<p class="muted">No rows on this page.</p>${pager}`;
  return table(["When", "From to To", "Kind", "Message id", "State", "Attempts", "Waited"], built, true) + pager;
}

function renderChips(latest) {
  const out = [];
  if (latest.workers) out.push(chip("#fleet", (latest.workers.tasks || []).length, "live workers"));
  if (latest.seats) {
    const waiting = waitingSeats(latest.seats);
    out.push(chip("#seats", waiting === null ? "?" : waiting, "seats waiting", waiting === null || waiting > 0 ? "warn" : ""));
  }
  if (latest.comms) {
    const dead = latest.comms.failure_windows?.["24h"]?.dead_letters?.total;
    out.push(chip("#comms", dead ?? "?", "dead letters / 24 h", dead ? "warn" : ""));
  }
  // A panel retry can update chips before the first full refresh finishes.
  // Measure the header after the runner inserts the chips.
  if (revealPending && (latest.seats || revealPending === "navigation") && panelsSettled()) {
    queueMicrotask(revealMessages);
  }
  return out.join("");
}

// Optional non-blocking enrichment so the PR column of active workers shows CI and queue state.
// Clears enrichment and repaints workers whenever the optional fetch fails or returns an expired/unusable snapshot.
let prsInFlight = false;
function repaintWorkers(now = Date.now()) {
  if (!runner.latest.workers) return;
  const box = document.getElementById("workers-content");
  if (box) box.innerHTML = renderWorkers(runner.latest.workers, currentPrs(now));
}

function enrichWorkerPrs() {
  if (prsInFlight) return;
  prsInFlight = true;
  fetchJson("/api/git/pull-requests").then(reading => {
    const now = Date.now();
    latestPrsReading = prSnapshotFresh(reading, now) ? reading : null;
    repaintWorkers(now);
  }).catch(() => {
    latestPrsReading = null;
    repaintWorkers();
  }).finally(() => {
    prsInFlight = false;
  });
}

function expireWorkerPrsIfStale(_panel, _latest, _updateChips, now = Date.now()) {
  if (latestPrsReading && !prSnapshotFresh(latestPrsReading, now)) {
    latestPrsReading = null;
    repaintWorkers(now);
  }
}

const PANELS = [
  {id: "workers", label: "Agent fleet", urls: ["/api/delegate/active"], render: renderWorkers, onData: () => enrichWorkerPrs(), onTick: expireWorkerPrsIfStale, onError: () => { latestPrsReading = null; }},
  {id: "recent", label: "Recently finished", urls: ["/api/delegate/recent"], render: renderRecent},
  {id: "comms", label: "Fleet Comms", urls: ["/api/comms/v1/metrics"], render: renderComms},
  {id: "seats", label: "Seats", urls: [SEATS_URL], render: renderSeats, onData: fillSeatOptions},
  {id: "messages", label: "Messages", urls: [deliveryUrl()], render: renderMessages},
];

const runner = createPanelRunner({panels: PANELS, renderChips});

function panelsSettled() {
  return PANELS.every(panel => panel.ok !== undefined);
}

function prepareSamePageNavigation() {
  // An early click still needs the offset after the initial chips render.
  revealPending = panelsSettled() ? null : "navigation";
  prepareMessagesAnchor();
}

function currentPath() {
  return typeof location === "object" && location && typeof location.pathname === "string" && location.pathname
    ? location.pathname : "/fleet";
}

function assignPage(search) {
  if (typeof location !== "object" || !location || typeof location.assign !== "function") return;
  if (search === location.search) prepareSamePageNavigation();
  location.assign(`${currentPath()}${search}#messages`);
}

function filtersFromForm() {
  const form = document.getElementById("message-filters");
  const params = new URLSearchParams();
  if (!form || typeof FormData !== "function") return params;
  const data = new FormData(form);
  for (const key of ["seat", "state", "since"]) {
    const value = String(data.get(key) || "");
    if (value) params.set(key, value);
  }
  const limit = pageQuery().get("limit");
  if (limit) params.set("limit", limit);
  return params;
}

function bindMessageFilters() {
  if (typeof document !== "object" || !document || typeof document.addEventListener !== "function") return;
  if (document._fleetFiltersBound) return;
  document._fleetFiltersBound = true;
  document.addEventListener("click", event => {
    const target = event.target;
    if (typeof target?.closest !== "function") return;
    if (target.closest("[data-clear-filters]")) {
      event.preventDefault();
      assignPage("");
      return;
    }
    if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    const link = target.closest('a[href$="#messages"]');
    if (link && link.origin === location.origin && link.pathname === location.pathname && link.search === location.search) {
      prepareSamePageNavigation();
    }
  });
  const form = document.getElementById("message-filters");
  if (!form || !form.dataset || typeof form.addEventListener !== "function" || form.dataset.bound) return;
  form.dataset.bound = "1";
  fillSeatOptions();
  const params = pageQuery();
  setChoice("filter-state", params.get("state") || "");
  setChoice("filter-since", params.get("since") || "7d");
  const apply = () => {
    if (applyingFilters) return;
    const text = filtersFromForm().toString();
    assignPage(text ? `?${text}` : "");
  };
  form.addEventListener("change", apply);
  form.addEventListener("submit", event => {
    event.preventDefault();
    apply();
  });
}

bindMessageFilters();
runner.start();
</script>
</body>
</html>
