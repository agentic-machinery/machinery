<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machinery — Overview</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/machinery.css">
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header>
  <div class="header-top">
    <div class="title">
      <h1>Machinery</h1>
      <span class="muted" id="machinery-version" data-version="__MACHINERY_VERSION__" data-repository="__MACHINERY_REPOSITORY__"></span>
      <p class="purpose">What needs attention now: firing alerts, subscription capacity, and merge queue status.</p>
    </div>
    <div class="header-utils">
      <nav class="sites" id="machinery-sites" aria-label="Sites"></nav>
      <button type="button" class="theme-toggle" id="theme-toggle">Theme: Auto</button>
      <div class="refresh">
        <span class="muted" id="last-refresh">Loading…</span>
        <button type="button" class="retry" id="refresh-retry" hidden aria-label="Retry refresh">Retry</button>
      </div>
    </div>
  </div>
  <div class="header-nav">
    <nav class="pages" id="machinery-nav" aria-label="Pages">__MACHINERY_NAV__</nav>
    <div class="chips" id="chips"></div>
  </div>
</header>
<main id="main" tabindex="-1">
  <section class="wide stacked" id="alerts">
    <h2>Alerts firing <span class="age" id="alerts-age">Loading…</span></h2>
    <p id="alerts-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
    <div id="alerts-content">Loading…</div>
  </section>
  <section id="capacity">
    <h2>Capacity summary <span class="age" id="usage-age">Loading…</span> <a class="more" href="/subscriptions">Full subscriptions →</a></h2>
    <p id="usage-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
    <div id="usage-content">Loading…</div>
  </section>
  <section id="queue">
    <h2>Merge queue status <span class="age" id="prs-age">Loading…</span> <a class="more" href="/pull-requests">All pull requests →</a></h2>
    <p id="prs-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
    <div id="prs-content">Loading…</div>
  </section>
</main>
<script src="/machinery.js"></script>
<script>
"use strict";
const {
  escapeHtml, toDate, utc, ageSpan, table, td, text, unknown, chip,
  readingState, windowLeft, paceCell, readingCell, signInCell,
  liveAccounts, summarizeSubscriptions, subscriptionChips,
  ciLabel, reviewLabel, prLink, repoCoverageIncomplete, repoOpenCount, prChips, prSnapshotState, createPanelRunner,
} = Machinery;

// What the API sends for one alert: a plain-English title, what it means, what happens next, and
// at most one fixed-set subject (a pool or tool name). Nothing here reads free text from the rules.
const ALERT_HEAD = ["Alert", "What it means", "What happens next", "Since"];
const INFO_HEAD = ["Information", "What it means", "What happens next", "Since"];

function alertLabel(group) {
  if (!group.title) {
    const raw = group.alertname && group.alertname !== "UnrecognizedAlert" ? `: ${group.alertname}` : "";
    return `Unknown alert (name not listed)${raw}`;
  }
  return group.subject ? `${group.title}: ${group.subject}` : String(group.title);
}

function alertGroups(items) {
  const groups = new Map();
  for (const alert of items) {
    const key = `${alert.alertname}|${alert.subject || ""}|${alert.severity}`;
    const group = groups.get(key) || {...alert, count: 0, oldest: alert.starts_at};
    group.count += 1;
    if (toDate(alert.starts_at) && (!toDate(group.oldest) || toDate(alert.starts_at) < toDate(group.oldest))) group.oldest = alert.starts_at;
    groups.set(key, group);
  }
  return [...groups.values()];
}

function alertRow(group) {
  const label = alertLabel(group) + (group.count > 1 ? ` (${group.count} firing)` : "");
  const severity = group.severity === "critical" ? "bad" : group.severity === "warning" ? "warn" : "";
  const since = toDate(group.oldest) ? `${utc(group.oldest)} (${ageSpan(group.oldest)} ago)` : "—";
  return [
    text(group.severity === "critical" ? `Critical: ${label}` : label, severity),
    text(group.meaning),
    text(group.next_step),
    text(since),
  ];
}

function renderAlerts(alerts) {
  if (alerts.status !== "ok") return unknown(alerts.reason_code);
  const items = Array.isArray(alerts.alerts) ? alerts.alerts : [];
  const problems = alertGroups(items.filter(alert => alert.severity !== "info"));
  const info = alertGroups(items.filter(alert => alert.severity === "info"));
  const beat = alerts.heartbeat ? '<p class="ok">Alertmanager heartbeat present.</p>'
    : '<p class="bad">Alertmanager heartbeat (Watchdog) missing: alerting may be down.</p>';
  const problemBlock = problems.length ? table(ALERT_HEAD, problems.map(alertRow), true)
    : `<p class="ok">${info.length ? "No problems firing." : "Nothing firing."}</p>`;
  const infoBlock = info.length ? `<h3>Recent information</h3>${table(INFO_HEAD, info.map(alertRow), true)}` : "";
  return problemBlock + infoBlock + beat;
}

function signInNeedsAttention(account, logins) {
  if (!logins || logins.state === "pending") return false;
  const row = (Array.isArray(logins.accounts) ? logins.accounts : []).find(item => item.account === account);
  if (!row) return false;
  if (row.logged_in !== true) return true;
  const expires = toDate(row.expires_at);
  return Boolean(expires && (expires.getTime() - Date.now()) / 86400000 < 7);
}

function renderCapacitySummary(subs, logins) {
  const summary = summarizeSubscriptions(subs, logins);
  const staleAfter = subs.stale_after_s;
  const accounts = liveAccounts(subs);
  const stats = [
    `<span><b>${summary.total}</b> active accounts</span>`,
    `<span class="${summary.runsOut ? "bad" : "ok"}"><b>${summary.runsOut}</b> run out before reset</span>`,
    summary.deficitCount ? `<span class="warn"><b>${summary.deficitCount}</b> in deficit</span>` : "",
    summary.unknownCount ? `<span class="warn"><b>${summary.unknownCount}</b> unknown / stale</span>` : "",
    summary.signedOut ? `<span class="bad"><b>${summary.signedOut}</b> signed out</span>` : "",
  ].filter(Boolean);
  const attentionRows = [];
  for (const row of accounts) {
    const state = readingState(row.reading?.status, row.reading?.age_s, staleAfter);
    const fresh = state === "fresh";
    const usage = fresh ? row : {};
    const pace = usage.pace;
    const paceRisk = !fresh || !pace || pace.status !== "ok" || pace.lasts_to_reset !== true || pace.state === "deficit";
    if (!paceRisk && !signInNeedsAttention(row.account, logins)) continue;
    attentionRows.push([
      text(row.account),
      windowLeft(usage.weekly || {}),
      paceCell(pace),
      signInCell(row.account, logins),
      readingCell(row.reading, staleAfter),
    ]);
  }
  const notes = [];
  if (logins === null || logins === undefined) notes.push("Sign-in state unknown: the sign-in reader did not answer.");
  else if (logins.state === "pending") notes.push("Sign-in state is refreshing…");
  const allClear = summary.total > 0 && attentionRows.length === 0
    && summary.unknownCount === 0 && summary.runsOut === 0
    && summary.deficitCount === 0 && summary.signedOut === 0;
  const body = attentionRows.length
    ? table(["Account", "Weekly left", "Pace", "Sign-in", "Reading"], attentionRows)
    : allClear
      ? `<p class="ok">All ${summary.total} active subscriptions are on pace with fresh readings.</p>`
      : summary.total
        ? '<p class="warn">Subscription attention status is incomplete; open Full subscriptions for details.</p>'
        : '<p class="muted">No active subscriptions reported.</p>';
  return `<div class="summary-stats">${stats.join("")}</div>`
    + body + notes.map(note => `<p class="muted">${escapeHtml(note)}</p>`).join("");
}

function renderQueueSummary(prs, prState = null) {
  if (prs.status !== "ok") return unknown(prs.reason);
  const repos = Array.isArray(prs.repositories) ? prs.repositories : [];
  const allUnknown = repos.length > 0 && !repos.some(repo => repo && repo.status === "ok");
  const unavailable = prState === "unavailable" || allUnknown;
  const ageUnknown = !unavailable && prState === "unknown";
  const unbounded = !unavailable && prState === "unbounded";
  const expired = !unavailable && !ageUnknown && !unbounded && (prState === "expired" || prState === true);
  let totalOpen = 0, totalRed = 0, unknownRepos = 0, truncatedRepos = 0;
  const queuedRows = [];
  const repoRows = [];
  for (const repo of repos) {
    if (unavailable || repo.status !== "ok") {
      if (repo.status !== "ok") unknownRepos += 1;
      const reason = repo.status !== "ok"
        ? (repo.reason ? String(repo.reason).replaceAll("_", " ") : "unknown")
        : "snapshot unavailable";
      repoRows.push([text(repo.name), text("?"), text("?"), text("?"), text(reason, "warn")]);
      continue;
    }
    const list = Array.isArray(repo.pull_requests) ? repo.pull_requests : [];
    const truncated = repoCoverageIncomplete(repo);
    if (truncated) truncatedRepos += 1;
    const open = typeof repo.open_total === "number" && Number.isFinite(repo.open_total) && repo.open_total >= 0 ? repo.open_total : null;
    const queued = list.filter(pr => pr.queue);
    const red = list.filter(pr => pr.ci === "failure" || pr.ci === "error").length;
    totalOpen += repoOpenCount(repo);
    totalRed += red;
    repoRows.push([
      text(repo.name),
      text(open ?? "?", open === null ? "num warn" : "num"),
      text(truncated ? `${queued.length} observed` : queued.length, truncated ? "num warn" : queued.length ? "num ok" : "num"),
      text(truncated ? `${red} observed` : red, red ? "num bad" : truncated ? "num warn" : "num"),
      truncated
        ? text(open !== null ? `showing ${list.length} of ${open}` : "open total unknown", "warn")
        : text("ok", "ok"),
    ]);
    for (const pr of queued) {
      const [ci, ciClass] = ciLabel(pr.ci);
      const [review, reviewClass] = reviewLabel(pr.review);
      queuedRows.push([
        td(prLink(repo.name, pr)),
        text(ci, ciClass),
        text(review, reviewClass),
        text(`position ${pr.queue.position ?? "?"}${pr.queue.state ? ` · ${pr.queue.state.replaceAll("_", " ")}` : ""}${expired ? " (cached)" : ""}`, expired ? "warn" : "ok"),
        text(ageSpan(pr.created_at), "num"),
      ]);
    }
  }
  const incomplete = repos.length === 0 || unknownRepos > 0 || truncatedRepos > 0;
  const expiredNote = expired
    ? '<p class="warn">PR snapshot is expired; counts and queue positions below are cached observations.</p>'
    : ageUnknown
      ? '<p class="warn">Snapshot age unknown. Counts and queue positions below are not confirmed as current.</p>'
      : unbounded
        ? '<p class="warn">Freshness unknown. The snapshot age is known, and the freshness bound is not, so counts and queue positions are not confirmed as current.</p>'
        : "";
  const stats = unavailable
    ? [
        "<span><b>?</b> open PRs</span>",
        '<span class="warn"><b>?</b> queued</span>',
        unknownRepos ? `<span class="warn"><b>${unknownRepos}</b> repo unknown</span>` : "",
      ].filter(Boolean)
    : [
        `<span><b>${totalOpen}</b> ${expired ? "open PRs (cached)" : unknownRepos || truncatedRepos ? "open PRs observed" : "open PRs"}</span>`,
        `<span class="${expired ? "warn" : queuedRows.length ? "ok" : incomplete ? "warn" : "muted"}"><b>${queuedRows.length}</b> ${expired ? "queued (cached)" : incomplete ? "queued observed" : "queued"}</span>`,
        totalRed ? `<span class="bad"><b>${totalRed}</b> ${expired ? "CI red (cached)" : incomplete ? "CI red observed" : "CI red"}</span>` : "",
        unknownRepos ? `<span class="warn"><b>${unknownRepos}</b> repo unknown</span>` : "",
        truncatedRepos ? `<span class="warn"><b>${truncatedRepos}</b> repo truncated</span>` : "",
      ].filter(Boolean);
  const queueQualifier = expired
    ? (incomplete ? " (cached — snapshot expired, coverage incomplete)" : " (cached — snapshot expired)")
    : ageUnknown
      ? " (age unknown)"
      : unbounded
        ? " (freshness unknown)"
        : (incomplete ? " (observed — coverage incomplete)" : "");
  const queueBlock = queuedRows.length
    ? `<h3>In merge queue${queueQualifier}</h3>` + table(["PR", "CI", "Review", "Queue", "Age"], queuedRows)
    : !repos.length
      ? '<p class="warn">No repositories reported; merge queue status is unknown.</p>'
      : unavailable
        ? '<p class="warn">All repositories are unavailable; merge queue status is unknown.</p>'
        : expired
          ? '<p class="warn">PR snapshot is expired (cached); current merge queue status is unknown.</p>'
          : ageUnknown
            ? '<p class="warn">Snapshot age unknown; current merge queue status is not confirmed.</p>'
            : unbounded
              ? '<p class="warn">Freshness unknown; current merge queue status is not confirmed.</p>'
              : incomplete
              ? '<p class="warn">Merge queue coverage is incomplete: no queued PRs in the returned rows, but missing or truncated repository lists may hide queued PRs.</p>'
              : '<p class="muted">No PRs currently in the merge queue.</p>';
  return expiredNote
    + `<div class="summary-stats">${stats.join("")}</div>`
    + queueBlock
    + "<h3>By repository</h3>"
    + table(["Repository", "Open", "Queued", "CI red", "Status"], repoRows);
}

function renderChips(latest) {
  const out = [];
  if (latest.alerts?.status === "ok") {
    // Information alerts (for example a pool restored) are good news, not problems.
    const problems = (latest.alerts.alerts || []).filter(alert => alert.severity !== "info");
    const firing = problems.length;
    const critical = problems.some(alert => alert.severity === "critical");
    out.push(chip("#alerts", firing, "alerts firing", critical ? "bad" : firing ? "warn" : ""));
  } else if (latest.alerts) out.push(chip("#alerts", "?", "alerts unknown", "bad"));
  out.push(...subscriptionChips(latest.usage, latest.logins, "/subscriptions"));
  out.push(...prChips(latest.prs, "/pull-requests", latest.prsStatus));
  return out.join("");
}

const PANELS = [
  {id: "alerts", label: "Alerts", urls: ["/api/ops/v1/alerts"], render: renderAlerts},
  {
    id: "usage",
    label: "Capacity summary",
    urls: ["/api/runtime/subscriptions", "/api/runtime/logins"],
    sourceLabels: ["Usage", "Sign-in"],
    render: renderCapacitySummary,
    onData: (data, latest) => { latest.logins = data[1]; },
    onError: latest => { latest.logins = null; },
    retry: (subs, logins) => !logins || logins.state === "pending",
  },
  {
    id: "prs",
    label: "Merge queue",
    urls: ["/api/git/pull-requests"],
    withReadings: true,
    render: (prs, readings, now) => renderQueueSummary(prs, prSnapshotState(readings?.[0], now).status),
    onData: (_data, latest, readings, now) => { latest.prsStatus = prSnapshotState(readings?.[0], now).status; },
    onError: latest => { latest.prsStatus = null; },
    onTick: (panel, latest, updateChips, now) => {
      if (!panel.ok) return;
      const reading = panel.readings?.[0];
      const next = prSnapshotState(reading, now);
      if (next.status === latest.prsStatus) return;
      latest.prsStatus = next.status;
      const box = document.getElementById("prs-content");
      if (box && reading && reading.data) box.innerHTML = renderQueueSummary(reading.data, next.status);
      updateChips();
    },
  },
];

const runner = createPanelRunner({panels: PANELS, renderChips});
runner.start();
</script>
</body>
</html>
