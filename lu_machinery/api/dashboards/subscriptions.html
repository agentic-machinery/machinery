<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscriptions — Machinery</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/machinery.css">
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header>
  <div class="header-top">
    <div class="title">
      <h1>Subscriptions</h1>
      <p class="purpose">Which subscription is near its limit, when it resets, and whether anything is signed out.</p>
    </div>
    <div class="header-utils">
      <nav class="sites" id="machinery-sites" aria-label="Sites"></nav>
      <button type="button" class="theme-toggle" id="theme-toggle">Theme: Auto</button>
      <div class="refresh">
        <span class="muted" id="last-refresh">Loading…</span>
        <button type="button" class="retry" id="refresh-retry" hidden aria-label="Retry refresh">Retry</button>
      </div>
    </div>
  </div>
  <div class="header-nav">
    <nav class="pages" id="machinery-nav" aria-label="Machinery pages"></nav>
    <div class="chips" id="chips"></div>
  </div>
</header>
<main id="main" tabindex="-1">
  <section class="wide" id="subs">
    <h2>Subscriptions: usage, pace, resets and sign-in <span class="age" id="usage-age">Loading…</span></h2>
    <p id="usage-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
    <div id="usage-content">Loading…</div>
    <p class="muted" id="subq-credit-balance"><strong>SubQ credit balance.</strong> Not available from the provider.</p>
  </section>
</main>
<script src="/machinery.js"></script>
<script>
"use strict";
const {
  escapeHtml, toDate, utc, relative, validPct, pct, labelled, table, td, text, unknown,
  readingState, freshnessCell, windowLeft, paceCell, readingCell, signInCell,
  subscriptionChips, createPanelRunner,
} = Machinery;

function resetText(window) {
  if (!window || window.status !== "ok") return null;
  if (!toDate(window.resets_at)) return "reset not reported";
  if (window.reset_passed || toDate(window.resets_at) <= Date.now()) return `${utc(window.resets_at)} (passed; awaiting a new reading)`;
  return `${utc(window.resets_at)} (${relative(window.resets_at)})`;
}

function weeklyResetCell(window) {
  if (!window || window.status !== "ok") return text("unknown", "muted");
  if (!toDate(window.resets_at)) return text("not reported", "muted");
  if (window.reset_passed || toDate(window.resets_at) <= Date.now()) return text(`passed; awaiting a new reading (${utc(window.resets_at)})`, "warn");
  return td(`<strong>${escapeHtml(relative(window.resets_at))}</strong> <br><span class="muted">${escapeHtml(utc(window.resets_at))}</span>`);
}

function sessionCell(window) {
  if (!window || window.status === "none") return text("none", "muted");
  if (window.status !== "ok" && window.reason_code === "not_reported") return text("not reported", "muted");
  if (window.status !== "ok" || !validPct(window.left_pct)) return text("unknown", "muted");
  return text(`${pct(window.left_pct)} left · ${resetText(window)}`);
}

function extraCell(row) {
  if (!row.reading?.read_at) return text("unknown", "muted");
  const windows = (Array.isArray(row.extra_windows) ? row.extra_windows : []).map(window =>
    `${window.label || "window"} ${window.status === "ok" && validPct(window.left_pct) ? `${pct(window.left_pct)} left` : "unknown"}`);
  const breakdown = (Array.isArray(row.breakdown) ? row.breakdown : []).map(item => `${item.label} ${item.value}`);
  return text([...windows, ...breakdown].join("; ") || "none", windows.length || breakdown.length ? "" : "muted");
}

function creditsCell(credits) {
  if (credits?.status === "ok" && typeof credits.balance === "number") {
    const balance = credits.balance.toLocaleString("en-US", {maximumFractionDigits: 1});
    return text(credits.renews_on ? `${balance} (renew ${credits.renews_on} with the plan)` : balance);
  }
  return credits?.status === "none" ? text("none", "muted") : text("unknown", "muted");
}

function planCell(plan) {
  const name = "plan";
  if (!plan || plan.status !== "ok") return text(`${name} · renewal unknown`, "muted");
  if (plan.cancelled) {
    return text(`${name} · ${plan.ends_on ? `${plan.ended ? "ENDED" : "cancelled, ends"} ${plan.ends_on} (${plan.days_to_end} d)`
      : "cancelled, end date not configured"}`, "warn");
  }
  if (!plan.next_renewal_on) return text(`${name} · renewal not configured`, "muted");
  return text(`${name} · renews ${plan.next_renewal_on} (in ${plan.days_to_renewal} d)`, plan.days_to_renewal <= 3 ? "warn" : "muted");
}

function bankedCell(banked) {
  if (!banked || banked.status !== "ok" || typeof banked.count !== "number") return text("not reported", "muted");
  const items = (Array.isArray(banked.items) ? banked.items : []).filter(item => !item.expired)
    .map(item => `${item.count}× ${item.kind || "reset"}${item.expires_on ? `, expires ${String(item.expires_on).slice(0, 10)}` : ""}`);
  return text(`${banked.count}${items.length ? ` (${items.join("; ")})` : ""}`, banked.count ? "ok" : "");
}

const SUBSCRIPTION_HEADERS = ["Account", "Weekly resets", "Weekly left", "Pace", "5-hour", "Other windows",
  "Credits", "Banked resets", "Plan · renews or ends", "Sign-in", "Reading"];

function subscriptionRows(subs, logins) {
  const staleAfter = subs.stale_after_s;
  const hidden = [];
  const groups = (Array.isArray(subs.providers) ? subs.providers : []).map(provider => {
    const accounts = (Array.isArray(provider.accounts) ? provider.accounts : []).filter(row => {
      if (row.plan?.ended) { hidden.push(`${row.account} (ended ${row.plan.ends_on})`); return false; }
      return true;
    });
    if (!accounts.length) return "";
    return `<tr class="group"><th colspan="${SUBSCRIPTION_HEADERS.length}">${escapeHtml(provider.label || provider.provider)}</th></tr>`
      + accounts.map(row => {
        const usage = readingState(row.reading?.status, row.reading?.age_s, staleAfter) === "fresh" ? row : {};
        const weekly = usage.weekly || {};
        return `<tr>${labelled([
          text(row.account),
          weeklyResetCell(weekly),
          windowLeft(weekly),
          paceCell(usage.pace),
          sessionCell(usage.session),
          extraCell(usage),
          creditsCell(usage.credits),
          bankedCell(row.banked_resets?.source === "provider" ? usage.banked_resets : row.banked_resets),
          planCell(row.plan),
          signInCell(row.account, logins),
          readingCell(row.reading, staleAfter),
        ], SUBSCRIPTION_HEADERS)}</tr>`;
      }).join("");
  }).join("");
  return {groups, hidden};
}

const PROBE_REASONS = {
  ok: null, fresh: null, NEED_KEY: "needs an API key", NEED_PROBE: "not probed yet",
  unknown: "probe result unknown", unavailable: "probe unavailable",
  unsupported: "balance probe is not supported", error: "probe failed", stale: "probe is stale",
};

function probeReason(state) {
  if (!state) return null;
  if (Object.hasOwn(PROBE_REASONS, state)) return PROBE_REASONS[state];
  return String(state).replaceAll("_", " ").toLowerCase();
}

function apiRows(budget) {
  const accounts = budget.api_accounts || {};
  return Object.entries(accounts).map(([name, row]) => {
    const state = readingState(row.freshness, row.age_s, budget.diagnostics?.stale_threshold_s);
    const balance = typeof row.total_balance === "number" ? `${row.total_balance.toFixed(2)} ${row.currency || ""}`.trim() + " balance"
      : typeof row.limit_remaining_usd === "number" ? `$${row.limit_remaining_usd.toFixed(2)} left` : null;
    const spent = typeof row.usage_weekly_usd === "number" ? `$${row.usage_weekly_usd.toFixed(2)} this week` : null;
    const figures = [balance, spent].filter(Boolean);
    const probe = probeReason(row.balance_probe_state);
    let values = "unknown";
    let valueClass = "muted";
    if (state === "fresh") {
      values = [...figures, probe].filter(Boolean).join("; ") || null;
      valueClass = "";
    } else if (state === "last_good") {
      const marked = figures.length ? `${figures.join("; ")} (last good)` : null;
      values = [marked, probe].filter(Boolean).join("; ") || "unknown";
      valueClass = "warn";
    }
    return [text(name), text(values, valueClass),
      freshnessCell(state, row.age_s),
      text(row.health?.healthy === false ? "unhealthy" : null, "bad")];
  });
}

function cursorUsage(budget) {
  const cursor = budget?.agents?.cursor;
  const freshness = readingState(cursor?.freshness, cursor?.age_s, budget?.diagnostics?.stale_threshold_s);
  const needsLogin = cursor?.probe_state === "NEED_LOGIN" || cursor?.login_state === "NEED_LOGIN";
  const reason = !budget ? "routing budget did not answer"
    : needsLogin ? "sign-in required"
    : cursor?.codexbar?.reason_code === "provider_error" ? "usage probe failed"
    : freshness === "stale" || freshness === "last_good" ? "last reading is stale"
    : "no current usage reading";
  const rows = [["auto", "Cursor Auto"], ["api", "Cursor API"]].map(([key, label]) => {
    const window = cursor?.provider_windows?.[key];
    const remaining = validPct(window?.remaining_pct) ? window.remaining_pct
      : validPct(window?.used_pct) ? 100 - window.used_pct : null;
    const reading = freshness === "fresh" && !needsLogin && remaining !== null
      ? text(`${pct(remaining)} left`) : text(`Unavailable (${reason})`, "muted");
    return [text(label), reading];
  });
  return table(["Cursor window", "Remaining"], rows, true);
}

function renderUsage(subs, budget, logins) {
  const api = budget ? table(["API account", "Balance / spend", "Reading", ""], apiRows(budget), true)
    : unknown("API account balances: the routing budget did not answer");
  if (!subs) return unknown("subscription account snapshot unavailable") + cursorUsage(budget) + api;
  const {groups, hidden} = subscriptionRows(subs, logins);
  const facts = subs.sources?.plan_facts;
  const notes = [];
  if (facts?.reason_code) {
    notes.push(`Plan facts: ${facts.reason_code === "not_configured" ? "not configured" : facts.reason_code}; renewal, plan and banked resets show unknown.`);
  }
  const cache = subs.sources?.usage_cache;
  if (cache && cache.status !== "ok") notes.push(`Usage cache: ${cache.status}.`);
  if (hidden.length) notes.push(`Hidden, subscription ended: ${hidden.join(", ")}.`);
  if (logins === null || logins === undefined) notes.push("Sign-in state unknown: the sign-in reader did not answer.");
  notes.push("Headroom and deficit are percentage points against an even pace to the weekly reset. "
    + "The Codex API credits belong to Codex a and renew with its monthly turnover.");
  notes.push("Sign-in is read for Claude a, Claude b, Codex a and Codex b only. Any other account has no side-effect-free sign-in reader.");
  const head = `<thead><tr>${SUBSCRIPTION_HEADERS.map(h => `<th>${escapeHtml(h)}</th>`).join("")}</tr></thead>`;
  const subsTable = groups ? `<table class="subs">${head}<tbody>${groups}</tbody></table>`
    : '<p class="muted">None.</p>';
  const models = subs.catalog_models;
  const catalog = Array.isArray(models) ? escapeHtml(models.join(", ") || "No current models.") : "Catalog unavailable.";
  return subsTable + cursorUsage(budget) + notes.map(note => `<p class="muted">${escapeHtml(note)}</p>`).join("") + api
    + `<p class="muted"><strong>Current catalog models.</strong> ${catalog}</p>`;
}

const PANELS = [
  {
    id: "usage",
    label: "Subscriptions",
    urls: ["/api/state/routing-budget?include_subscriptions=true", "/api/runtime/logins"],
    sourceLabels: ["Routing budget", "Sign-in"],
    render: (budget, logins) => renderUsage(budget?.subscriptions, budget, logins),
    onData: (data, latest) => { latest.logins = data[1]; },
    onError: latest => { latest.logins = null; },
    retry: (budget, logins) => !budget.subscriptions || !logins || logins.state === "pending",
  },
];

const runner = createPanelRunner({
  panels: PANELS,
  renderChips: latest => subscriptionChips(latest.usage?.subscriptions, latest.logins, "#subs").join(""),
});
runner.start();
</script>
</body>
</html>
