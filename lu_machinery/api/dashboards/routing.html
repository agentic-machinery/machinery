<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Routing — Machinery</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/machinery.css">
<style>
  /* The flow picture: two lanes (writes, reviews) through the same four columns. */
  .flow { display: grid; grid-template-columns: 9rem repeat(4, minmax(0, 1fr)); gap: 8px 22px; align-items: stretch; margin: 6px 0 4px; }
  .flow .lane { font-weight: 600; font-size: 13px; align-self: center; }
  .flow .lane small { display: block; font-weight: normal; color: var(--muted); }
  .stage { position: relative; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--bg); min-width: 0; }
  .stage + .stage::before { content: "→"; position: absolute; left: -18px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; }
  .stage.unchecked { border-style: dashed; background: transparent; }
  .stage .who { font-size: 12px; color: var(--muted); }
  .stage .count { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stage .split { font-size: 12px; overflow-wrap: anywhere; }
  .flow-head { font-size: 12px; color: var(--muted); font-weight: 600; }
  .callout { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 8px 0; }
  .callout.bad { border-color: var(--bad); font-weight: normal; }
  .callout.warn { border-color: var(--warn); }
  .seat { display: block; }
  td .why { display: block; font-size: 12px; color: var(--muted); white-space: normal; }
  @media (max-width: 900px) {
    .flow { grid-template-columns: 1fr; gap: 6px; }
    .flow .flow-head { display: none; }
    .flow .lane { margin-top: 8px; }
    .stage + .stage::before { content: "↓"; left: 50%; top: -14px; transform: translateX(-50%); font-size: 13px; }
    .stage + .stage { margin-top: 10px; }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header>
  <div class="header-top">
    <div class="title">
      <h1>Routing</h1>
      <p class="purpose">Who picks each worker's model and account, whether admission lets new work start, and where reviews are seated.</p>
    </div>
    <div class="header-utils">
      <nav class="sites" id="machinery-sites" aria-label="Sites"></nav>
      <button type="button" class="theme-toggle" id="theme-toggle">Theme: Auto</button>
      <div class="refresh">
        <span class="muted" id="last-refresh">Loading…</span>
        <button type="button" class="retry" id="refresh-retry" hidden aria-label="Retry refresh">Retry</button>
      </div>
    </div>
  </div>
  <div class="header-nav">
    <nav class="pages" id="machinery-nav" aria-label="Pages">__MACHINERY_NAV__</nav>
    <div class="chips" id="chips"></div>
  </div>
</header>
<main id="main" tabindex="-1">
  <section class="wide" id="flow">
    <h2>How work is routed, last 24 hours <span class="age" id="flow-age">Loading…</span></h2>
    <p id="flow-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
    <div id="flow-content">Loading…</div>
  </section>
  <section class="wide stacked" id="pools">
    <h2>Pools now <span class="age" id="pools-age">Loading…</span></h2>
    <div id="pools-content">Loading…</div>
  </section>
  <section class="wide stacked" id="decisions">
    <h2>Recent decisions <span class="age" id="decisions-age">Loading…</span></h2>
    <form class="filters" id="decision-filters" onsubmit="return false">
      <label>Work
        <select id="filter-kind" autocomplete="off">
          <option value="">All work</option>
          <option value="write">Writes</option>
          <option value="review">Reviews</option>
          <option value="read_only">Other read-only</option>
        </select>
      </label>
      <label>Pool
        <select id="filter-pool" autocomplete="off"><option value="">All pools</option></select>
      </label>
      <label>Show
        <select id="filter-outcome" autocomplete="off">
          <option value="">Every decision</option>
          <option value="held">Deferred, refused or without admission proof</option>
          <option value="substituted">Substitutions</option>
          <option value="live">Running now</option>
        </select>
      </label>
    </form>
    <div id="decisions-content">Loading…</div>
  </section>
</main>
<script src="/machinery.js"></script>
<script>
"use strict";
const {escapeHtml, utc, relative, span, pct, bar, table, td, text, chip, panelAgeSeconds, createPanelRunner} = Machinery;

const PAGE_ROWS = 25;
const STALE_AFTER_S = 90;
// data/reading: the last successful response. failedAt: the last failed refresh, until one succeeds.
const state = {data: null, reading: null, failedAt: null, shown: PAGE_ROWS, painted: ""};

const ACCOUNT_BY = {helper: "account helper", saved_default: "saved default account", builtin_default: "built-in default", single_account: "only account", not_recorded: "not recorded"};
const MODEL_BY = {brief: "brief", resolver: "resolver", not_recorded: "not recorded"};
const ADMISSION_CLASS = {admitted: "ok", forced: "warn", deferred: "bad", refused: "bad", not_checked: "muted", unknown: "warn", pending: "muted"};
const ADMISSION_WORD = {admitted: "Admitted", forced: "Started by override", deferred: "Deferred", refused: "Refused", not_checked: "Not checked", unknown: "Unknown", pending: "Evaluating"};

// A cell whose content is one block, so the stacked (card) layout keeps its label beside it.
const cell = (html, cls = "") => td(`<div>${html}</div>`, cls);

function unknownSince(time, why) {
  const when = time ? `unknown since ${utc(time)}` : "unknown (no reading yet)";
  return why ? `${when} · ${String(why).replaceAll("_", " ")}` : when;
}

// Seconds since a part of the response was computed: its age in the payload plus the time since it arrived.
function ageNow(partAge) {
  const received = state.reading?.receivedAt;
  if (typeof partAge !== "number" || typeof received !== "number") return null;
  return partAge + Math.max(0, (Date.now() - received) / 1000);
}

function timeOf(partAge) {
  const age = ageNow(partAge);
  return age === null ? null : new Date(Date.now() - age * 1000).toISOString();
}

// fresh, stale (older than the bound), partial (some records unreadable), failed (the last refresh failed) or missing.
function recentState(data) {
  const recent = data?.recent;
  if (!recent || !["ok", "partial"].includes(recent.status)) return "missing";
  if (state.failedAt) return "failed";
  const age = ageNow(recent.age_s);
  if (age === null || age > STALE_AFTER_S) return "stale";
  return recent.status === "partial" ? "partial" : "fresh";
}

// ok, pending, stale, failed or unknown, for the admission, resolver and live-worker evaluation.
function nowState(data) {
  const now = data?.now;
  if (!now || now.state === "unknown") return "unknown";
  if (state.failedAt) return "failed";
  if (now.state === "pending") return "pending";
  const age = ageNow(now.age_s);
  return age === null || age > STALE_AFTER_S ? "stale" : "ok";
}

function nowUnknownText(data) {
  const now = data?.now;
  const st = nowState(data);
  if (st === "pending") return "being evaluated, shown in a few seconds";
  if (st === "unknown") return unknownSince(now?.budget?.generated_at, now?.admission?.reason || now?.budget?.reason);
  return unknownSince(timeOf(now?.age_s), st === "failed" ? "the last refresh failed" : "evaluation is out of date");
}

function topCounts(counts, limit = 3) {
  const entries = Object.entries(counts || {}).sort((a, b) => b[1] - a[1]);
  const shown = entries.slice(0, limit).map(([name, n]) => `${escapeHtml(name)} ${n}`);
  if (entries.length > limit) shown.push(`+${entries.length - limit} more`);
  return shown.join(" · ") || "none";
}

function stage(who, count, split, cls = "") {
  return `<div class="stage ${cls}"><div class="who">${who}</div>`
    + `<div class="count">${count}</div><div class="split">${split}</div></div>`;
}

function poolLabel(data, meter) {
  return (data?.now?.pools || []).find(pool => pool.pool === meter)?.label || meter;
}

// A reading is current only until its own freshness deadline, also between fetches, and never after a failed refresh.
function allowanceCurrent(allowance) {
  return !state.failedAt && allowance?.state === "fresh" && typeof allowance.left_pct === "number"
    && typeof allowance.fresh_until === "string" && Date.now() < Date.parse(allowance.fresh_until);
}

// Pools whose reading has expired since it arrived: part of the repaint key.
function expiredAllowances(data) {
  return Object.entries(data?.now?.allowance || {})
    .filter(([, allowance]) => allowance?.state === "fresh" && !allowanceCurrent(allowance)).map(([meter]) => meter).join(",");
}

// Only a current reading may claim that a pool has no allowance left.
function emptyPool(data, meter) {
  const allowance = data?.now?.allowance?.[meter];
  return allowanceCurrent(allowance) && allowance.left_pct <= 0;
}

function resolverCallouts(data) {
  const now = data?.now || {};
  const resolver = now.resolver;
  if (nowState(data) !== "ok" || resolver?.state !== "ok") {
    const why = nowState(data) === "ok" ? unknownSince(timeOf(now.age_s), resolver?.reason) : nowUnknownText(data);
    return `<h3>Who the resolver would seat right now</h3><p class="callout warn">Reviewer resolver: ${escapeHtml(why)}.</p>`;
  }
  // Author families that get the same seats share one line.
  const groups = new Map();
  for (const choice of resolver.first_choice || []) {
    const seats = choice.seats || [];
    const key = seats.map(seat => `${seat.model}|${seat.pool}`).join("+") || `none|${choice.reason}`;
    if (!groups.has(key)) groups.set(key, {choice, authors: []});
    groups.get(key).authors.push(choice.author);
  }
  const lines = [...groups.values()].map(({choice, authors}) => {
    const who = authors.length > 1 ? `${authors.slice(0, -1).join(", ")} and ${authors.at(-1)}` : authors[0];
    const head = `${escapeHtml(who)}-authored ${escapeHtml(now.profile)} reviews (${escapeHtml(now.risk)} risk)`;
    const seats = choice.seats || [];
    if (!seats.length) return `<li class="bad">${head}: no reviewer can be seated (${escapeHtml(choice.reason || "no eligible reviewer")}).</li>`;
    const named = seats.map(seat => `<b>${escapeHtml(seat.model)}</b>${seat.pool_label ? ` on ${escapeHtml(seat.pool_label)}` : ""}`).join(" and ");
    const empty = seats.filter(seat => emptyPool(data, seat.pool));
    const warn = empty.length ? ` <span class="bad">${empty.map(seat => escapeHtml(seat.pool_label)).join(", ")} has 0% allowance left, so the review has to run on another account.</span>` : "";
    return `<li>${head}: the resolver seats ${named}${seats.length > 1 ? " (two-seat review)" : ""}.${warn}</li>`;
  });
  return `<h3>Who the resolver would seat right now <span class="age">evaluated ${escapeHtml(span(ageNow(now.age_s)))} ago</span></h3><ul>${lines.join("")}</ul>`;
}

function admissionSplit(adm) {
  const parts = [`<span class="${adm.deferred ? "bad" : "muted"}">${adm.deferred ?? 0} deferred</span>`,
    `<span class="${adm.refused ? "bad" : "muted"}">${adm.refused ?? 0} refused</span>`];
  if (adm.forced) parts.push(`<span class="warn">${adm.forced} started by override</span>`);
  if (adm.unknown) parts.push(`<span class="warn">${adm.unknown} without an admission record</span>`);
  if (adm.not_checked) parts.push(`<span class="muted">${adm.not_checked} read-only, not checked</span>`);
  return parts.join(" · ");
}

function laneRow(name, chooser, counts) {
  const adm = counts.admission || {};
  const chooserSplit = Object.entries(counts.by_account_chooser || {})
    .map(([key, n]) => `${escapeHtml(ACCOUNT_BY[key] || key.replaceAll("_", " "))} ${n}`).join(" · ") || "no subscription account";
  const checked = (adm.admitted || 0) + (adm.deferred || 0) + (adm.refused || 0) + (adm.forced || 0) + (adm.unknown || 0);
  return [
    `<div class="lane">${name}<small>${counts.total ?? 0} dispatches</small></div>`,
    stage(chooser, counts.total ?? 0, topCounts(counts.by_model)),
    stage(`Account: ${chooserSplit}`, Object.values(counts.by_pool || {}).reduce((n, v) => n + v, 0), topCounts(counts.by_pool, 4)),
    stage("Admission: host and pool limits", `${adm.admitted ?? 0} <small class="ok">admitted</small>`, admissionSplit(adm),
      checked ? "" : "unchecked"),
    stage("Ran", `${counts.live ?? 0} <small>running or starting</small>`,
      counts.substitutions ? `<a class="warn" href="#decisions" data-outcome="substituted">${counts.substitutions} ran another model</a>` : "no substitutions recorded"),
  ].join("");
}

function recentNote(data) {
  const recent = data.recent || {};
  const st = recentState(data);
  if (st === "stale" || st === "failed") {
    const why = st === "failed" ? "the last refresh failed" : "the reading is out of date";
    return `<p class="callout warn">Recent decisions are ${escapeHtml(unknownSince(timeOf(recent.age_s), why))}; what follows is that last reading.</p>`;
  }
  if (st === "partial") {
    return `<p class="callout warn">${recent.unreadable} task records in the window could not be read, so these counts and rows may be incomplete.</p>`;
  }
  return "";
}

function renderFlow(data) {
  const recent = data.recent || {};
  if (recentState(data) === "missing") {
    return `<p class="warn">Recent decisions are ${escapeHtml(unknownSince(recent.as_of, recent.reason))}; no counts are shown.</p>`
      + resolverCallouts(data);
  }
  const counts = recent.counts || {};
  const flow = '<div class="flow" role="group" aria-label="Routing flow for writes and for reviews: who picks the model, which account pays, admission, what ran">'
    + '<div class="flow-head"></div><div class="flow-head">1 · Who picks the model</div><div class="flow-head">2 · Which account pays</div>'
    + '<div class="flow-head">3 · Admission (writes only)</div><div class="flow-head">4 · What ran</div>'
    + laneRow("Writes and other work", "The brief (CTO or lead) names the model", counts.brief || {})
    + laneRow("Reviews", "The dispatch names a reviewer from another family (the resolver's pick is not recorded on the task)", counts.resolver || {})
    + "</div>";
  const windowNote = `<p class="muted">${recent.total ?? 0} decisions started since ${escapeHtml(utc(Date.parse(recent.as_of) - (recent.window_s || 86400) * 1000))}.</p>`;
  return recentNote(data) + flow + windowNote + resolverCallouts(data);
}

// Every live worker on the pool, any mode, from the task-record scan.
function liveCell(meter, data) {
  const st = recentState(data);
  const count = data.recent?.live_by_pool?.[meter];
  if (st === "missing" || st === "stale" || st === "failed" || typeof count !== "number") {
    const why = st === "failed" ? "the last refresh failed" : st === "missing" ? data.recent?.reason : "the reading is out of date";
    return text(unknownSince(st === "missing" ? data.recent?.as_of : timeOf(data.recent?.age_s), why), "warn");
  }
  return st === "partial" ? text(`${count}, may be low`, "warn") : text(String(count), count ? "" : "muted");
}

// Admission known to be unknown (a task-store fault) wins over a resolver evaluation still pending.
function admissionUnknown(data) {
  const admission = data.now?.admission;
  return admission?.state === "unknown" && nowState(data) === "pending" ? unknownSince(data.recent?.as_of, admission.reason) : null;
}

// Admission's own write-slot count for the pool (a slot held by a starting dispatch counts, as for dispatch).
function slotsCell(meter, data) {
  if (admissionUnknown(data)) return text(admissionUnknown(data), "warn");
  const admission = data.now?.admission;
  const verdict = admission?.pools?.[meter];
  if (nowState(data) !== "ok" || admission?.state !== "ok" || typeof verdict?.live_writes !== "number") {
    return text(nowState(data) === "pending" ? "being evaluated" : nowState(data) === "ok" ? unknownSince(timeOf(data.now?.age_s), admission?.reason) : nowUnknownText(data), "warn");
  }
  const cap = typeof verdict.cap === "number" ? ` of ${verdict.cap}` : "";
  return admission.incomplete
    ? text(`${verdict.live_writes}${cap}, may be low`, "warn")
    : text(`${verdict.live_writes}${cap}`, verdict.live_writes ? "" : "muted");
}

// A reading shown after a failed refresh is no longer current: unknown since that reading.
function allowanceCell(allowance) {
  if (state.failedAt) return text(unknownSince(allowance?.read_at, "the last refresh failed"), "warn");
  if (!allowanceCurrent(allowance)) {
    return text(unknownSince(allowance?.read_at, allowance?.state === "fresh" ? "reading expired" : allowance?.reason), "warn");
  }
  return cell(`${bar(allowance.left_pct)}${escapeHtml(pct(allowance.left_pct))}`, allowance.left_pct <= 0 ? "bad" : "");
}

function resetCell(allowance) {
  if (!allowanceCurrent(allowance) || !allowance.resets_at) return text("—", "muted");
  return cell(`${escapeHtml(utc(allowance.resets_at))}<span class="why">${escapeHtml(relative(allowance.resets_at))}</span>`);
}

function admissionCell(meter, data) {
  if (admissionUnknown(data)) return text(admissionUnknown(data), "warn");
  const now = data.now || {};
  const verdict = now.admission?.pools?.[meter];
  if (nowState(data) !== "ok" || now.admission?.state !== "ok" || !verdict) {
    return text(nowState(data) === "pending" ? "being evaluated" : nowState(data) === "ok" ? unknownSince(timeOf(now.age_s), now.admission?.reason) : nowUnknownText(data), "warn");
  }
  // Admitted without a fresh allowance reading is admission failing open with a lower cap: amber, not green.
  const blind = verdict.state === "admitted" && verdict.note;
  const word = blind ? "Admitted, allowance not seen" : ADMISSION_WORD[verdict.state] || verdict.state;
  const why = [verdict.reason, verdict.note].filter(Boolean).map(escapeHtml).join(" · ");
  return cell(`<span class="${blind ? "warn" : ADMISSION_CLASS[verdict.state] || ""}">${escapeHtml(word)}</span>${why ? `<span class="why">${why}</span>` : ""}`);
}

function seatsCell(meter, data) {
  const now = data.now || {};
  const seats = now.resolver?.state === "ok" ? now.resolver.by_pool?.[meter] : null;
  if (nowState(data) !== "ok" || !Array.isArray(seats)) {
    return text(nowState(data) === "pending" ? "being evaluated" : nowState(data) === "ok" ? unknownSince(timeOf(now.age_s), now.resolver?.reason) : nowUnknownText(data), "warn");
  }
  if (!seats.length) return text("no automatic review seat", "muted");
  return cell(seats.map(seat => seat.state === "eligible"
    ? `<span class="seat"><span class="ok">Eligible</span> · ${escapeHtml(seat.model)}${seat.picked_for?.length
      ? `<span class="why">first choice for ${escapeHtml(seat.picked_for.join(", "))}-authored reviews</span>`
      : '<span class="why">eligible, not the first choice now</span>'}</span>`
    : `<span class="seat"><span class="warn">Excluded</span> · ${escapeHtml(seat.model)}<span class="why">${escapeHtml(seat.reason || "")}</span></span>`).join(""));
}

function hostLine(data) {
  if (admissionUnknown(data)) return `<p class="callout warn">Host admission checks: ${escapeHtml(admissionUnknown(data))}.</p>`;
  const host = data.now?.admission?.host;
  if (nowState(data) !== "ok" || data.now?.admission?.state !== "ok" || !host) {
    return `<p class="callout warn">Host admission checks: ${escapeHtml(nowState(data) === "ok" ? unknownSince(timeOf(data.now?.age_s), data.now?.admission?.reason) : nowUnknownText(data))}.</p>`;
  }
  const unmeasured = (host.unmeasured?.length ? ` Not measured: ${escapeHtml(host.unmeasured.join(", "))}.` : "")
    + (data.now.admission.incomplete ? ` ${escapeHtml(data.now.admission.incomplete)}.` : "");
  if (host.admitting === null) {
    return `<p class="callout warn">Host: unknown whether admission is letting new writes start: ${escapeHtml(data.now.admission.incomplete || "the reading is incomplete")}.</p>`;
  }
  if (!host.admitting) {
    return `<p class="callout bad">Host: admission is deferring <b>every</b> new write: ${escapeHtml(host.failing.join("; "))}.${unmeasured}</p>`;
  }
  return `<p class="callout${unmeasured ? " warn" : ""}">Host: admission is letting new writes start (${host.live_writes} of ${host.write_cap} write slots in use; `
    + `memory, CPU load, worker memory pool, test-slot queue and disk checks ${host.unmeasured?.length ? "pass where measured" : "pass"}).${unmeasured}</p>`;
}

function renderPools(data) {
  const now = data.now || {};
  const budget = now.budget || {};
  const budgetLine = budget.state === "ok"
    ? `<p class="muted">Admission and resolver verdicts describe a new <b>write</b> dispatch and a ${escapeHtml(now.profile)} review at ${escapeHtml(now.risk)} risk: a snapshot${now.evaluated_at ? ` evaluated at ${escapeHtml(utc(now.evaluated_at))}` : ""} against the routing budget admission reads (from ${escapeHtml(utc(now.budget_generated_at || budget.generated_at))}). Every dispatch is evaluated again when it starts.</p>`
    : `<p class="warn">Routing budget ${escapeHtml(unknownSince(null, budget.reason))}: admission and resolver verdicts are unknown.</p>`;
  const rows = (now.pools || []).map(({pool, label}) => [
    td(`<b>${escapeHtml(label)}</b>`),
    liveCell(pool, data),
    slotsCell(pool, data),
    allowanceCell(now.allowance?.[pool]),
    resetCell(now.allowance?.[pool]),
    admissionCell(pool, data),
    seatsCell(pool, data),
  ]);
  const rs = recentState(data);
  const liveUnpooled = ["fresh", "partial"].includes(rs) && data.recent?.live_unpooled
    ? `<p class="${rs === "partial" ? "warn" : "muted"}">${Number(data.recent.live_unpooled)} more live workers have no recorded pool${rs === "partial" ? " (may be low)" : ""}.</p>` : "";
  const unpooled = liveUnpooled + (nowState(data) === "ok" && now.resolver?.unpooled?.length
    ? `<p class="muted">Seats without a pool (the account they would run on is not resolved): ${now.resolver.unpooled.map(seat => `${escapeHtml(seat.model)} — ${escapeHtml(seat.reason || seat.state)}`).join("; ")}.</p>` : "");
  return hostLine(data) + budgetLine
    + table(["Pool", "Live workers", "Write slots in use", "Allowance left", "Resets", "New write work", "Review seats"], rows, true) + unpooled;
}

function asked(row) {
  if (row.kind === "review") {
    const parts = [row.profile ? `${row.profile} review` : "review, profile not recorded", row.risk ? `${row.risk} risk` : null, row.author_model ? `author ${row.author_model}` : null];
    return parts.filter(Boolean).join(" · ");
  }
  return `${row.kind === "write" ? "write" : "read-only"} · ${row.role ? row.role.replaceAll("_", " ") : "role not recorded"}`;
}

function decisionRow(row) {
  const status = row.live ? "running" : row.status;
  const admission = row.admission || {};
  const statusClass = row.live ? "ok" : ["failed", "crashed", "timeout", "no_deliverable", "rate_limited"].includes(row.status) ? "bad" : "";
  const chosen = `${escapeHtml(row.model || "unknown model")}${row.effort ? ` <span class="muted">(${escapeHtml(row.effort)})</span>` : ""}`
    + `<span class="why">${row.pool_label ? `on ${escapeHtml(row.pool_label)}` : "pool not recorded"}</span>`;
  const by = `model: ${escapeHtml(MODEL_BY[row.model_by] || row.model_by)}`
    + `<span class="why">account: ${escapeHtml(ACCOUNT_BY[row.account_by] || (row.pool ? "not recorded" : "—"))}</span>`;
  const why = [admission.reason, row.substitution ? `substitution: ${row.substitution}` : null].filter(Boolean);
  return [
    cell(`${row.task_id ? escapeHtml(row.task_id) : '<span class="muted">id withheld</span>'}<span class="why">${escapeHtml(utc(row.started_at))}</span>`),
    text(asked(row)),
    cell(chosen),
    cell(by),
    cell(`<span class="${ADMISSION_CLASS[admission.state] || ""}">${escapeHtml(ADMISSION_WORD[admission.state] || admission.state || "—")}</span>`
      + (why.length ? `<span class="why${row.substitution ? " warn" : ""}">${why.map(escapeHtml).join(" · ")}</span>` : "")),
    text(String(status || "—").replaceAll("_", " "), statusClass),
  ];
}

function filtered(rows) {
  const kind = document.getElementById("filter-kind")?.value || "";
  const pool = document.getElementById("filter-pool")?.value || "";
  const outcome = document.getElementById("filter-outcome")?.value || "";
  return rows.filter(row => (!kind || row.kind === kind) && (!pool || row.pool === pool)
    && (!outcome || (outcome === "held" ? ["deferred", "refused", "forced", "unknown"].includes(row.admission?.state)
      : outcome === "substituted" ? Boolean(row.substitution) : row.live)));
}

function renderDecisions(data) {
  const recent = data.recent || {};
  if (recentState(data) === "missing") {
    return `<p class="warn">Recent decisions are ${escapeHtml(unknownSince(recent.as_of, recent.reason))}.</p>`;
  }
  const rows = filtered(Array.isArray(recent.decisions) ? recent.decisions : []);
  const shown = rows.slice(0, state.shown);
  const more = rows.length > shown.length
    ? `<p class="pager"><button type="button" class="retry" id="show-more">Show ${Math.min(PAGE_ROWS, rows.length - shown.length)} more</button> <span class="muted">${shown.length} of ${rows.length} shown</span></p>`
    : `<p class="muted">${rows.length} shown.</p>`;
  return recentNote(data)
    + table(["Task", "Asked for", "Chosen", "Chosen by", "Admission and substitution", "Status"], shown.map(decisionRow), true)
    + more;
}

function fillPoolFilter(data) {
  const select = document.getElementById("filter-pool");
  if (!select || select.options.length > 1) return;
  for (const pool of data?.now?.pools || []) {
    const option = document.createElement("option");
    option.value = pool.pool;
    option.textContent = pool.label;
    select.append(option);
  }
}

function setAge(id, line, cls) {
  const element = document.getElementById(id);
  if (!element) return;
  element.textContent = line;
  element.className = `age${cls ? ` ${cls}` : ""}`;
}

function paintAges() {
  const data = state.data;
  if (!data) return;
  const ns = nowState(data);
  setAge("pools-age", ns === "ok" ? `Evaluated ${span(ageNow(data.now.age_s))} ago` : `Admission and resolver ${nowUnknownText(data)}`,
    ns === "ok" ? "" : ns === "pending" ? "warn" : "bad");
  const rs = recentState(data);
  setAge("decisions-age", rs === "fresh" || rs === "partial" ? `Last 24 hours · read ${span(ageNow(data.recent.age_s))} ago`
    : `Recent decisions ${unknownSince(rs === "missing" ? data.recent?.as_of : timeOf(data.recent?.age_s), rs === "failed" ? "the last refresh failed" : null)}`,
  rs === "fresh" ? "" : rs === "partial" ? "warn" : "bad");
}

// Every repaint honours the failed-refresh state, until a fetch succeeds.
function paintAll() {
  const data = state.data;
  if (!data) return;
  state.painted = paintKey(data);
  document.getElementById("pools-content").innerHTML = renderPools(data);
  document.getElementById("decisions-content").innerHTML = renderDecisions(data);
  paintAges();
}

// The one-second clock: ages always, and every section again when a part crosses its bound.
function paintKey(data) {
  return `${nowState(data)}|${recentState(data)}|${expiredAllowances(data)}`;
}

function tick(updateChips) {
  const data = state.data;
  if (!data) return;
  if (paintKey(data) !== state.painted) {
    paintAll();
    if (!state.failedAt) document.getElementById("flow-content").innerHTML = renderFlow(data);
    if (typeof updateChips === "function") updateChips();
  }
  paintAges();
}

function chips(latest) {
  const data = latest.flow ? state.data : null;
  if (!data) return "";
  const out = [];
  const counts = data.recent?.counts;
  if (["fresh", "partial"].includes(recentState(data)) && counts) {
    const lanes = [counts.brief || {}, counts.resolver || {}];
    const held = lanes.reduce((n, lane) => n + (lane.admission?.deferred || 0) + (lane.admission?.refused || 0), 0);
    const substituted = lanes.reduce((n, lane) => n + (lane.substitutions || 0), 0);
    out.push(chip("#decisions", held, "deferred or refused in 24 h", held ? "warn" : ""));
    if (substituted) out.push(chip("#decisions", substituted, "substitutions", "warn"));
  }
  if (nowState(data) === "ok" && data.now.resolver?.state === "ok") {
    const empty = (data.now.resolver.first_choice || []).filter(choice => (choice.seats || []).some(seat => emptyPool(data, seat.pool)));
    if (empty.length) out.push(chip("#flow", empty.length, "author families get a reviewer on a pool with 0% left", "bad"));
  }
  if (nowState(data) === "ok" && data.now.admission?.host?.admitting === false) {
    out.push(chip("#pools", "!", "host is deferring writes", "bad"));
  }
  return out.join("");
}

const PANELS = [{
  id: "flow",
  label: "Routing",
  urls: ["/api/runtime/routing"],
  withReadings: true,
  render: (data, readings) => {
    state.data = data;
    state.reading = readings?.[0] || null;
    state.failedAt = null;
    fillPoolFilter(data);
    paintAll();
    return renderFlow(data);
  },
  // A cold evaluation answers "pending": read again shortly rather than wait 30 s.
  retry: data => data?.now?.state === "pending" || data?.recent?.status === "pending",
  onError: () => {
    state.failedAt = Date.now();
    if (state.data) {
      paintAll();
    } else {
      const message = '<p class="error">Routing data could not load; see the panel above.</p>';
      for (const id of ["pools-content", "decisions-content"]) document.getElementById(id).innerHTML = message;
      setAge("pools-age", "unavailable", "bad");
      setAge("decisions-age", "unavailable", "bad");
    }
  },
  onTick: (_panel, _latest, updateChips) => tick(updateChips),
}];

document.getElementById("decision-filters").addEventListener("change", () => {
  state.shown = PAGE_ROWS;
  if (state.data) document.getElementById("decisions-content").innerHTML = renderDecisions(state.data);
});
document.addEventListener("click", event => {
  const more = event.target.closest && event.target.closest("#show-more");
  if (more && state.data) {
    state.shown += PAGE_ROWS;
    document.getElementById("decisions-content").innerHTML = renderDecisions(state.data);
    return;
  }
  const link = event.target.closest && event.target.closest("[data-outcome]");
  if (link) {
    document.getElementById("filter-outcome").value = link.dataset.outcome;
    state.shown = PAGE_ROWS;
    if (state.data) document.getElementById("decisions-content").innerHTML = renderDecisions(state.data);
  }
});

createPanelRunner({panels: PANELS, renderChips: chips}).start();
</script>
</body>
</html>
