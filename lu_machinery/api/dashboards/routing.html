<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Routing — Machinery</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/machinery.css">
<style>
  /* The flow picture: two lanes (writes, reviews) through the same four columns. */
  .flow { display: grid; grid-template-columns: 9rem repeat(4, minmax(0, 1fr)); gap: 8px 22px; align-items: stretch; margin: 6px 0 4px; }
  .flow .lane { font-weight: 600; font-size: 13px; align-self: center; }
  .flow .lane small { display: block; font-weight: normal; color: var(--muted); }
  .stage { position: relative; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--bg); min-width: 0; }
  .stage + .stage::before { content: "→"; position: absolute; left: -18px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; }
  .stage.skip { border-style: dashed; background: transparent; }
  .stage .who { font-size: 12px; color: var(--muted); }
  .stage .count { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stage .split { font-size: 12px; overflow-wrap: anywhere; }
  .flow-head { font-size: 12px; color: var(--muted); font-weight: 600; }
  .callout { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 8px 0; }
  .callout.bad { border-color: var(--bad); font-weight: normal; }
  .callout.warn { border-color: var(--warn); }
  .seat { display: block; }
  td .why { display: block; font-size: 12px; color: var(--muted); white-space: normal; }
  @media (max-width: 900px) {
    .flow { grid-template-columns: 1fr; gap: 6px; }
    .flow .flow-head { display: none; }
    .flow .lane { margin-top: 8px; }
    .stage + .stage::before { content: "↓"; left: 50%; top: -14px; transform: translateX(-50%); font-size: 13px; }
    .stage + .stage { margin-top: 10px; }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header>
  <div class="header-top">
    <div class="title">
      <h1>Routing</h1>
      <p class="purpose">Who picks each worker's model and account, whether admission lets new work start, and where reviews are seated.</p>
    </div>
    <div class="header-utils">
      <nav class="sites" id="machinery-sites" aria-label="Sites"></nav>
      <button type="button" class="theme-toggle" id="theme-toggle">Theme: Auto</button>
      <div class="refresh">
        <span class="muted" id="last-refresh">Loading…</span>
        <button type="button" class="retry" id="refresh-retry" hidden aria-label="Retry refresh">Retry</button>
      </div>
    </div>
  </div>
  <div class="header-nav">
    <nav class="pages" id="machinery-nav" aria-label="Pages">__MACHINERY_NAV__</nav>
    <div class="chips" id="chips"></div>
  </div>
</header>
<main id="main" tabindex="-1">
  <section class="wide" id="flow">
    <h2>How work is routed, last 24 hours <span class="age" id="flow-age">Loading…</span></h2>
    <p id="flow-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
    <div id="flow-content">Loading…</div>
  </section>
  <section class="wide stacked" id="pools">
    <h2>Pools now <span class="age" id="pools-age">Loading…</span></h2>
    <div id="pools-content">Loading…</div>
  </section>
  <section class="wide stacked" id="decisions">
    <h2>Recent decisions <span class="age" id="decisions-age">Loading…</span></h2>
    <form class="filters" id="decision-filters" onsubmit="return false">
      <label>Work
        <select id="filter-kind" autocomplete="off">
          <option value="">All work</option>
          <option value="write">Writes</option>
          <option value="review">Reviews</option>
          <option value="read_only">Other read-only</option>
        </select>
      </label>
      <label>Pool
        <select id="filter-pool" autocomplete="off"><option value="">All pools</option></select>
      </label>
      <label>Show
        <select id="filter-outcome" autocomplete="off">
          <option value="">Every decision</option>
          <option value="held">Deferred or refused</option>
          <option value="substituted">Substitutions</option>
          <option value="live">Running now</option>
        </select>
      </label>
    </form>
    <div id="decisions-content">Loading…</div>
  </section>
</main>
<script src="/machinery.js"></script>
<script>
"use strict";
const {escapeHtml, utc, relative, span, pct, bar, table, td, text, chip, panelAgeSeconds, createPanelRunner} = Machinery;

const PAGE_ROWS = 25;
const STALE_AFTER_S = 90;
const state = {data: null, reading: null, shown: PAGE_ROWS};

const ACCOUNT_BY = {helper: "account helper", saved_default: "saved default account", builtin_default: "built-in default", single_account: "only account", not_recorded: "not recorded"};
const MODEL_BY = {brief: "brief", resolver: "resolver"};
const ADMISSION_CLASS = {admitted: "ok", deferred: "bad", refused: "bad", not_checked: "muted", unknown: "warn"};
const ADMISSION_WORD = {admitted: "Admitted", deferred: "Deferred", refused: "Refused", not_checked: "Not checked", unknown: "Unknown"};

const cell = (html, cls = "") => td(`<div>${html}</div>`, cls);

function unknownSince(time, why) {
  const when = time ? `unknown since ${utc(time)}` : "unknown (never read)";
  return why ? `${when} · ${String(why).replaceAll("_", " ")}` : when;
}

// The decisions snapshot's age, from the response header plus the time since it arrived.
function recentAge() {
  return state.reading ? panelAgeSeconds(state.reading, Date.now()) : null;
}

function recentState(data) {
  const recent = data && data.recent;
  if (!recent || recent.status !== "ok") return "missing";
  const age = recentAge();
  return age === null ? "unknown" : age > STALE_AFTER_S ? "stale" : "fresh";
}

function lastReadTime(data) {
  const age = recentAge();
  return age === null ? null : new Date(Date.now() - age * 1000).toISOString();
}

function topCounts(counts, limit = 3) {
  const entries = Object.entries(counts || {}).sort((a, b) => b[1] - a[1]);
  const shown = entries.slice(0, limit).map(([name, n]) => `${escapeHtml(name)} ${n}`);
  if (entries.length > limit) shown.push(`+${entries.length - limit} more`);
  return shown.join(" · ") || "none";
}

function stage(who, count, split, cls = "") {
  return `<div class="stage ${cls}"><div class="who">${who}</div>`
    + `<div class="count">${count}</div><div class="split">${split}</div></div>`;
}

function poolByMeter(data, meter) {
  return (data?.now?.pools || []).find(pool => pool.pool === meter) || null;
}

// A seat's pool has no allowance left.
function emptyPool(data, meter) {
  const left = poolByMeter(data, meter)?.allowance?.left_pct;
  return typeof left === "number" && left <= 0;
}

function firstChoiceCallouts(data) {
  const resolver = data?.now?.resolver;
  if (!resolver || resolver.state !== "ok") {
    return `<p class="callout warn">Reviewer resolver: ${escapeHtml(unknownSince(data?.now?.budget?.generated_at, resolver?.reason))}.</p>`;
  }
  // Author families that get the same seats share one line.
  const groups = new Map();
  for (const choice of resolver.first_choice || []) {
    const seats = choice.seats || [];
    const key = seats.map(seat => `${seat.model}|${seat.pool}`).join("+") || `none|${choice.reason}`;
    if (!groups.has(key)) groups.set(key, {choice, authors: []});
    groups.get(key).authors.push(choice.author);
  }
  const lines = [...groups.values()].map(({choice, authors}) => {
    const who = authors.length > 1 ? `${authors.slice(0, -1).join(", ")} and ${authors.at(-1)}` : authors[0];
    const head = `${escapeHtml(who)}-authored ${escapeHtml(resolver.profile)} reviews (${escapeHtml(resolver.risk)} risk)`;
    const seats = choice.seats || [];
    if (!seats.length) return `<li class="bad">${head}: no reviewer can be seated (${escapeHtml(choice.reason || "no eligible reviewer")}).</li>`;
    const named = seats.map(seat => `<b>${escapeHtml(seat.model)}</b>${seat.pool_label ? ` on ${escapeHtml(seat.pool_label)}` : ""}`).join(" and ");
    const empty = seats.filter(seat => emptyPool(data, seat.pool));
    const warn = empty.length ? ` <span class="bad">${empty.map(seat => escapeHtml(seat.pool_label)).join(", ")} has 0% allowance left, so the review has to run on another account.</span>` : "";
    return `<li>${head}: the resolver seats ${named}${seats.length > 1 ? " (two-seat review)" : ""}.${warn}</li>`;
  });
  const age = typeof resolver.age_s === "number" ? ` <span class="age">evaluated ${escapeHtml(span(resolver.age_s))} ago</span>` : "";
  return `<h3>Who the resolver would seat right now${age}</h3><ul>${lines.join("")}</ul>`;
}

function admissionSplit(adm) {
  const held = [`<span class="${adm.deferred ? "bad" : "muted"}">${adm.deferred ?? 0} deferred</span>`,
    `<span class="${adm.refused ? "bad" : "muted"}">${adm.refused ?? 0} refused</span>`];
  if (adm.not_checked) held.push(`<span class="muted">${adm.not_checked} read-only, not checked</span>`);
  return held.join(" · ");
}

function laneRow(name, chooser, counts) {
  const adm = counts.admission || {};
  const chooserSplit = Object.entries(counts.by_account_chooser || {})
    .map(([key, n]) => `${escapeHtml(ACCOUNT_BY[key] || key.replaceAll("_", " "))} ${n}`).join(" · ") || "no subscription account";
  return [
    `<div class="lane">${name}<small>${counts.total} dispatches</small></div>`,
    stage(chooser, counts.total, topCounts(counts.by_model)),
    stage(`Account: ${chooserSplit}`, Object.values(counts.by_pool || {}).reduce((n, v) => n + v, 0), topCounts(counts.by_pool, 4)),
    stage("Admission: host and pool limits", `${adm.admitted ?? 0} <small class="ok">admitted</small>`, admissionSplit(adm),
      adm.admitted || adm.deferred || adm.refused ? "" : "skip"),
    stage("Ran", `${counts.live} <small>running now</small>`,
      counts.substitutions ? `<a class="warn" href="#decisions" data-outcome="substituted">${counts.substitutions} ran another model</a>` : "no substitutions recorded"),
  ].join("");
}

function renderFlow(data) {
  const recent = data.recent || {};
  const fresh = recentState(data);
  if (fresh === "missing") {
    return `<p class="warn">Recent decisions are ${escapeHtml(unknownSince(recent.as_of, recent.reason))}; no counts are shown.</p>`
      + firstChoiceCallouts(data);
  }
  const counts = recent.counts || {};
  const staleNote = fresh === "stale" || fresh === "unknown"
    ? `<p class="callout warn">Recent decisions are ${escapeHtml(unknownSince(lastReadTime(data)))}; the counts below are from that reading.</p>` : "";
  const flow = '<div class="flow" role="group" aria-label="Routing flow for writes and for reviews: who picks the model, which account pays, admission, what ran">'
    + '<div class="flow-head"></div><div class="flow-head">1 · Who picks the model</div><div class="flow-head">2 · Which account pays</div>'
    + '<div class="flow-head">3 · Admission (writes only)</div><div class="flow-head">4 · What ran</div>'
    + laneRow("Writes and other work", "The brief (CTO or lead) names the model", counts.brief || {})
    + laneRow("Reviews", "The reviewer resolver seats a model from another family", counts.resolver || {})
    + "</div>";
  const windowNote = `<p class="muted">${recent.total ?? 0} decisions since ${escapeHtml(utc(Date.now() - (recent.window_s || 86400) * 1000))}`
    + `${recent.unreadable ? ` · <span class="warn">${recent.unreadable} task records could not be read</span>` : ""}.</p>`;
  return staleNote + flow + windowNote + firstChoiceCallouts(data);
}

function liveCell(pool, data) {
  if (!pool.live || recentState(data) === "missing") return text("unknown", "warn");
  const {all, write} = pool.live;
  return text(`${all}${all ? ` (${write} write${write === 1 ? "" : "s"})` : ""}`, all ? "" : "muted");
}

function allowanceCell(allowance) {
  if (!allowance || allowance.state !== "fresh" || typeof allowance.left_pct !== "number") {
    return text(unknownSince(allowance?.read_at, allowance?.reason), "warn");
  }
  return cell(`${bar(allowance.left_pct)}${escapeHtml(pct(allowance.left_pct))}`, allowance.left_pct <= 0 ? "bad" : "");
}

function resetCell(allowance) {
  if (!allowance || allowance.state !== "fresh" || !allowance.resets_at) return text("—", "muted");
  return cell(`${escapeHtml(utc(allowance.resets_at))}<span class="why">${escapeHtml(relative(allowance.resets_at))}</span>`);
}

function admissionCell(admission, budget) {
  if (!admission || admission.state === "unknown") {
    return text(unknownSince(budget?.generated_at, admission?.reason), "warn");
  }
  // Admitted without a fresh allowance reading is admission failing open with a lower cap: amber, not green.
  const blind = admission.state === "admitted" && admission.note;
  const word = blind ? "Admitted, allowance not seen" : ADMISSION_WORD[admission.state] || admission.state;
  const why = [admission.reason, admission.note].filter(Boolean).map(escapeHtml).join(" · ");
  return cell(`<span class="${blind ? "warn" : ADMISSION_CLASS[admission.state] || ""}">${escapeHtml(word)}</span>${why ? `<span class="why">${why}</span>` : ""}`);
}

function seatsCell(seats, resolver, budget) {
  if (!Array.isArray(seats)) return text(unknownSince(budget?.generated_at, resolver?.reason), "warn");
  if (!seats.length) return text("no automatic review seat", "muted");
  return cell(seats.map(seat => seat.state === "eligible"
    ? `<span class="seat"><span class="ok">Eligible</span> · ${escapeHtml(seat.model)}${seat.picked_for?.length
      ? `<span class="why">first choice for ${escapeHtml(seat.picked_for.join(", "))}-authored reviews</span>`
      : '<span class="why">eligible, not the first choice now</span>'}</span>`
    : `<span class="seat"><span class="warn">Excluded</span> · ${escapeHtml(seat.model)}<span class="why">${escapeHtml(seat.reason || "")}</span></span>`).join(""));
}

function renderPools(data) {
  const now = data.now || {};
  const host = now.host;
  const hostLine = !host ? `<p class="callout warn">Host admission checks: ${escapeHtml(unknownSince(null, "live workers or admission settings unknown"))}.</p>`
    : host.admitting
      ? `<p class="callout">Host: admission is letting new writes start (${host.checks.length} host checks pass: ${escapeHtml(host.checks.map(c => c.check).join(", "))}).</p>`
      : `<p class="callout bad">Host: admission is deferring <b>every</b> new write: ${escapeHtml(host.checks.filter(c => c.state === "fail").map(c => `${c.check} (${c.reason})`).join("; "))}.</p>`;
  const budget = now.budget || {};
  const budgetLine = budget.state === "ok"
    ? `<p class="muted">Admission and resolver verdicts use the routing budget admission reads, ${escapeHtml(span(budget.age_s))} old. They describe a new <b>write</b> dispatch and a ${escapeHtml(now.resolver?.profile || "code")} review at ${escapeHtml(now.resolver?.risk || "medium")} risk.</p>`
    : `<p class="warn">Routing budget ${escapeHtml(unknownSince(null, budget.reason))}: admission and resolver verdicts are unknown.</p>`;
  const rows = (now.pools || []).map(pool => [
    td(`<b>${escapeHtml(pool.label)}</b>`),
    liveCell(pool, data),
    allowanceCell(pool.allowance),
    resetCell(pool.allowance),
    admissionCell(pool.admission, budget),
    seatsCell(pool.review_seats, now.resolver, budget),
  ]);
  const unpooled = now.resolver?.unpooled?.length
    ? `<p class="muted">Seats without a pool (the account they would run on is not resolved): ${now.resolver.unpooled.map(seat => `${escapeHtml(seat.model)} — ${escapeHtml(seat.reason || seat.state)}`).join("; ")}.</p>` : "";
  return hostLine + budgetLine
    + table(["Pool", "Live now", "Allowance left", "Resets", "New write work", "Review seats"], rows, true) + unpooled;
}

function asked(row) {
  if (row.kind === "review") {
    const parts = [`${row.profile || "code"} review`, row.risk ? `${row.risk} risk` : null, row.author_model ? `author ${row.author_model}` : null];
    return parts.filter(Boolean).join(" · ");
  }
  return `${row.kind === "write" ? "write" : "read-only"}${row.role ? ` · ${row.role.replaceAll("_", " ")}` : ""}`;
}

function decisionRow(row) {
  const status = row.live ? "running" : row.status;
  const admission = row.admission || {};
  const statusClass = row.live ? "ok" : ["failed", "crashed", "timeout", "no_deliverable", "rate_limited"].includes(row.status) ? "bad" : "";
  const chosen = `${escapeHtml(row.model || "unknown model")}${row.effort ? ` <span class="muted">(${escapeHtml(row.effort)})</span>` : ""}`
    + `<span class="why">on ${escapeHtml(row.pool_label || "no subscription pool")}</span>`;
  const by = `model: ${escapeHtml(MODEL_BY[row.model_by] || row.model_by)}`
    + `<span class="why">account: ${escapeHtml(ACCOUNT_BY[row.account_by] || (row.pool ? "not recorded" : "—"))}</span>`;
  const why = [admission.reason, row.substitution ? `substitution: ${row.substitution}` : null].filter(Boolean);
  return [
    cell(`${escapeHtml(row.task_id)}<span class="why">${escapeHtml(utc(row.started_at))}</span>`),
    text(asked(row)),
    cell(chosen),
    cell(by),
    cell(`<span class="${ADMISSION_CLASS[admission.state] || ""}">${escapeHtml(ADMISSION_WORD[admission.state] || admission.state || "—")}</span>`
      + (why.length ? `<span class="why${row.substitution ? " warn" : ""}">${why.map(escapeHtml).join(" · ")}</span>` : "")),
    text(String(status || "—").replaceAll("_", " "), statusClass),
  ];
}

function filtered(rows) {
  const kind = document.getElementById("filter-kind")?.value || "";
  const pool = document.getElementById("filter-pool")?.value || "";
  const outcome = document.getElementById("filter-outcome")?.value || "";
  return rows.filter(row => (!kind || row.kind === kind) && (!pool || row.pool === pool)
    && (!outcome || (outcome === "held" ? ["deferred", "refused"].includes(row.admission?.state)
      : outcome === "substituted" ? Boolean(row.substitution) : row.live)));
}

function renderDecisions(data) {
  const recent = data.recent || {};
  if (recentState(data) === "missing") {
    return `<p class="warn">Recent decisions are ${escapeHtml(unknownSince(recent.as_of, recent.reason))}.</p>`;
  }
  const all = Array.isArray(recent.decisions) ? recent.decisions : [];
  const rows = filtered(all);
  const shown = rows.slice(0, state.shown);
  const notes = [];
  if (recent.truncated) notes.push(`The page holds the newest ${all.length} of ${recent.total} decisions; the counts above cover all of them.`);
  const more = rows.length > shown.length
    ? `<p class="pager"><button type="button" class="retry" id="show-more">Show ${Math.min(PAGE_ROWS, rows.length - shown.length)} more</button> <span class="muted">${shown.length} of ${rows.length} shown</span></p>`
    : `<p class="muted">${rows.length} shown.</p>`;
  return (notes.length ? `<p class="muted">${escapeHtml(notes.join(" "))}</p>` : "")
    + table(["Task", "Asked for", "Chosen", "Chosen by", "Admission and substitution", "Status"], shown.map(decisionRow), true)
    + more;
}

function fillPoolFilter(data) {
  const select = document.getElementById("filter-pool");
  if (!select || select.options.length > 1) return;
  for (const pool of data?.now?.pools || []) {
    const option = document.createElement("option");
    option.value = pool.pool;
    option.textContent = pool.label;
    select.append(option);
  }
}

function setAge(id, line, cls) {
  const element = document.getElementById(id);
  if (!element) return;
  element.textContent = line;
  element.className = `age${cls ? ` ${cls}` : ""}`;
}

function paintAll() {
  const data = state.data;
  if (!data) return;
  document.getElementById("pools-content").innerHTML = renderPools(data);
  document.getElementById("decisions-content").innerHTML = renderDecisions(data);
  const budget = data.now?.budget;
  setAge("pools-age", budget?.state === "ok" ? `Checked ${utc(data.now.as_of)} · routing budget ${span(budget.age_s)} old` : unknownSince(budget?.generated_at, budget?.reason), budget?.state === "ok" ? "" : "warn");
  const fresh = recentState(data);
  setAge("decisions-age", fresh === "fresh" ? `Last 24 hours · read ${span(recentAge())} ago` : `Recent decisions ${unknownSince(fresh === "missing" ? data.recent?.as_of : lastReadTime(data))}`, fresh === "fresh" ? "" : "bad");
}

function chips(latest) {
  const data = latest.flow;
  if (!data) return "";
  const out = [];
  const counts = data.recent?.counts;
  if (recentState(data) !== "missing" && counts) {
    const lanes = [counts.brief || {}, counts.resolver || {}];
    const held = lanes.reduce((n, lane) => n + (lane.admission?.deferred || 0) + (lane.admission?.refused || 0), 0);
    const substituted = lanes.reduce((n, lane) => n + (lane.substitutions || 0), 0);
    out.push(chip("#decisions", held, "deferred or refused in 24 h", held ? "warn" : ""));
    if (substituted) out.push(chip("#decisions", substituted, "substitutions", "warn"));
  }
  const empty = (data.now?.resolver?.first_choice || []).filter(choice =>
    (choice.seats || []).some(seat => emptyPool(data, seat.pool)));
  if (empty.length) out.push(chip("#flow", empty.length, "author families get a reviewer on a pool with 0% left", "bad"));
  if (data.now?.host && !data.now.host.admitting) out.push(chip("#pools", "!", "host is deferring writes", "bad"));
  return out.join("");
}

const PANELS = [{
  id: "flow",
  label: "Routing",
  urls: ["/api/runtime/routing"],
  withReadings: true,
  render: (data, readings) => {
    state.data = data;
    state.reading = readings?.[0] || null;
    fillPoolFilter(data);
    paintAll();
    return renderFlow(data);
  },
  onError: () => {
    const message = '<p class="error">Routing data could not load; see the panel above.</p>';
    for (const id of ["pools-content", "decisions-content"]) document.getElementById(id).innerHTML = message;
    setAge("pools-age", "unavailable", "bad");
    setAge("decisions-age", "unavailable", "bad");
  },
  onTick: () => {
    if (!state.data) return;
    const fresh = recentState(state.data);
    setAge("decisions-age", fresh === "fresh" ? `Last 24 hours · read ${span(recentAge())} ago` : `Recent decisions ${unknownSince(fresh === "missing" ? state.data.recent?.as_of : lastReadTime(state.data))}`, fresh === "fresh" ? "" : "bad");
  },
}];

document.getElementById("decision-filters").addEventListener("change", () => {
  state.shown = PAGE_ROWS;
  if (state.data) document.getElementById("decisions-content").innerHTML = renderDecisions(state.data);
});
document.addEventListener("click", event => {
  const more = event.target.closest && event.target.closest("#show-more");
  if (more && state.data) {
    state.shown += PAGE_ROWS;
    document.getElementById("decisions-content").innerHTML = renderDecisions(state.data);
    return;
  }
  const link = event.target.closest && event.target.closest("[data-outcome]");
  if (link) {
    document.getElementById("filter-outcome").value = link.dataset.outcome;
    state.shown = PAGE_ROWS;
    if (state.data) document.getElementById("decisions-content").innerHTML = renderDecisions(state.data);
  }
});

createPanelRunner({panels: PANELS, renderChips: chips}).start();
</script>
</body>
</html>
