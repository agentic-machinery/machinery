<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Routing — Machinery</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/machinery.css">
<style>
  /* The flow picture: two lanes (writes, reviews) through the same four columns. */
  .flow { display: grid; grid-template-columns: 9rem repeat(4, minmax(0, 1fr)); gap: 8px 22px; align-items: stretch; margin: 6px 0 4px; }
  .flow .lane { font-weight: 600; font-size: 13px; align-self: center; }
  .flow .lane small { display: block; font-weight: normal; color: var(--muted); }
  .stage { position: relative; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--bg); min-width: 0; }
  .stage + .stage::before { content: "→"; position: absolute; left: -18px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; }
  .stage.unchecked { border-style: dashed; background: transparent; }
  .stage .who { font-size: 12px; color: var(--muted); }
  .stage .count { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stage .split { font-size: 12px; overflow-wrap: anywhere; }
  .flow-head { font-size: 12px; color: var(--muted); font-weight: 600; }
  .callout { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 8px 0; }
  .callout.warn { border-color: var(--warn); }
  td .why { display: block; font-size: 12px; color: var(--muted); white-space: normal; }
  @media (max-width: 900px) {
    .flow { grid-template-columns: 1fr; gap: 6px; }
    .flow .flow-head { display: none; }
    .flow .lane { margin-top: 8px; }
    .stage + .stage::before { content: "↓"; left: 50%; top: -14px; transform: translateX(-50%); font-size: 13px; }
    .stage + .stage { margin-top: 10px; }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<header>
  <div class="header-top">
    <div class="title">
      <h1>Routing</h1>
      <p class="purpose">Who picked each recent worker's model and account, what admission decided, and what ran.</p>
    </div>
    <div class="header-utils">
      <nav class="sites" id="machinery-sites" aria-label="Sites"></nav>
      <button type="button" class="theme-toggle" id="theme-toggle">Theme: Auto</button>
      <div class="refresh">
        <span class="muted" id="last-refresh">Loading…</span>
        <button type="button" class="retry" id="refresh-retry" hidden aria-label="Retry refresh">Retry</button>
      </div>
    </div>
  </div>
  <div class="header-nav">
    <nav class="pages" id="machinery-nav" aria-label="Pages">__MACHINERY_NAV__</nav>
    <div class="chips" id="chips"></div>
  </div>
</header>
<main id="main" tabindex="-1">
  <section class="wide" id="flow">
    <h2>How work is routed, last 24 hours <span class="age" id="flow-age">Loading…</span></h2>
    <p id="flow-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></p>
    <div id="flow-content">Loading…</div>
  </section>
  <section class="wide stacked" id="decisions">
    <h2>Recent decisions <span class="age" id="decisions-age">Loading…</span></h2>
    <form class="filters" id="decision-filters" onsubmit="return false">
      <label>Work
        <select id="filter-kind" autocomplete="off">
          <option value="">All work</option>
          <option value="write">Writes</option>
          <option value="review">Reviews</option>
          <option value="read_only">Other read-only</option>
        </select>
      </label>
      <label>Pool
        <select id="filter-pool" autocomplete="off"><option value="">All pools</option></select>
      </label>
      <label>Show
        <select id="filter-outcome" autocomplete="off">
          <option value="">Every decision</option>
          <option value="held">Deferred, refused or without admission proof</option>
          <option value="substituted">Substitutions</option>
          <option value="live">Running now</option>
        </select>
      </label>
    </form>
    <div id="decisions-content">Loading…</div>
  </section>
</main>
<script src="/machinery.js"></script>
<script>
"use strict";
const {escapeHtml, utc, span, table, td, text, chip, createPanelRunner} = Machinery;

const PAGE_ROWS = 25;
const STALE_AFTER_S = 90;
// data: the last successful response. failedAt: the last failed refresh, until one succeeds. chips: what the chip box shows.
const state = {data: null, failedAt: null, shown: PAGE_ROWS, painted: "", chips: null};

const ACCOUNT_BY = {helper: "account helper", saved_default: "saved default account", builtin_default: "built-in default", single_account: "only account", not_recorded: "not recorded"};
const MODEL_BY = {brief: "brief", not_recorded: "not recorded"};
const ADMISSION_CLASS = {admitted: "ok", forced: "warn", deferred: "bad", refused: "bad", not_checked: "muted", unknown: "warn"};
const ADMISSION_WORD = {admitted: "Admitted", forced: "Started by override", deferred: "Deferred", refused: "Refused", not_checked: "Not checked", unknown: "Unknown"};

// A cell whose content is one block, so the stacked (card) layout keeps its label beside it.
const cell = (html, cls = "") => td(`<div>${html}</div>`, cls);

function unknownSince(time, why) {
  const when = time ? `unknown since ${utc(time)}` : "unknown (no reading yet)";
  return why ? `${when} · ${String(why).replaceAll("_", " ")}` : when;
}

// Seconds since the scan read the store (its as_of). The server and the page share one loopback host, so
// its clock is the page's: every age on the page, and the freshness bound, is measured this one way.
function ageOf(time) {
  const at = typeof time === "string" ? Date.parse(time) : NaN;
  return Number.isFinite(at) ? Math.max(0, (Date.now() - at) / 1000) : null;
}

function timeOf(time) {
  return ageOf(time) === null ? null : time;
}

// fresh, stale (older than the bound), partial (some records unreadable), failed (the last refresh failed) or missing.
function recentState(data) {
  const recent = data?.recent;
  if (!recent || !["ok", "partial"].includes(recent.status)) return "missing";
  if (state.failedAt) return "failed";
  const age = ageOf(recent.as_of);
  if (age === null || age > STALE_AFTER_S) return "stale";
  return recent.status === "partial" ? "partial" : "fresh";
}



function topCounts(counts, limit = 3) {
  const entries = Object.entries(counts || {}).sort((a, b) => b[1] - a[1]);
  const shown = entries.slice(0, limit).map(([name, n]) => `${escapeHtml(name)} ${n}`);
  if (entries.length > limit) shown.push(`+${entries.length - limit} more`);
  return shown.join(" · ") || "none";
}

function stage(who, count, split, cls = "") {
  return `<div class="stage ${cls}"><div class="who">${who}</div>`
    + `<div class="count">${count}</div><div class="split">${split}</div></div>`;
}






function admissionSplit(adm) {
  const parts = [`<span class="${adm.deferred ? "bad" : "muted"}">${adm.deferred ?? 0} deferred</span>`,
    `<span class="${adm.refused ? "bad" : "muted"}">${adm.refused ?? 0} refused</span>`];
  if (adm.forced) parts.push(`<span class="warn">${adm.forced} started by override</span>`);
  if (adm.unknown) parts.push(`<span class="warn">${adm.unknown} without an admission record</span>`);
  if (adm.not_checked) parts.push(`<span class="muted">${adm.not_checked} read-only, not checked</span>`);
  return parts.join(" · ");
}

function laneRow(name, chooser, counts) {
  const adm = counts.admission || {};
  const chooserSplit = Object.entries(counts.by_account_chooser || {})
    .map(([key, n]) => `${escapeHtml(ACCOUNT_BY[key] || key.replaceAll("_", " "))} ${n}`).join(" · ") || "no subscription account";
  const checked = (adm.admitted || 0) + (adm.deferred || 0) + (adm.refused || 0) + (adm.forced || 0) + (adm.unknown || 0);
  return [
    `<div class="lane">${name}<small>${counts.total ?? 0} dispatches</small></div>`,
    stage(chooser, counts.total ?? 0, topCounts(counts.by_model)),
    stage(`Account: ${chooserSplit}`, Object.values(counts.by_pool || {}).reduce((n, v) => n + v, 0), topCounts(counts.by_pool, 4)),
    stage("Admission: host and pool limits", `${adm.admitted ?? 0} <small class="ok">admitted</small>`, admissionSplit(adm),
      checked ? "" : "unchecked"),
    stage("Ran", `${counts.live ?? 0} <small>running or starting</small>`,
      counts.substitutions ? `<a class="warn" href="#decisions" data-outcome="substituted">${counts.substitutions} ran another model</a>` : "no substitutions recorded"),
  ].join("");
}

function recentNote(data) {
  const recent = data.recent || {};
  const st = recentState(data);
  if (st === "stale" || st === "failed") {
    const why = st === "failed" ? "the last refresh failed" : "the reading is out of date";
    return `<p class="callout warn">Recent decisions are ${escapeHtml(unknownSince(timeOf(recent.as_of), why))}; what follows is that last reading.</p>`;
  }
  if (st === "partial") {
    return `<p class="callout warn">${recent.unreadable} task records in the window could not be read, so these counts and rows may be incomplete.</p>`;
  }
  return "";
}

function renderFlow(data) {
  const recent = data.recent || {};
  if (recentState(data) === "missing") {
    return `<p class="warn">Recent decisions are ${escapeHtml(unknownSince(recent.as_of, recent.reason))}; no counts are shown.</p>`;
  }
  const counts = recent.counts || {};
  const flow = '<div class="flow" role="group" aria-label="Routing flow for writes and for reviews: who picks the model, which account pays, admission, what ran">'
    + '<div class="flow-head"></div><div class="flow-head">1 · Who picks the model</div><div class="flow-head">2 · Which account pays</div>'
    + '<div class="flow-head">3 · Admission (writes only)</div><div class="flow-head">4 · What ran</div>'
    + laneRow("Writes and other work", "The brief (CTO or lead) names the model", counts.brief || {})
    + laneRow("Reviews", "The dispatch names the reviewer (the resolver's pick is not recorded on the task)", counts.resolver || {})
    + "</div>";
  const windowNote = `<p class="muted">${recent.total ?? 0} decisions started since ${escapeHtml(utc(Date.parse(recent.as_of) - (recent.window_s || 86400) * 1000))}.</p>`;
  return recentNote(data) + flow + windowNote;
}










function asked(row) {
  if (row.kind === "review") {
    const parts = [row.profile ? `${row.profile} review` : "review, profile not recorded", row.risk ? `${row.risk} risk` : null, row.author_model ? `author ${row.author_model}` : null];
    return parts.filter(Boolean).join(" · ");
  }
  return `${row.kind === "write" ? "write" : "read-only"} · ${row.role ? row.role.replaceAll("_", " ") : "role not recorded"}`;
}

function decisionRow(row) {
  const status = row.live ? "running" : row.status;
  const admission = row.admission || {};
  const statusClass = row.live ? "ok" : ["failed", "crashed", "timeout", "no_deliverable", "rate_limited"].includes(row.status) ? "bad" : "";
  const chosen = `${escapeHtml(row.model || "unknown model")}${row.effort ? ` <span class="muted">(${escapeHtml(row.effort)})</span>` : ""}`
    + `<span class="why">${row.pool_label ? `on ${escapeHtml(row.pool_label)}` : "pool not recorded"}</span>`;
  const by = `model: ${escapeHtml(MODEL_BY[row.model_by] || row.model_by)}`
    + `<span class="why">account: ${escapeHtml(ACCOUNT_BY[row.account_by] || (row.pool ? "not recorded" : "—"))}</span>`;
  const why = [admission.reason, row.substitution ? `substitution: ${row.substitution}` : null].filter(Boolean);
  return [
    cell(`${row.task_id ? escapeHtml(row.task_id) : '<span class="muted">id withheld</span>'}<span class="why">${escapeHtml(utc(row.started_at))}</span>`),
    text(asked(row)),
    cell(chosen),
    cell(by),
    cell(`<span class="${ADMISSION_CLASS[admission.state] || ""}">${escapeHtml(ADMISSION_WORD[admission.state] || admission.state || "—")}</span>`
      + (why.length ? `<span class="why${row.substitution ? " warn" : ""}">${why.map(escapeHtml).join(" · ")}</span>` : "")),
    text(String(status || "—").replaceAll("_", " "), statusClass),
  ];
}

function filtered(rows) {
  const kind = document.getElementById("filter-kind")?.value || "";
  const pool = document.getElementById("filter-pool")?.value || "";
  const outcome = document.getElementById("filter-outcome")?.value || "";
  return rows.filter(row => (!kind || row.kind === kind) && (!pool || row.pool === pool)
    && (!outcome || (outcome === "held" ? ["deferred", "refused", "forced", "unknown"].includes(row.admission?.state)
      : outcome === "substituted" ? Boolean(row.substitution) : row.live)));
}

function renderDecisions(data) {
  const recent = data.recent || {};
  if (recentState(data) === "missing") {
    return `<p class="warn">Recent decisions are ${escapeHtml(unknownSince(recent.as_of, recent.reason))}.</p>`;
  }
  const rows = filtered(Array.isArray(recent.decisions) ? recent.decisions : []);
  const shown = rows.slice(0, state.shown);
  const more = rows.length > shown.length
    ? `<p class="pager"><button type="button" class="retry" id="show-more">Show ${Math.min(PAGE_ROWS, rows.length - shown.length)} more</button> <span class="muted">${shown.length} of ${rows.length} shown</span></p>`
    : `<p class="muted">${rows.length} shown.</p>`;
  return recentNote(data)
    + table(["Task", "Asked for", "Chosen", "Chosen by", "Admission and substitution", "Status"], shown.map(decisionRow), true)
    + more;
}

function fillPoolFilter(data) {
  const select = document.getElementById("filter-pool");
  if (!select || select.options.length > 1) return;
  for (const pool of data?.pools || []) {
    const option = document.createElement("option");
    option.value = pool.pool;
    option.textContent = pool.label;
    select.append(option);
  }
}

function setAge(id, line, cls) {
  const element = document.getElementById(id);
  if (!element) return;
  element.textContent = line;
  element.className = `age${cls ? ` ${cls}` : ""}`;
}

function paintAges() {
  const data = state.data;
  if (!data) return;
  const rs = recentState(data);
  setAge("decisions-age", rs === "fresh" || rs === "partial" ? `Last 24 hours · read ${span(ageOf(data.recent.as_of))} ago`
    : `Recent decisions ${unknownSince(rs === "missing" ? data.recent?.as_of : timeOf(data.recent?.as_of), rs === "failed" ? "the last refresh failed" : null)}`,
  rs === "fresh" ? "" : rs === "partial" ? "warn" : "bad");
}

// Every repaint honours the failed-refresh state, until a fetch succeeds.
function paintAll() {
  const data = state.data;
  if (!data) return;
  state.painted = paintKey(data);
  document.getElementById("decisions-content").innerHTML = renderDecisions(data);
  paintAges();
  paintChips();
}

// The one-second clock: ages always, and every section again when the scan crosses its bound.
function paintKey(data) {
  return recentState(data);
}

function tick() {
  const data = state.data;
  if (!data) return;
  if (paintKey(data) !== state.painted) {
    paintAll();
    if (!state.failedAt) document.getElementById("flow-content").innerHTML = renderFlow(data);
  }
  paintChips();
  paintAges();
}

// The page's one chip-render path (render, failure and the one-second clock all paint through it), so the
// chips always follow the state the sections show, including a scan that goes stale between fetches.
function paintChips() {
  const shown = chips();
  if (shown === state.chips) return;
  state.chips = shown;
  const box = document.getElementById("chips");
  if (box) box.innerHTML = shown;
}

function chips() {
  const data = state.data;
  if (!data) return "";
  const out = [];
  const counts = data.recent?.counts;
  if (["fresh", "partial"].includes(recentState(data)) && counts) {
    const lanes = [counts.brief || {}, counts.resolver || {}];
    const held = lanes.reduce((n, lane) => n + (lane.admission?.deferred || 0) + (lane.admission?.refused || 0), 0);
    const substituted = lanes.reduce((n, lane) => n + (lane.substitutions || 0), 0);
    const low = recentState(data) === "partial" ? " (may be low)" : "";
    out.push(chip("#decisions", held, `deferred or refused in 24 h${low}`, held || low ? "warn" : ""));
    if (substituted) out.push(chip("#decisions", substituted, `substitutions${low}`, "warn"));
  }
  return out.join("");
}

const PANELS = [{
  id: "flow",
  label: "Routing",
  urls: ["/api/runtime/routing"],
  render: data => {
    state.data = data;
    state.failedAt = null;
    fillPoolFilter(data);
    paintAll();
    return renderFlow(data);
  },
  // A cold scan answers "pending": read again shortly rather than wait 30 s.
  retry: data => data?.recent?.status === "pending",
  onError: () => {
    state.failedAt = Date.now();
    if (state.data) {
      paintAll();
    } else {
      const message = '<p class="error">Routing data could not load; see the panel above.</p>';
      document.getElementById("decisions-content").innerHTML = message;
      setAge("decisions-age", "unavailable", "bad");
      paintChips();
    }
  },
  onTick: () => tick(),
}];

document.getElementById("decision-filters").addEventListener("change", () => {
  state.shown = PAGE_ROWS;
  if (state.data) document.getElementById("decisions-content").innerHTML = renderDecisions(state.data);
});
document.addEventListener("click", event => {
  const more = event.target.closest && event.target.closest("#show-more");
  if (more && state.data) {
    state.shown += PAGE_ROWS;
    document.getElementById("decisions-content").innerHTML = renderDecisions(state.data);
    return;
  }
  const link = event.target.closest && event.target.closest("[data-outcome]");
  if (link) {
    document.getElementById("filter-outcome").value = link.dataset.outcome;
    state.shown = PAGE_ROWS;
    if (state.data) document.getElementById("decisions-content").innerHTML = renderDecisions(state.data);
  }
});

createPanelRunner({panels: PANELS}).start();
</script>
</body>
</html>
