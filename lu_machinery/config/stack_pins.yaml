---
# Components Dependabot does not update. review_by is the next review, not an expiry.
# Agent CLIs: 2026-10-30. uv: 2026-12-20 (reviewed 2026-11-20). Every other row: 2026-11-16.
# pinned: unknown and source: host means the repository does not pin a version.
pins:
  - name: claude-code
    pinned: unknown
    source: host
    owner: Infra
    review_by: "2026-10-30"
    note: No exact install pin. Minimums only, in lu_machinery/review/isolation.py (2.1.116) and acpx.py (2.1.280 for Opus).
    cli_health:
      cli: claude
      version_argv: ["claude", "--version"]
      env_passthrough: ["CLAUDE_CONFIG_DIR"]
      latest:
        kind: npm
        package: "@anthropic-ai/claude-code"
      auth:
        kind: command
        argv: ["claude", "auth", "status", "--json"]
        parser: json_bool
        field: loggedIn
        allow_nonzero_false: true
  - name: codex
    pinned: unknown
    source: host
    owner: Infra
    review_by: "2026-10-30"
    note: Resolved by shutil.which in scripts/ai_agent_bridge/_config.py. The repo does not pin a version.
    cli_health:
      cli: codex
      version_argv: ["codex", "--version"]
      env_passthrough: ["CODEX_HOME"]
      latest:
        kind: npm
        package: "@openai/codex"
      auth:
        kind: command
        argv: ["codex", "login", "status"]
        parser: text_match
        signed_in_pattern: "Logged in"
        signed_out_pattern: "Not logged in"
        allow_nonzero_for_signed_out: true
  - name: codexbar
    pinned: unknown
    source: host
    owner: Infra
    review_by: "2026-11-21"
    note: Local usage and quota probe CLI. The repo does not pin a version.
    cli_health:
      cli: codexbar
      version_argv: ["codexbar", "--version"]
      latest:
        kind: github
        repo: steipete/CodexBar
      auth:
        kind: none
  - name: grok
    pinned: unknown
    source: host
    owner: Infra
    review_by: "2026-10-30"
    note: No CLI version pin. Admitted model grok-4.7 is in scripts/agent_runtime/adapters/grok_build.py.
    cli_health:
      cli: grok
      version_argv: ["grok", "--version"]
      latest:
        kind: npm
        package: "@xai-official/grok"
      auth:
        kind: command
        argv: ["grok", "models"]
        parser: text_match
        signed_in_pattern: "You are logged in"
        signed_out_pattern: "You are not authenticated"
        allow_nonzero_for_signed_out: true
  - name: cursor-agent
    pinned: unknown
    source: host
    owner: Infra
    review_by: "2026-10-30"
    note: Executable name only, in scripts/orchestration/worker_leftovers.py. The install version is not pinned.
    cli_health:
      cli: cursor-agent
      version_argv: ["cursor-agent", "--version"]
      latest:
        kind: url_regex
        url: "https://cursor.com/install"
        pattern: 'https://downloads\.cursor\.com/lab/([0-9]{4}\.[0-9]{2}\.[0-9]{2}-[A-Za-z0-9]+)/'
      auth:
        kind: command
        argv: ["cursor-agent", "status", "--format", "json"]
        parser: json_bool
        field: isAuthenticated
        allow_nonzero_false: true
  - name: agy
    pinned: unknown
    source: host
    owner: Infra
    review_by: "2026-10-30"
    note: No install pin. Background-wait floor is 1.2.9 in scripts/agent_runtime/adapters/agy.py.
    cli_health:
      cli: agy
      version_argv: ["agy", "--version"]
      env_passthrough: ["AGY_APP_DATA_DIR"]
      latest:
        kind: url_json
        url: "https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_amd64.json"
        field: version
      auth:
        kind: command
        argv: ["agy", "models"]
        parser: text_match
        signed_in_pattern: '^[a-z0-9][a-z0-9._-]+\t'
        signed_out_pattern: "Please sign in"
        allow_nonzero_for_signed_out: true
  - name: opencode
    pinned: unknown
    source: host
    owner: Infra
    review_by: "2026-11-21"
    note: Native opencode CLI used for OpenRouter, DeepSeek and Gemma routes. The repo does not pin a version.
    cli_health:
      cli: opencode
      version_argv: ["opencode", "--version"]
      latest:
        kind: npm
        package: opencode-ai
      auth:
        kind: command
        argv: ["opencode", "auth", "list"]
        parser: credential_count
  - name: gh
    pinned: unknown
    source: host
    owner: DevOps
    review_by: "2026-11-16"
    note: The GitHub CLI is installed on the host. The repo does not pin a version.
  - name: uv
    pinned: "0.13.9"
    source: .github/workflows/pins.txt
    owner: DevOps
    review_by: "2026-12-20"
    note: UV_VERSION in .github/workflows/pins.txt and required-version in pyproject.toml (reviewed 2026-11-20); passed to .github/actions/uv-python/action.yml.
  - name: python
    pinned: "3.12.15"
    source: .python-version
    owner: DevOps
    review_by: "2026-11-16"
    note: CI reads this via python-version-file. pyproject.toml requires-python is >=3.12.
  - name: node
    pinned: "22.23.4"
    source: .nvmrc
    owner: DevOps
    review_by: "2026-11-16"
    note: package.json engines is 22.23.4. Workflows read .nvmrc via node-version-file. validate-yaml.yml schema-check passes 20.
  - name: sqlite
    pinned: unknown
    source: host
    owner: DevOps
    review_by: "2026-11-16"
    note: No install pin. scripts/lexicon/enrich_manifest.py requires sqlite 3.34.0 or newer for one FTS path.
  - name: postgresql
    pinned: "16"
    source: scripts/ci/start_postgres.sh
    owner: DevOps
    review_by: "2026-11-16"
    note: CI installs the postgresql-16 packages and starts cluster 16/main.
  - name: prometheus
    pinned: unknown
    source: host
    owner: DevOps
    review_by: "2026-11-16"
    note: No Prometheus version pin in the repo. Monitoring packages are host-installed.
  - name: grafana
    pinned: unknown
    source: host
    owner: DevOps
    review_by: "2026-11-16"
    note: No Grafana version pin in the repo. Monitoring packages are host-installed.
  - name: alertmanager
    pinned: unknown
    source: host
    owner: DevOps
    review_by: "2026-11-16"
    note: No Alertmanager version pin in the repo. Monitoring packages are host-installed.
  - name: exporters
    pinned: unknown
    source: host
    owner: DevOps
    review_by: "2026-11-16"
    note: No exporter version pin in the repo. Monitoring packages are host-installed.
  - name: mcp-servers
    pinned: unknown
    source: host
    owner: Infra
    review_by: "2026-11-16"
    note: .mcp.json declares the sources server and does not pin a version.
  - name: pinned-model-ids
    pinned: >-
      gpt-6.2-sol, gpt-6-luna, claude-opus-5-5,
      claude-haiku-5-5, claude-sonnet-5-5, gemini-3.8-flash-high,
      grok-4.7, deepseek-v4.1-flash
    source: scripts/config/model_catalog.yaml
    owner: Infra
    review_by: "2026-11-16"
    note: schema_version model-catalog.v1, reviewed_on 2026-10-23. Current default pins omit parked Fable 5.1 (explicit pin only) and retired Kimi ids (OO-58, #11327). Only active models with admitted transports may route. Unsubscribed models are retired (operator 2026-10-23).
  - name: ci-literals
    pinned: ubuntu-latest
    source: .github/workflows/ci.yml
    owner: DevOps
    review_by: "2026-11-16"
    note: Runner image tag. The TruffleHog scanner image tag in the same file is 3.99.0; action SHAs are Dependabot's.
  - name: browser-and-test-runtimes
    pinned: unknown
    source: host
    owner: DevOps
    review_by: "2026-11-16"
    note: Playwright drives the host's installed Google Chrome (apt, auto-updated), sandbox on, never bundled browsers (#12689). The npm and pip Playwright packages are 1.64.1; the pip pin is Dependabot's.
  - name: deployment-tooling
    pinned: unknown
    source: host
    owner: DevOps
    review_by: "2026-11-16"
    note: Pages workflow deploy-pages.yml uses the Node and Python pins. No separate deploy CLI version.
  - name: backup-restore
    pinned: unknown
    source: host
    owner: DevOps
    review_by: "2026-11-16"
    note: Host restic and rclone via scripts/backup-data.sh. No version pin; restore must match that snapshot format.
